    ['|0⟩ is measured in the X basis. What is the probability of “+”?', ['0', '0.5', '1', '0.25'], 1, '|0⟩ is the north pole and the x axis is 90° away. P(+) = (1 + cos 90°)/2 = 0.5. Equivalently, |0⟩ = (|+⟩ + |−⟩)/√2.'],
    ['A state points 60° away from the measurement axis. What is P(+)?', ['0.25', '0.5', '0.75', '0.866'], 2, 'P(+) = (1 + cos 60°)/2 = (1 + 0.5)/2 = 0.75. The closer the state is to the axis, the more likely the + outcome.'],
    ['Start in |0⟩. Measure Z, then X, then Z again. What is the probability that the last result is 0?', ['1', '0.5', '0', '0.25'], 1, 'The first Z gives 0 with certainty. The X measurement leaves |+⟩ or |−⟩, both on the equator, so the final Z is 50/50. The X measurement erased what the qubit knew about Z.'],
    ['What is the standard deviation of a probability estimate with p = 0.5 and 100 shots?', ['0.5', '0.05', '0.005', '0.25'], 1, 'σ = √(p(1 − p)/N) = √(0.25/100) = 0.05, or about ±5 percentage points.'],
    ['To halve the statistical error of an estimate, how many shots do you need?', ['Twice as many', 'Four times as many', 'Half as many', '√2 times as many'], 1, 'The error scales as 1/√N. Halving it means √N must double, so N must quadruple.'],
    ['Which statement about measurement is true?', ['It can be undone with the inverse gate', 'It is irreversible and destroys superpositions', 'It never changes the state', 'It reveals α and β directly'], 1, 'Gates are unitary and reversible; measurement is not. After it, the qubit is in a basis state and the original amplitudes cannot be recovered from that copy.'],
    ['|−⟩ is measured in the X basis. What is the result?', ['+ every time', '− every time', '50/50', 'It depends on the phase'], 1, '|−⟩ is the −x end of the X axis, so the X measurement gives − with certainty. A state is only random relative to bases it is not aligned with.']
  ],
  bloch: [
    ['Where is |1⟩ on the Bloch sphere?', ['North pole', 'South pole', 'On the +x axis', 'At the center'], 1, 'θ = 180° places |1⟩ at the south pole, with coordinates (0, 0, −1). The north pole is |0⟩.'],
    ['What are the Bloch coordinates of |+⟩?', ['(0, 0, 1)', '(1, 0, 0)', '(0, 1, 0)', '(−1, 0, 0)'], 1, '|+⟩ has θ = 90° and φ = 0, so (sin θ cos φ, sin θ sin φ, cos θ) = (1, 0, 0).'],
    ['How are two orthogonal states arranged on the Bloch sphere?', ['At the same point', '90° apart', 'At opposite ends of a diameter', 'Both on the equator'], 2, 'Orthogonal states can be distinguished with certainty, and on the sphere they are antipodal: |0⟩ and |1⟩ at the poles, |+⟩ and |−⟩ at opposite points of the equator.'],
    ['A state has θ = 90° and φ = 180°. Which is it?', ['|+⟩', '|−⟩', '|+i⟩', '|1⟩'], 1, 'θ = 90° puts it on the equator and φ = 180° points it along −x: (|0⟩ + e^(iπ)|1⟩)/√2 = (|0⟩ − |1⟩)/√2 = |−⟩.'],
    ['What does a Bloch vector of length 0.5 indicate?', ['A pure state', 'A partly mixed state, from noise or entanglement', 'An invalid state', 'A measurement outcome'], 1, 'Pure states lie on the surface (length 1). Shorter vectors describe mixed states: the qubit is partly random, either because noise acted or because it is entangled with something else.'],
    ['Why do the amplitudes use θ/2 rather than θ?', ['Pure convention', 'So orthogonal states, 90° apart in amplitude terms, land at opposite points 180° apart on the sphere', 'To normalize the state', 'Because of global phase'], 1, 'Going from |0⟩ to |1⟩ turns cos/sin through 90°, yet those states must sit at opposite poles, 180° apart. Halving the sphere angle inside the amplitudes reconciles the two.'],
    ['What does the longitude φ on the Bloch sphere represent?', ['The probability of 0', 'Global phase', 'Relative phase between |0⟩ and |1⟩', 'How pure the state is'], 2, 'φ is the phase of β relative to α. Global phase is not shown at all, and probabilities depend only on the height z.'],
    ['A state has z = −0.6. What is P(1)?', ['0.2', '0.4', '0.6', '0.8'], 3, 'P(1) = (1 − z)/2 = (1 + 0.6)/2 = 0.8. Points below the equator are more likely to give 1.']
  ],
  gates: [
    ['Which gates are their own inverse?', ['X, Y, Z and H', 'S and T', 'Every gate', 'Only X'], 0, 'X, Y, Z and H are 180° rotations, so applying them twice is a full turn: the identity. S and T are 90° and 45° turns, whose inverses are S† and T†.'],
    ['Starting from |0⟩, which sequence produces |+i⟩?', ['H then S', 'S then H', 'X then H', 'T then H'], 0, 'H takes |0⟩ to |+⟩ on the +x axis, and S turns the equator by 90°, from +x to +y, which is |+i⟩. Applying S first would do nothing to |0⟩, which sits on the z axis.'],
    ['What is HXH?', ['X', 'Y', 'Z', 'H'], 2, 'Conjugating by H swaps the x and z axes, so an X rotation sandwiched between Hs becomes a Z rotation.'],
    ['Why must quantum gates be unitary?', ['To make them fast', 'To preserve total probability for every input state', 'To create entanglement', 'To allow measurement'], 1, 'A matrix keeps every vector’s length, so probabilities keep summing to 1, exactly when it is unitary. Unitarity also makes every gate reversible.'],
    ['Applying T eight times gives…', ['T', 'S', 'Z', 'The identity'], 3, 'Each T is a 45° turn about z; eight of them make 360°, which is the identity (up to an undetectable global phase).'],
    ['About which axis does H rotate the Bloch sphere?', ['x', 'z', 'Halfway between x and z', 'y'], 2, 'H is a 180° rotation about the axis (x + z)/√2. That is why it exchanges |0⟩ and |+⟩ and, conjugating, swaps X and Z.'],
    ['Together with CNOT, which pair of single-qubit gates is universal?', ['{H, S}', '{H, T}', '{X, Z}', '{S, Z}'], 1, 'H and S generate only the Clifford group, which can be simulated classically. Adding T makes the set dense in all single-qubit gates, and with CNOT it is universal.'],
    ['What does Rz(θ) do to |0⟩?', ['Turns it into |1⟩', 'Leaves it unchanged up to a global phase', 'Turns it into |+⟩', 'Creates a superposition'], 1, '|0⟩ lies on the z axis, which a rotation about z leaves fixed. The only change is an overall phase factor, which is unobservable.']
  ],
  interference: [
    ['In the balanced interferometer (φ = 0), which detector clicks?', ['Always D0', 'Always D1', 'Each half the time', 'Neither'], 0, 'With no phase shift, the two paths to D1 have equal and opposite amplitudes and cancel, while those to D0 add. P(D0) = cos²(0) = 1.'],
    ['At φ = 90°, what is P(D0)?', ['0', '0.25', '0.5', '1'], 2, 'P(D0) = cos²(φ/2) = cos²(45°) = 0.5. The arrows for the two paths are at right angles, so they neither fully reinforce nor cancel.'],
    ['Interference persists with one photon at a time. What does that show?', ['Photons split into halves', 'Each photon’s amplitude takes both paths and interferes with itself', 'Photons interact with one another', 'The detectors are noisy'], 1, 'Each photon is detected whole at one detector, yet the statistics show interference. The superposition of paths belongs to each single photon; no second photon is involved.'],
    ['Two arrows of length ½ point in opposite directions. What probability results?', ['1', '½', '¼', '0'], 3, 'They sum to zero, and zero squared is zero. This is complete destructive interference.'],
    ['What does H·H equal?', ['H', 'X', 'The identity', 'Z'], 2, 'H is a 180° rotation, so two of them make a full turn. That is why the balanced interferometer returns every photon to the same output.'],
    ['Why does a which-path detector destroy the interference pattern?', ['It absorbs the photon', 'It makes the path knowable, which removes the coherent relative phase', 'It shifts the phase by π', 'It slows the photon down'], 1, 'Recording the path is a measurement that entangles the photon with the detector. The two paths no longer lead to the same final state, so their amplitudes cannot add; each detector then gets half the photons.'],
    ['At φ = 180°, where do the photons go?', ['D0', 'D1', 'Half to each', 'They are lost'], 1, 'P(D0) = cos²(90°) = 0 and P(D1) = sin²(90°) = 1. In circuit terms, HZH = X flips the output.'],
    ['Which circuit models a Mach–Zehnder interferometer?', ['H, phase, H', 'X, X', 'A CNOT', 'S, T'], 0, 'Each balanced beam splitter acts like a Hadamard on the path qubit, and the phase shifter in one arm is a phase gate between them.']
  ],
  multiqubit: [
    ['How many basis states do 3 qubits have?', ['3', '6', '8', '9'], 2, 'Each qubit contributes a factor of 2: 2³ = 8 basis states, from |000⟩ to |111⟩.'],
    ['What is (|0⟩ + |1⟩)/√2 ⊗ |1⟩?', ['(|01⟩ + |11⟩)/√2', '(|10⟩ + |11⟩)/√2', '(|00⟩ + |11⟩)/√2', '|11⟩'], 0, 'Multiply out: |0⟩|1⟩ + |1⟩|1⟩, divided by √2. The first qubit varies, the second is always 1.'],
    ['CNOT with qubit 0 as control acts on |11⟩. What is the result?', ['|11⟩', '|10⟩', '|01⟩', '|00⟩'], 1, 'The control is 1, so the target (qubit 1) flips from 1 to 0, giving |10⟩.'],
    ['Is (|00⟩ + |01⟩ + |10⟩ + |11⟩)/2 a product state?', ['Yes, it is |+⟩|+⟩', 'No, it is entangled', 'Only up to a phase', 'It is not normalized'], 0, 'a₀₀a₁₁ = ¼ = a₀₁a₁₀, so the product test passes. Indeed (|0⟩ + |1⟩)(|0⟩ + |1⟩)/2 expands to exactly this.'],
    ['Is (|00⟩ + |11⟩)/√2 a product state?', ['Yes', 'No: a₀₀a₁₁ = ½ but a₀₁a₁₀ = 0', 'Only after measurement', 'It is not normalized'], 1, 'The product test fails because the two products differ. This is the Bell state |Φ⁺⟩, the standard example of entanglement.'],
    ['CZ flips the sign of which basis state?', ['|00⟩', '|01⟩', '|10⟩', '|11⟩'], 3, 'CZ applies Z to the target only when the control is 1, which flips the sign only when both qubits are 1. That rule is symmetric, so it does not matter which qubit is called the control.'],
    ['How many numbers describe a product state of n qubits, versus a general state?', ['2n versus 2ⁿ', 'n versus n²', '2ⁿ versus 2n', 'The same number'], 0, 'A product state needs two amplitudes per qubit, so 2n in total. A general state needs one amplitude per bit string, 2ⁿ. Entangled states fill most of that exponentially larger space.'],
    ['Qiskit writes basis states with qubit 0 as the rightmost digit. How does this guide’s |10⟩ (qubit 0 = 1, qubit 1 = 0) appear in Qiskit?', ['|10⟩', '|01⟩', '|11⟩', '|00⟩'], 1, 'Reversing the digit order puts qubit 0’s value on the right: |01⟩. Mixing up these conventions is a common source of errors when comparing tools.']
  ],
  entanglement: [
    ['Which circuit creates |Φ⁺⟩ from |00⟩?', ['CNOT, then H', 'H on qubit 0, then CNOT', 'H on both qubits', 'X, then CNOT'], 1, 'H makes (|00⟩ + |10⟩)/√2 and the CNOT turns |10⟩ into |11⟩. CNOT first would do nothing on |00⟩, and H on both qubits gives a product state.'],
    ['Where is the Bloch vector of one qubit from a Bell pair?', ['Length 1, along z', 'Length 0, at the center', 'Along x', 'It is undefined'], 1, 'Each half on its own gives 50/50 in every basis, so its Bloch vector is zero. All the information is in the correlations between the two qubits.'],
    ['Can Alice send Bob a message by choosing how to measure her half of a Bell pair?', ['Yes, instantly', 'No: Bob’s results are 50/50 whatever Alice does', 'Only over short distances', 'Only with |Ψ⁻⟩'], 1, 'Bob’s local statistics do not depend on Alice’s choice; this is the no-signalling principle. The correlation only shows up when they compare results over an ordinary channel.'],
    ['Running the Bell circuit (H on qubit 0, then CNOT) from |01⟩ gives which state?', ['|Φ⁺⟩', '|Ψ⁺⟩', '|Φ⁻⟩', '|Ψ⁻⟩'], 1, 'H gives (|01⟩ + |11⟩)/√2, and the CNOT turns |11⟩ into |10⟩: (|01⟩ + |10⟩)/√2 = |Ψ⁺⟩.'],
    ['What is the largest CHSH value quantum mechanics allows?', ['2', '2.5', '2√2 ≈ 2.83', '4'], 2, 'This is Tsirelson’s bound. Hidden-instruction models stop at 2, and the algebraic maximum of 4 would need correlations even quantum mechanics does not permit.'],
    ['Both halves of |Φ⁺⟩ are measured in the X basis. The results…', ['always agree', 'always disagree', 'are uncorrelated', 'agree 75% of the time'], 0, '|Φ⁺⟩ is stabilized by X⊗X, so ⟨XX⟩ = +1: the + and − outcomes always match, just as the Z outcomes do. Matching in several incompatible bases is what no classical shared card can do.'],
    ['With Bloch angles a and b in the x–z plane, what is the correlation E for |Φ⁺⟩?', ['cos(a − b)', 'sin(a − b)', '1 − 2|a − b|/π', '(a − b)²'], 0, 'σ_a = cos a·Z + sin a·X, and for |Φ⁺⟩ ⟨ZZ⟩ = ⟨XX⟩ = 1 while the cross terms vanish, giving cos a cos b + sin a sin b = cos(a − b). The linear formula is the hidden-instruction model.'],
    ['What did the 2015 loophole-free Bell experiments show?', ['Local hidden variables explain the data', 'CHSH violations persist with the locality and detection loopholes closed together', 'Entanglement allows signalling', 'Bell’s theorem is wrong'], 1, 'Earlier experiments left loopholes, such as missed detections or settings that could have been communicated. The 2015 tests closed them simultaneously and still saw the violation.']
  ],
  circuits: [
    ['In this guide’s circuits, which qubit is the top wire?', ['Qubit 0, the leftmost ket digit', 'The rightmost ket digit', 'An ancilla', 'A classical bit'], 0, 'The top wire is qubit 0 and is written first in kets, so |10⟩ means the top qubit is 1.'],
    ['Two gates sit in the same column on different qubits. What does that mean?', ['They must run in a set order', 'They act at the same time and commute', 'They cancel', 'It is not allowed'], 1, 'Gates on disjoint qubits commute, so their order does not matter and they can run in parallel. That is what a column represents.'],
    ['What does H on each of 3 qubits do to |000⟩?', ['Makes |111⟩', 'Makes an equal superposition of all 8 basis states', 'Makes a GHZ state', 'Makes |+⟩|0⟩|0⟩'], 1, '|+⟩⊗|+⟩⊗|+⟩ expands to all 8 bit strings with amplitude 1/√8 each. It is a product state, not a GHZ state, because no qubits are entangled.'],
    ['H, then Z, then H on one qubit starting in |0⟩ ends in which state?', ['|0⟩', '|1⟩', '|+⟩', '|−⟩'], 1, 'HZH = X, so the result is X|0⟩ = |1⟩. Step by step: |0⟩ → |+⟩ → |−⟩ → |1⟩.'],
    ['In the phase kickback example (X on q1, H on both, CNOT 0→1, H on q0), where does qubit 0 end up?', ['|0⟩', '|1⟩', '|+⟩', 'Random'], 1, 'The target is |−⟩, so the CNOT multiplies the |1⟩ part of the control by −1, turning |+⟩ into |−⟩. The final H takes |−⟩ to |1⟩.'],
    ['You run 1,024 shots of the Bell pair circuit. What do you expect?', ['1,024 counts of 00', 'About 512 of 00 and 512 of 11', 'Equal counts of all four outcomes', 'All 01'], 1, '(|00⟩ + |11⟩)/√2 gives 00 and 11 with probability ½ each and never 01 or 10. Shot noise makes the split only approximately even.'],
    ['Why is CZ drawn with two identical dots?', ['Just style', 'It acts the same whichever qubit is called the control', 'It is two gates', 'It is not a real gate'], 1, 'CZ only flips the sign of |11⟩, a rule that treats both qubits alike, so there is no distinguished target.'],
    ['How many amplitudes does the simulator store for 4 qubits?', ['4', '8', '16', '32'], 2, '2⁴ = 16. Each extra qubit doubles that, which is why brute-force simulation stops scaling.']
  ],
  teleportation: [
    ['How likely is each of Alice’s four measurement outcomes?', ['It depends on α and β', 'Each has probability 1/4', '00 is most likely', 'Only 00 and 11 occur'], 1, 'In the regrouped state each of Alice’s four branches has amplitude ½ times a normalized state of Bob’s qubit, so each outcome has probability ¼ regardless of the message. Her results reveal nothing about |ψ⟩.'],
    ['What must Alice and Bob share in advance?', ['A copy of |ψ⟩', 'A Bell pair', 'A classical key', 'Nothing'], 1, 'The protocol consumes one shared Bell pair, plus two classical bits sent at the end.'],
    ['Alice gets m₀ = 0, m₁ = 1. What does Bob apply?', ['Nothing', 'X', 'Z', 'X, then Z'], 1, 'Outcome 01 leaves Bob with α|1⟩ + β|0⟩ = X|ψ⟩, so a single X restores the message.'],
    ['What happens to Alice’s original qubit?', ['It keeps |ψ⟩', 'Her measurement destroys its state', 'It stays entangled with Bob forever', 'It travels to Bob'], 1, 'After Alice measures, her qubits hold only her two random bits. The state now exists only on Bob’s side, so no copy is ever made.'],
    ['Why can’t teleportation send information faster than light?', ['The Bell pair is slow', 'Bob needs Alice’s two classical bits, which travel no faster than light', 'Measurement takes time', 'It can, in principle'], 1, 'Without the bits, Bob’s qubit is one of four possibilities he cannot tell apart; on average it is completely random. The useful state only appears after the bits arrive.'],
    ['Why can’t Alice simply measure |ψ⟩ and send Bob the result?', ['Measuring is too slow', 'One measurement yields one bit and destroys α and β', 'She can; that works too', 'Because of no-signalling'], 1, 'A single copy cannot reveal its amplitudes. Measurement gives one bit and collapses the state, so the continuous information in α and β would be lost.'],
    ['The no-cloning theorem follows from…', ['energy conservation', 'the linearity of quantum mechanics', 'the uncertainty principle alone', 'relativity'], 1, 'A copier that works for |0⟩ and |1⟩ would, by linearity, turn |+⟩|0⟩ into an entangled state rather than |+⟩|+⟩. So no linear (unitary) process can copy arbitrary states.'],
    ['After Alice’s operations but before Bob’s correction, what does Bob’s qubit look like, averaged over Alice’s unknown results?', ['|ψ⟩', '|0⟩', 'Completely mixed, at the center of the sphere', '|+⟩'], 2, 'The four possible states X^m₁Z^m₀|ψ⟩, equally weighted, average to the maximally mixed state. That is the no-signalling principle in action.']
  ],
  bb84: [
    ['In BB84, what do Alice and Bob announce publicly?', ['Their bits', 'Their bases', 'Both', 'Neither'], 1, 'They reveal only which basis each used, so they can keep the positions where the bases matched. The bits stay secret, except for a sample sacrificed to estimate errors.'],
    ['Bob measures a diagonally polarized photon in the rectilinear basis. What does he get?', ['Always the right bit', 'Always the wrong bit', 'A random bit, 50/50', 'Nothing'], 2, 'A 45° photon is an equal superposition of horizontal and vertical, so a rectilinear measurement gives either result with probability ½. That is why mismatched positions are discarded.'],
    ['Why can’t Eve simply copy each photon and measure the copy later?', ['Photons are too fast', 'The no-cloning theorem forbids copying unknown states', 'Copies would be too dim', 'She can'], 1, 'If she could clone the photons she could wait for the bases to be announced and learn the key without disturbing anything. No-cloning rules that out.'],
    ['Roughly what error rate can BB84 tolerate with one-way post-processing?', ['1%', 'About 11%', '25%', '50%'], 1, 'The Shor–Preskill security proof gives about 11%. Above that, Eve might know enough that no secret key can be distilled, so Alice and Bob abort.'],
    ['What does privacy amplification do?', ['Lengthens the key', 'Shortens the key so Eve’s partial information becomes negligible', 'Corrects bit errors', 'Encrypts the channel'], 1, 'Hashing the key down to fewer bits spreads Eve’s partial knowledge so thin that she knows essentially nothing about the result. Error correction is a separate step.'],
    ['Why must the classical channel be authenticated?', ['To make it faster', 'Otherwise Eve could pose as Bob to Alice and as Alice to Bob', 'To encrypt the bases', 'It does not need to be'], 1, 'Without authentication, a man-in-the-middle could run separate BB84 sessions with each party. QKD needs a small pre-shared secret or other authentication to start.'],
    ['A photon polarized at 135° encodes…', ['bit 0, rectilinear basis', 'bit 1, rectilinear basis', 'bit 0, diagonal basis', 'bit 1, diagonal basis'], 3, 'In this lesson’s convention, the diagonal basis uses 45° for 0 and 135° for 1. The rectilinear basis uses horizontal for 0 and vertical for 1.'],
    ['Why is QKD unaffected by Shor’s algorithm?', ['It uses longer keys', 'Its security rests on physics rather than on a hard computational problem', 'It uses lattices', 'It is classical'], 1, 'Shor’s algorithm breaks problems like factoring. BB84’s security comes from measurement disturbance and no-cloning, which no computer can bypass.']
  ],
  deutsch: [
    ['For n = 3 input bits, how many queries does a deterministic classical algorithm need in the worst case?', ['1', '3', '5', '8'], 2, '2ⁿ⁻¹ + 1 = 5. After four equal outputs a balanced function is still possible (the other four could all differ), so a fifth query is needed.'],
    ['After H on all three qubits of |000⟩, what is each amplitude?', ['1/8', '1/√8', '1/3', '1'], 1, 'There are 8 basis states with equal amplitudes whose squares sum to 1, so each amplitude is 1/√8 ≈ 0.354.'],
    ['For the constant function f = 1, what is the final state?', ['|000⟩ with amplitude −1', '|111⟩', 'Uniform over all inputs', 'The zero vector'], 0, 'Every term picks up the same sign −1, a global phase. The final Hadamards return everything to |000⟩, multiplied by −1, so you measure 000 with certainty.'],
    ['What does phase kickback do?', ['Copies f(x) into the output qubit', 'Writes (−1)^f(x) onto the input register', 'Measures f', 'Removes entanglement'], 1, 'With the output qubit in |−⟩, flipping it is the same as multiplying by −1. The output qubit is unchanged and the sign lands on the input term |x⟩.'],
    ['f has three outputs equal to 1 out of eight, breaking the promise. What is P(|000⟩) at the end?', ['0', '1/16', '1/4', '1'], 1, 'The amplitude of |000⟩ is the average sign: (5 − 3)/8 = 1/4. The probability is its square, 1/16.'],
    ['Against which classical algorithms does Deutsch–Jozsa have an advantage?', ['Randomized algorithms allowed a small error', 'Deterministic, zero-error algorithms', 'All classical algorithms', 'None'], 1, 'A randomized algorithm that samples a few inputs is right with high probability. The exponential separation holds only against exact, deterministic algorithms.'],
    ['Which later algorithm uses the same H, oracle, H structure to get an exponential separation even against randomized algorithms?', ['Grover', 'Simon', 'HHL', 'VQE'], 1, 'Simon’s problem needs about 2^(n/2) queries for any classical algorithm, randomized or not, but O(n) quantum queries. Lesson 29 covers it.'],
    ['Why is the oracle written U_f|x⟩|y⟩ = |x⟩|y ⊕ f(x)⟩ instead of |x⟩ → |f(x)⟩?', ['Convention only', 'Quantum operations must be reversible, and f may not be', 'To save qubits', 'For speed'], 1, 'A constant function sends many inputs to one output, so |x⟩ → |f(x)⟩ cannot be undone. Keeping x and XORing the answer into a spare qubit makes the operation reversible and unitary.']
  ],
  grover: [
    ['Roughly how many oracle calls does Grover need for N = 1,000,000?', ['1,000', 'About 785', '500,000', '20'], 1, '(π/4)√N = 0.785 × 1,000 ≈ 785. A classical search needs about N/2 = 500,000 on average.'],
    ['For N = 4, what is the success probability after one iteration?', ['50%', '75%', '100%', '25%'], 2, 'sin θ = 1/√4 = ½, so θ = 30°. After one iteration the angle is 3θ = 90°, and sin²(90°) = 1. Four items are found with certainty in one step.'],
    ['What happens if you run many more iterations than the optimum?', ['The probability stays at 1', 'The state overshoots and the probability falls', 'It converges to the answer', 'Error correction steps in'], 1, 'Each iteration rotates by a fixed angle 2θ. Past the target, the rotation continues, so P(success) = sin²((2k + 1)θ) oscillates.'],
    ['By how much does each Grover iteration rotate the state?', ['θ', '2θ, where sin θ = 1/√N', 'π/4', '1/N'], 1, 'The oracle and the diffusion are two reflections in the same plane; their product is a rotation by twice the angle between the reflection axes.'],
    ['Is Grover’s quadratic speedup the best possible for unstructured search?', ['No, exponential is possible', 'Yes, about √N queries are required', 'It is unknown', 'Only for small N'], 1, 'Bennett, Bernstein, Brassard and Vazirani proved in 1997 that any quantum algorithm needs on the order of √N queries, so Grover is optimal.'],
    ['What does the oracle do to the marked item’s amplitude?', ['Doubles it', 'Flips its sign', 'Sets it to zero', 'Measures it'], 1, 'The oracle multiplies the marked amplitude by −1 using phase kickback. The size is unchanged; the diffusion step then turns the sign difference into a larger amplitude.'],
    ['Amplitudes before diffusion: three at 0.5 and the marked one at −0.5. What is the marked amplitude after inversion about the average?', ['0.5', '1.0', '0', '−1'], 1, 'The average is (0.5 + 0.5 + 0.5 − 0.5)/4 = 0.25. The marked amplitude becomes 2 × 0.25 − (−0.5) = 1.0, and each other one becomes 2 × 0.25 − 0.5 = 0.'],
    ['What is the usual countermeasure to Grover search against symmetric ciphers?', ['Shorter keys', 'Doubling the key length, for example AES-256', 'Switching to RSA', 'Nothing can help'], 1, 'Grover reduces a brute-force search over 2^k keys to about 2^(k/2) steps, so doubling the key length restores the margin. RSA would be worse, since Shor breaks it.']
  ],
  qft: [
    ['What is QFT|0⟩?', ['|0⟩', 'The equal superposition of all basis states', '|N − 1⟩', 'A GHZ state'], 1, 'With x = 0 every phase e^(2πi·0·k/N) is 1, so all N amplitudes equal 1/√N.'],
    ['In QFT|x⟩, how far does the leftmost output qubit turn for each step of x?', ['Half a turn', 'A quarter turn', '1/2ⁿ of a turn', 'A full turn'], 0, 'Its phase is 2π·x/2, so it alternates between 0 and π: it records the last bit of x. Each qubit further right turns half as fast.'],
    ['Is QFT|x⟩ an entangled state?', ['Yes, maximally', 'No, it is a product state', 'Only for odd x', 'Only for n > 3'], 1, 'It factors into a product of single-qubit equator states, one per qubit. The QFT can still create entanglement when its input is a superposition.'],
    ['Shifting a periodic input by an offset changes what in the QFT output?', ['The positions of the peaks', 'Only the phases, not the probabilities', 'Nothing at all', 'The period'], 1, 'A shift multiplies each output amplitude by a phase e^(2πi·offset·k/N). Squared magnitudes are unchanged, which is why period finding works without knowing where the pattern starts.'],
    ['Why can’t the QFT replace the classical FFT for processing data?', ['It is slower', 'Its output lives in amplitudes that cannot be read out directly', 'It is inaccurate', 'It needs too many qubits'], 1, 'Reading all N output amplitudes would take many repetitions and loading the input is expensive. The QFT helps only inside algorithms where a single measurement afterwards is informative.'],
    ['What phase does the controlled rotation R_k apply?', ['2π/k', '2π/2^k', 'π/k', 'kπ'], 1, 'R_k = diag(1, e^(2πi/2^k)). R₂ is a quarter turn (S) and R₃ an eighth (T).'],
    ['About how many operations does a classical FFT of 2ⁿ numbers take?', ['n²', 'n·2ⁿ', '2ⁿ', 'n'], 1, 'The FFT costs N log N with N = 2ⁿ, which is n·2ⁿ. The QFT circuit needs only about n²/2 gates, but its output is not directly readable.'],
    ['A period r = 5 input on N = 32 points gives peaks where?', ['Exactly at multiples of 6', 'Near multiples of 6.4, slightly spread out', 'Only at 0', 'Spread evenly everywhere'], 1, 'The peaks sit at multiples of N/r = 6.4, which are not integers, so probability spreads over the nearest outputs. Shor’s algorithm handles this with continued fractions.']

    ['Why must r be even?', ['For speed', 'So that aʳ − 1 factors as (a^(r/2) − 1)(a^(r/2) + 1)', 'So that Q is even', 'It need not be'], 1, 'With r even, the difference of squares splits aʳ − 1, a multiple of N, into two integer factors. If r is odd, that split is not available and you pick a new a.'],
    ['N = 21, a = 2, r = 6. What do gcd(2³ − 1, 21) and gcd(2³ + 1, 21) give?', ['7 and 3', '1 and 21', '2 and 11', '9 and 7'], 0, '2³ = 8. gcd(7, 21) = 7 and gcd(9, 21) = 3, so 21 = 3 × 7.'],
    ['What if gcd(a, N) > 1 for your random a?', ['Pick another a', 'You have already found a factor', 'The algorithm fails', 'Then r = 1'], 1, 'That gcd is a nontrivial divisor of N. For large N this lucky case is extremely rare, but it costs nothing to check.'],
    ['Which part dominates the quantum cost of Shor’s algorithm?', ['The Hadamards', 'Modular exponentiation, computing aˣ mod N', 'The final measurement', 'The continued fractions'], 1, 'Reversible arithmetic on thousands of qubits needs billions of gates. The QFT is comparatively cheap, and continued fractions run on a classical computer.'],

    ['What is the main defensive response to Shor’s threat?', ['Longer AES keys', 'Moving to post-quantum public-key standards such as FIPS 203–205', 'SHA-1', 'TLS 1.0'], 1, 'Shor breaks RSA and elliptic curves, which longer symmetric keys do not fix. NIST’s lattice- and hash-based standards replace them (Lesson 39).']

  variational: [
    ['In VQE, what runs on the classical computer?', ['State preparation', 'The optimizer that updates the parameters', 'Measuring the Pauli terms', 'Nothing'], 1, 'The quantum device prepares states and estimates energies; a classical optimizer decides the next parameters. That division is what makes the method hybrid.'],
    ['For H = aZ + bX with a = 1 and b = 0, what is the ground state?', ['|0⟩', '|1⟩', '|+⟩', '|−⟩'], 1, 'The energy is ⟨Z⟩ = z, which is lowest at z = −1, the south pole |1⟩.'],
    ['What is the ground energy of H = aZ + bX + cY?', ['−(a + b + c)', '−√(a² + b² + c²)', '0', '−a'], 1, 'The energy is the dot product of the Bloch vector with (b, c, a). It is minimized by pointing the vector opposite to (b, c, a), giving minus its length.'],
    ['Lowering the number of shots per estimate mainly makes the optimizer’s path…', ['faster', 'noisier', 'shorter', 'exact'], 1, 'Each energy and gradient estimate gets a larger statistical error (∝ 1/√shots), so the steps wander.'],
    ['What is a barren plateau?', ['A region of high energy', 'A landscape whose gradients vanish exponentially with the number of qubits', 'A kind of ansatz', 'A hardware fault'], 1, 'When gradients are exponentially small almost everywhere, estimating them needs exponentially many shots and the optimizer cannot tell which way is downhill.'],

    ['Is a practical quantum advantage for VQE established?', ['Yes, for all molecules', 'No, it remains open', 'Yes, for H₂', 'It is proved impossible'], 1, 'Demonstrations so far involve molecules that classical computers handle easily. Whether VQE can beat strong classical methods on a useful problem is unresolved.']

  decoherence: [
    ['Under T₁ relaxation, where does the Bloch vector head?', ['The center', 'The north pole, |0⟩', 'The south pole', 'The equator'], 1, 'Relaxation releases energy to the environment, so the excited state |1⟩ decays to the ground state |0⟩ at the north pole.'],
    ['Pure dephasing shrinks which Bloch components?', ['z only', 'x and y', 'All three equally', 'None'], 1, 'Dephasing randomizes the relative phase, which is the longitude, so the horizontal components average away while the populations (z) stay put.'],
    ['In the lab, what does detuning do?', ['Makes decay faster', 'Makes the vector precess around z while it decays', 'Flips the qubit', 'Stops the decay'], 1, 'A frequency offset adds a steady phase rotation. Combined with T₂ decay, the vector spirals inward, which is the signal seen in a Ramsey experiment.'],
    ['Start in |+⟩ with T₂ = 40 µs and no detuning. After 40 µs, what is the x component?', ['About 0.37', '0.5', 'About 0.63', '0'], 0, 'With no detuning, x(t) = x₀·e^(−t/T₂). Starting from x₀ = 1 at |+⟩, after one T₂ the x component is e^(−1) ≈ 0.37: the phase information has decayed to about a third.'],
    ['Start in |1⟩ with T₁ = 50 µs. What is the probability it is still in |1⟩ after 50 µs?', ['50%', 'About 37%', 'About 63%', '0%'], 1, 'The excited population decays as e^(−t/T₁) = e^(−1) ≈ 0.37.'],

  qec: [

    ['How does the bit-flip code encode α|0⟩ + β|1⟩?', ['α|000⟩ + β|111⟩', '(α|0⟩ + β|1⟩)⊗³', 'α|0⟩ + β|111⟩', '|ψ⟩|00⟩'], 0, 'Two CNOTs from the data qubit to two fresh qubits produce α|000⟩ + β|111⟩. The tensor cube of |ψ⟩ would be three clones, which no-cloning forbids.'],
    ['Does the syndrome reveal α and β?', ['Yes', 'No, only which qubit flipped', 'Only α', 'Only |α|²'], 1, 'The parity checks give the same answer for |000⟩ and |111⟩, so they carry no information about the encoded amplitudes, and measuring them leaves the superposition intact.'],
    ['Syndrome Z₀Z₁ = −1 and Z₁Z₂ = −1. Which qubit flipped?', ['Qubit 0', 'Qubit 1', 'Qubit 2', 'None'], 1, 'Qubit 1 disagrees with both neighbours, so it is the one shared by both failing checks.'],
    ['Two qubits flip in the bit-flip code. What does the decoder do?', ['Corrects both', 'Applies the wrong correction and causes a logical error', 'Detects it and stops', 'Nothing'], 1, 'Two flips produce the same syndrome as one flip on the remaining qubit. The decoder flips that one, leaving all three flipped: a logical X error. A distance-3 code corrects only one error.'],
    ['What protects against the phase flips the bit-flip code misses?', ['Repeating in time', 'Codes such as Shor’s 9-qubit code or the surface code, which also check X-type parities', 'Faster gates', 'Cooling the chip'], 1, 'Phase flips (Z errors) commute with Z-type checks and go unseen. Adding X-type checks catches them; the surface code measures both kinds.'],

    ['Which platform typically has the fastest two-qubit gates?', ['Trapped ions', 'Superconducting circuits', 'Neutral atoms', 'Photonic'], 1, 'Superconducting gates take tens to hundreds of nanoseconds. Ion and atom gates usually take microseconds or longer.'],

    ['About how much memory does a 1,000-qubit tableau use in this lab’s bit-packed format?', ['16 bytes', 'About 500 KB', '16 GB', '10³⁰⁰ bytes'], 1, 'Roughly 2n rows × n bits for X and again for Z: 2,001 × 1,000 × 2 bits ≈ 500 KB. A state vector would need 16 × 2¹⁰⁰⁰ bytes.'],

    ['Two levels of concatenation with p/p_th = 0.1. The logical error rate is about…', ['p_th × 0.1²', 'p_th × 0.1⁴', 'p_th × 0.1', 'p_th × 0.01²'], 1, 'p_k = p_th (p/p_th)^(2^k). For k = 2 the exponent is 4, giving p_th × 10⁻⁴. Each level squares the ratio.'],
    ['What does the threshold theorem (1996–97) guarantee?', ['Zero errors', 'Arbitrarily reliable computation if component error rates are below a constant, with polylogarithmic overhead', 'No need for error-correcting codes', 'Exponential overhead'], 1, 'Below threshold, adding more levels of protection drives the logical error rate down faster than the cost grows, so long computations become possible in principle.'],
    ['In the lab, an X fault on the ancilla right after the second CNOT produces what?', ['No data error', 'X on d2 and d3', 'X on all four data qubits', 'Z on d0'], 1, 'The X on the ancilla (the control) is copied onto each later target, d2 and d3. The ancilla’s final measurement is unaffected because H turns its X into Z.']

  magic: [
    ['Which gates are free on the surface code because they are tracked in software?', ['T', 'Pauli gates', 'CNOT', 'H'], 1, 'A Pauli gate maps Paulis to Paulis up to sign, so the control software can record it in a Pauli frame and reinterpret later measurement results without touching the qubits.'],
    ['How does lattice surgery implement a CNOT?', ['With transversal gates', 'By merging and splitting patches to measure joint logical operators', 'By braiding photons', 'By magic states'], 1, 'Measuring Z⊗Z and X⊗X between patches and an ancilla patch, then correcting with Paulis, implements a CNOT using only nearest-neighbour operations.'],
    ['What is the magic state |T⟩?', ['|0⟩', 'T|+⟩ = (|0⟩ + e^(iπ/4)|1⟩)/√2', '|+⟩', 'H|0⟩'], 1, 'It is the equator state at φ = 45°. Consuming it with a CNOT, a measurement and a possible S correction applies T to a data qubit.'],
    ['How many noisy input states does one round of 15-to-1 distillation consume per output?', ['1', '7', '15', '35'], 2, 'Fifteen inputs, one output, with error about 35p³. The 35 counts the number of input-error patterns that slip through undetected.'],
    ['About how many T gates does synthesizing an arbitrary rotation to precision ε cost?', ['log₂(1/ε)', 'About 3·log₂(1/ε)', '1/ε', 'One'], 1, 'Optimal Clifford+T synthesis (Ross–Selinger) needs about 3 log₂(1/ε) T gates. Precision 10⁻¹⁰ therefore costs roughly 100 T gates.'],
    ['Why can’t Clifford operations alone provide a quantum advantage?', ['They are too noisy', 'By Gottesman–Knill they can be simulated classically', 'They are slow', 'They are not unitary'], 1, 'Any Clifford circuit with Pauli measurements runs efficiently on a classical computer. A non-Clifford resource, such as magic states, is needed for universality and advantage.'],
    ['What does magic state cultivation (2024) do?', ['Removes the need for T gates', 'Grows a high-fidelity T state inside a surface-code patch at low cost', 'Decodes syndromes', 'Defines a hardware platform'], 1, 'Cultivation checks and enlarges a magic state step by step within one patch, avoiding large distillation factories. It is a big part of why recent RSA estimates dropped.'],
    ['Two rounds of 15-to-1 distillation starting from 10⁻³. What is the output error?', ['3.5 × 10⁻⁸', 'About 1.5 × 10⁻²¹', '10⁻⁶', '10⁻⁹'], 1, 'Round one: 35 × (10⁻³)³ = 3.5 × 10⁻⁸. Round two: 35 × (3.5 × 10⁻⁸)³ ≈ 1.5 × 10⁻²¹. Each round cubes the error.']

  codes: [
    ['What are the parameters of IBM’s gross code?', ['[[144, 12, 12]]', '[[288, 1, 25]]', '[[7, 1, 3]]', '[[49, 1, 7]]'], 0, '144 data qubits, 12 logical qubits, distance 12. With 144 check qubits it uses 288 physical qubits in total.'],
    ['How many physical qubits does the gross code use, counting data and checks?', ['144', '288', '12', '1,152'], 1, 'One check qubit per data qubit: 144 + 144 = 288. Surface codes of comparable distance would need about 12 × 287 ≈ 3,400.'],
    ['What makes a qLDPC code family “good”?', ['Low error rates', 'Constant rate k/n and distance that grows linearly with n', 'Easy decoding', 'Few qubits'], 1, 'Good codes keep a fixed fraction of qubits as logical ones and still grow their distance proportionally. Panteleev and Kalachev showed in 2021 that such codes exist.'],
    ['What is the main advantage of 2D colour codes?', ['The highest threshold', 'Transversal Clifford gates in a 2D layout', 'The fewest qubits', 'No decoding needed'], 1, 'Colour codes allow every Clifford gate transversally while keeping local checks. In return they have heavier checks, a lower threshold and harder decoding.'],
    ['Which error do cat qubits suppress exponentially?', ['Phase flips', 'Bit flips', 'Leakage', 'Measurement errors'], 1, 'Bit-flip suppression grows exponentially with the mean photon number, while phase flips grow only linearly. The remaining errors can then be handled by a simple repetition code.'],
    ['Why do neutral atoms make qLDPC codes easier?', ['They are colder', 'Atoms can be moved, giving flexible long-range connectivity', 'They have faster gates', 'They need no decoding'], 1, 'Optical tweezers can rearrange atoms between steps, so distant qubits can be brought together for the long-range checks qLDPC codes need.'],
    ['What is the smallest code that corrects an arbitrary single-qubit error?', ['[[3, 1, 1]]', '[[5, 1, 3]]', '[[7, 1, 3]]', '[[9, 1, 3]]'], 1, 'The five-qubit code meets the quantum Singleton bound with equality. Steane (7) and Shor (9) are larger but have more convenient gate properties.'],
    ['How do erasure qubits help error correction?', ['They never fail', 'The decoder learns where errors happened, which raises the effective threshold', 'They are cheaper to make', 'They need no ancillas'], 1, 'Knowing the location of an error makes it much easier to correct: a distance-d code can fix up to d − 1 erasures but only (d − 1)/2 unknown errors.']

  resources: [
    ['What is the first step of a resource estimate?', ['Choosing a chip', 'Counting the algorithm’s logical qubits, T gates and depth', 'Buying a refrigerator', 'Fixing d = 25'], 1, 'The logical workload sets everything else: the error budget per operation, the code distance, the factory count and the runtime.'],
    ['In the lab’s model, why is extra logical area reserved for routing?', ['To store magic states', 'Lattice surgery needs room for patches to interact', 'For cooling', 'For decoders'], 1, 'Logical CNOTs merge patches through ancilla regions, so a layout needs corridors between data patches. Compact layouts trade space for time.'],
    ['Roughly what sets the runtime?', ['Logical qubits × distance', 'Sequential T steps × d rounds × cycle time', 'Qubit count × cycle time', 'It is fixed'], 1, 'Each logical step takes about d syndrome rounds, and the T gates on the critical path must happen in order, so they dominate.'],
    ['What physical error rate did Gidney’s 2025 RSA-2048 estimate assume?', ['1%', '0.1%', '0.001%', '10%'], 1, 'It assumed uniform 0.1% noise with a 1 µs cycle and 10 µs control reaction time. Different assumptions change the result substantially.'],
    ['Which tools produce detailed resource estimates?', ['Spreadsheets only', 'The Azure Quantum Resource Estimator and Qualtran', 'PyMatching', 'QuTiP'], 1, 'These tools model algorithms, codes, factories and layouts in detail. PyMatching is a decoder, and QuTiP simulates open quantum systems.'],
    ['In the lab’s model, what happens if p is at or above the threshold?', ['d = 3 is enough', 'No code distance works', 'd = 5 works', 'The runtime doubles'], 1, 'Above threshold, bigger codes make things worse, so no distance meets the error budget.'],
    ['How do platforms with slow cycles, such as atoms and ions, compensate?', ['Smaller codes', 'Parallelism', 'Higher temperatures', 'Fewer qubits'], 1, 'Running many operations at once, and using connectivity tricks such as transversal gates between moved qubits, offsets slow syndrome cycles.'],
    ['Why can two published estimates for the same algorithm differ by 100×?', ['Typos', 'Different assumptions about error rates, cycle times, magic-state methods and algorithm optimizations', 'Different units', 'Random noise'], 1, 'Each assumption enters multiplicatively. Always compare the assumptions before comparing the headline numbers.']

  query: [
    ['How many quantum queries does Bernstein–Vazirani need for n = 6?', ['1', '6', '64', '3'], 0, 'One phase-oracle query followed by Hadamards puts all amplitude on |a⟩, whatever n is.'],
    ['How many classical queries does the Bernstein–Vazirani problem need for n = 6?', ['1', '6', '32', '64'], 1, 'Each query returns one bit, a·x mod 2, so at least n queries are needed. Querying x = 100000, 010000, and so on reads one bit of a each time.'],
    ['About how many runs does Simon’s algorithm need for n input bits?', ['About n', 'About 2ⁿ', 'About 2^(n/2)', '1'], 0, 'Each run gives a random y with y·s = 0. About n − 1 independent equations determine s, and a few extra runs cover repeats.'],
    ['How many queries does a classical randomized algorithm need for Simon’s problem?', ['About n', 'About 2^(n/2)', 'About 2ⁿ', '1'], 1, 'It must find two inputs with the same output, a collision, and by the birthday bound that takes about 2^(n/2) random queries.'],
    ['A hidden subgroup algorithm for which group would solve graph isomorphism?', ['A cyclic group', 'The symmetric group', 'Z₂ⁿ', 'The integers'], 1, 'Graph isomorphism reduces to a hidden subgroup problem over the symmetric group, which is non-abelian. Efficient quantum algorithms there are unknown.'],
    ['How many quantum queries are needed to compute the parity of N bits?', ['1', '√N', 'N/2', 'log N'], 2, 'The polynomial method shows at least N/2 queries are needed, and N/2 suffices. So quantum computers give at most a factor of two for parity.'],
    ['What speedup does amplitude estimation give for Monte Carlo estimation?', ['Exponential', 'Quadratic', 'None', 'Cubic'], 1, 'Estimating an average to precision ε takes about 1/ε quantum steps instead of 1/ε² classical samples, a quadratic improvement.'],
    ['Why is the query model important?', ['It matches real hardware', 'Lower bounds can be proved there, unlike for general circuits', 'It is easier to build', 'It avoids measurement'], 1, 'Proving that no fast algorithm exists is almost impossible in general (that would separate P from PSPACE). In the query model such proofs exist, which grounds statements like “Grover is optimal”.']

  qpe: [
    ['QPE returns the nearest t-bit estimate with probability at least…', ['50%', '4/π² ≈ 41%', '100%', '1/t'], 1, 'The worst case is a phase exactly halfway between grid points. Within one step of the best estimate the probability is at least 8/π² ≈ 81%.'],
    ['Which operator does ancilla j control in QPE?', ['U', 'U^(2^j)', 'U^j', 'U†'], 1, 'Ancilla j picks up phase 2π·φ·2^j by kickback, which records the j-th binary digit of φ. Together the ancillas form the Fourier clocks of Lesson 14.'],

    ['How does the error of a first-order Trotter formula scale?', ['t/r', 't²/r', 't³/r²', '1/r²'], 1, 'Each of the r steps contributes an error of order (t/r)² times a commutator, so the total is about t²/r. Doubling r halves it.'],
    ['Who showed in 1996 that local Hamiltonians can be simulated efficiently?', ['Shor', 'Lloyd', 'Grover', 'Kitaev'], 1, 'Seth Lloyd used Trotter formulas to show that Feynman’s idea of simulating physics with a quantum computer works for local Hamiltonians.'],
    ['What is the optimal cost of Hamiltonian simulation achieved by qubitization?', ['t × log(1/ε)', 'About t + log(1/ε)', 't²', '1/ε'], 1, 'Low and Chuang showed the costs in time and precision add rather than multiply, which is optimal.'],
    ['What does HHL’s exponential speedup require?', ['Dense matrices', 'A sparse, well-conditioned A, fast loading of b, and needing only properties of the solution', 'Classical output of every entry', 'No phase estimation'], 1, 'If any condition fails, for example reading out all of x or a large condition number, the advantage can disappear. Aaronson called this the fine print.']

  advantage: [
    ['Who proved BQP ⊆ PP?', ['Shor', 'Adleman, DeMarrais and Huang', 'Raz and Tal', 'Kitaev'], 1, 'Their 1997 result shows that a probabilistic classical machine with unbounded error can decide anything a quantum computer can.'],
    ['What does PostBQP equal?', ['BQP', 'PP', 'NP', 'P'], 1, 'Aaronson showed in 2005 that quantum computing with postselection is exactly PP, giving a quantum proof of a classical theorem about PP.'],
    ['Relative to an oracle, BQP is not contained in which class?', ['PSPACE', 'PH, the polynomial hierarchy', 'EXP', 'PP'], 1, 'Raz and Tal (2018) built an oracle problem that quantum computers solve but that lies outside the entire polynomial hierarchy. PSPACE, EXP and PP contain BQP outright.'],
    ['How are the rescaled probabilities Np of deep random circuits distributed?', ['Gaussian', 'Exponentially (Porter–Thomas)', 'Uniformly', 'Poisson'], 1, 'Random states spread amplitudes like random complex Gaussians, whose squared magnitudes follow e^(−x) after rescaling. The lab shows shallow circuits approaching it.'],

    ['A device mixes 30% uniform noise into ideal samples (ideal XEB = 1). What is its XEB?', ['0.3', 'About 0.7', '1', '0'], 1, 'XEB is linear in the sampling distribution, so it becomes (1 − 0.3) × 1 = 0.7. Experiments use this to estimate fidelity.'],
    ['If exact random circuit sampling were classically easy, what would follow?', ['P = NP', 'The polynomial hierarchy would collapse', 'BQP = P', 'Nothing'], 1, 'Exact sampling hardness reduces to the hardness of #P-type problems, and an efficient classical sampler would collapse PH, which is considered very unlikely. Approximate sampling needs extra conjectures.'],

  noisesim: [
    ['Which state does ρ = I/2 represent?', ['|0⟩', 'The center of the Bloch ball, the completely mixed state', '|+⟩', 'The equator'], 1, 'ρ = (I + r·σ)/2 with r = 0. Every measurement gives 50/50.'],
    ['What condition must Kraus operators satisfy?', ['ΣKₖ = I', 'ΣKₖ†Kₖ = I', 'Each Kₖ is unitary', 'Each Kₖ is Hermitian'], 1, 'This makes the channel trace-preserving, so probabilities still sum to 1. Individual Kraus operators need not be unitary; amplitude damping’s are not.'],
    ['Depolarizing noise with p = 1 maps every state to…', ['|0⟩', 'The completely mixed state', 'Itself', '|1⟩'], 1, 'ρ → (1 − p)ρ + p·I/2 becomes I/2. Every Bloch vector shrinks to the center.'],

    ['What do quantum trajectory methods trade?', ['Memory for statistical error, by averaging many pure-state runs', 'Speed for accuracy only', 'Qubits for depth', 'Nothing'], 0, 'Each trajectory is a 2ⁿ-sized pure state with random jumps, instead of a 4ⁿ-sized density matrix, but many runs must be averaged.'],

  tensornet: [

    ['What bond dimension is needed for an arbitrary n-qubit state in the worst case?', ['2', 'n', '2^(n/2)', '2ⁿ'], 2, 'The middle cut can have up to 2^(n/2) Schmidt values, so χ must be that large. MPS only helps when entanglement is limited.'],
    ['What is special about area-law states in 1D?', ['They follow a volume law', 'They can be represented efficiently by MPS', 'They are unentangled', 'They are random states'], 1, 'Bounded entanglement entropy means a bounded bond dimension, which is why DMRG captures ground states of gapped 1D systems so well.'],
    ['In random brickwork circuits, how does middle-cut entanglement grow?', ['Not at all', 'About one bit per layer until it saturates', 'Exponentially per layer', 'Logarithmically'], 1, 'Each layer of two-qubit gates crossing the cut adds roughly a bit, until the maximum of n/2 bits is reached. The exact bond dimension therefore grows exponentially with depth.'],
    ['What is the middle-cut entropy of a GHZ state?', ['0', '1 bit', 'n/2 bits', 'n bits'], 1, 'GHZ = (|0…0⟩|0…0⟩ + |1…1⟩|1…1⟩)/√2 has two equal Schmidt values across any cut, so S = 1 bit and χ = 2.'],
    ['Truncating to the χ largest Schmidt values keeps what fidelity?', ['χ/2ⁿ', 'The sum of the kept squared Schmidt coefficients', 'Always 1', '1/χ'], 1, 'The discarded weight is exactly the sum of the dropped λᵢ, so the truncated state overlaps the original by the kept total.'],
    ['What is the practical laptop limit for exact state vectors?', ['About 15 qubits', 'About 30 qubits', 'About 100 qubits', 'About 1,000 qubits'], 1, '2³⁰ complex numbers already take 8–17 GB depending on precision. Supercomputers reach roughly 45–50 qubits.'],
    ['What does Feynman path-sum simulation trade?', ['Lots of memory for little time', 'Little memory for time exponential in the number of gates', 'Tableaux for speed', 'MPS for depth'], 1, 'Summing over computational paths needs memory proportional to circuit size, but the number of paths grows exponentially. Hybrids balance it against state-vector methods.']

  optimize: [
    ['Which adjacent pair on the same qubit cancels?', ['H then X', 'S then S†', 'T then S', 'CNOT(0→1) then CNOT(1→0)'], 1, 'S† is the inverse of S. T then S merge into a three-eighths turn, and the two CNOTs with swapped roles do not cancel; three of them make a SWAP.'],

    ['What is the main cost to minimize on noisy hardware?', ['T count', 'Two-qubit gate count and depth', 'Single-qubit gates', 'Measurements'], 1, 'Two-qubit gates are typically about ten times noisier than single-qubit ones, and depth sets how long qubits sit decohering.'],

    ['What is the ZX-calculus?', ['A decoder', 'A graphical language with rewrite rules for circuits', 'A hardware platform', 'A simulator'], 1, 'Circuits become graphs of spiders that can be simplified with a complete set of rules and then turned back into circuits, as PyZX does.'],
    ['Why is the lab’s brute-force equivalence check limited to small circuits?', ['It is inaccurate', 'The unitary grows as 2ⁿ × 2ⁿ', 'It needs hardware', 'It is not allowed'], 1, 'Comparing full unitaries is exponential in qubit count. Real compilers rely on rewrite rules proven correct once, for all sizes.'],

  routing: [
    ['How hard is optimal qubit routing in general?', ['Trivial', 'NP-hard', 'Undecidable', 'Linear time'], 1, 'Choosing the fewest SWAPs for an arbitrary circuit and coupling graph is NP-hard, so compilers use heuristics such as SABRE.'],
    ['How does SABRE improve the initial layout?', ['Random guessing only', 'By routing forwards and backwards through the circuit', 'By using a decoder', 'By measuring'], 1, 'The final mapping of a backward pass is a good starting layout for the forward pass. Iterating converges on layouts that need fewer SWAPs.'],
    ['What connectivity lattice do IBM’s superconducting chips use?', ['A square grid', 'A heavy-hexagon lattice', 'All-to-all', 'A ring'], 1, 'Heavy-hex connects each qubit to two or three neighbours, which reduces crosstalk and frequency collisions at the cost of more routing.'],
    ['What does ALAP scheduling aim for?', ['Finishing sooner', 'Less idle time spent decohering, by starting gates as late as possible', 'Adding more gates', 'Removing measurements'], 1, 'Qubits that are prepared early but used late sit idle and decay. Starting their gates later shortens that exposure.'],
    ['What is dynamical decoupling?', ['A decoder', 'Pulse sequences on idle qubits that echo away slow noise', 'A way to move qubits', 'A programming language'], 1, 'Pairs of X or Y pulses during idle periods refocus slow frequency drifts, much like a spin echo.'],
    ['What does OpenQASM 3 add over version 2?', ['Nothing', 'Classical control flow, timing and mid-circuit measurement', 'Photonics support', 'Error correction'], 1, 'Version 3 can express loops, conditionals on measurement results and explicit timing, which dynamic circuits and error correction need.'],

  chemistry: [

    ['Which operators make up the strings in the Jordan–Wigner transformation?', ['X', 'Y', 'Z', 'H'], 2, 'The Z strings count the parity of occupied orbitals before position j, reproducing the minus signs that fermion operators pick up when they pass each other.'],
    ['What is the Hubbard dimer’s exact ground energy at U = 4t?', ['−2t', 'About −0.83t', '0', '−4t'], 1, 'E₀ = (U − √(U² + 16t²))/2 = (4 − √32)/2 ≈ −0.83t. The lab’s exact diagonalization of the qubit Hamiltonian reproduces it.'],
    ['What is the Hartree–Fock energy at U = 4t?', ['−2t', '0', '2t', '−0.83t'], 1, 'E_HF = −2t + U/2 = −2t + 2t = 0. Mean field misses about 0.83t of binding here: the correlation energy.'],
    ['As U/t grows, what happens to the size of the correlation energy?', ['It shrinks to zero', 'It grows', 'It stays at zero', 'It oscillates'], 1, 'At U = 0 mean field is exact. As U grows, HF rises as U/2 while the exact energy stays near zero, so the gap between them widens. Strong correlation is where classical approximations struggle.'],
    ['Which mapping shortens the Z strings to logarithmic length?', ['Jordan–Wigner', 'Bravyi–Kitaev', 'Hadamard', 'Trotter'], 1, 'Bravyi–Kitaev stores partial sums of occupations in a tree, so each fermion operator touches only O(log n) qubits.'],
    ['What will problems like the FeMoco cofactor likely require?', ['NISQ-era VQE', 'Error-corrected phase estimation with many logical qubits', 'Hartree–Fock only', 'A five-qubit device'], 1, 'Published estimates need on the order of a hundred or more logical qubits and long phase-estimation circuits, far beyond noisy devices.'],
    ['In the dimer’s singlet sector, what is the lab’s variational state?', ['cos θ|covalent⟩ + sin θ|ionic⟩', '|0000⟩', 'A GHZ state', 'A random state'], 0, 'Particle number and spin symmetry reduce the problem to two configurations, one electron per site (covalent) or both on one site (ionic). A single angle then reaches the exact ground state.']

  qml: [
    ['What does angle encoding do with a feature?', ['Stores it as an amplitude', 'Uses it as a rotation angle', 'Sets the qubit count', 'Measures it'], 1, 'Each feature xᵢ becomes the angle of a gate such as Ry(xᵢ). It is cheap to prepare but uses about one qubit or one rotation per feature.'],

    ['What is a quantum kernel?', ['k(x, x′) = |⟨φ(x)|φ(x′)⟩|²', 'A decoder', 'A gate', 'The loss function'], 0, 'The overlap of two feature states gives a similarity measure that a classical support vector machine can use. It only helps if it is hard to compute classically and suits the data.'],
    ['Who identified barren plateaus in 2018?', ['Shor', 'McClean and colleagues', 'Grover', 'Kitaev'], 1, 'McClean, Boixo, Smelyanskiy, Babbush and Neven showed that gradients vanish exponentially in random parameterized circuits.'],

  infotheory: [

  const filt = () => { const v = q.value.trim().toLowerCase(); let n = 0; items.forEach(it => { const on = !v || it.s.includes(v); it.el.hidden = !on; if (on) n++; }); count.textContent = `${n} of ${items.length} terms`; };
  q.addEventListener('input', filt);
  main.append(h('header', { class: 'ph' }, h('div', { class: 'ph-eyebrow' }, h('span', null, 'Reference')), h('h1', null, 'Glossary'),
    h('p', { class: 'lede' }, 'Short definitions of the terms used in this guide, each linked to the lesson that explains it properly.')), q, count, list);
  filt();
}

/* ---------- router ---------- */
let firstRoute = true;
function route() {
  const id = (location.hash || '').replace(/^#/, '') || 'home';
  const L = LESSONS.find(l => l.id === id), main = document.getElementById('main');
  Scope.reset(); main.innerHTML = '';
  if (L) Prog.seen(L.id);
  if (L) renderLesson(L, main); else if (id === 'glossary') renderGlossary(main); else renderHome(main);
  renderNav(L ? L.id : id === 'glossary' ? 'glossary' : 'home');
  document.title = L ? `${L.title} · Into the Cryostat` : id === 'glossary' ? 'Glossary · Into the Cryostat' : 'Into the Cryostat';
  closeDrawer();
  if (!firstRoute) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  firstRoute = false;
}
Prog.load();
window.addEventListener('hashchange', route);
route();

</script>
