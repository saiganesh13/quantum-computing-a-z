LESSONS.push({
  id: 'complexity', n: 20, stage: 4, minutes: 11, title: 'What quantum computers can and can’t do',
  lede: 'Quantum computers are not faster at everything. They change the cost of specific problems, sometimes dramatically, sometimes not at all.',
  html: `
<h2>The class BQP</h2>
<p>Problems a quantum computer can solve efficiently, meaning in polynomial time with a small chance of error, form the complexity class <strong>BQP</strong>. It contains everything a classical computer can do efficiently (the classes P and BPP), and it fits inside PSPACE, the problems solvable with a polynomial amount of memory. Whether BQP is strictly larger than what classical computers can do is unproven. Factoring is the strongest evidence that it is: Shor’s algorithm runs in polynomial time, and decades of work have produced no classical algorithm that does.</p>
${LAB('map')}
<h2>Speedups come in sizes</h2>
<p>An exponential speedup, like Shor’s, turns a problem that would take longer than the age of the universe into one that takes hours. A quadratic speedup, like Grover’s, turns ${m('N')} steps into ${m('√N')}. That is valuable at huge scales, but quantum operations are much slower than classical ones and error correction multiplies the cost, so quadratic speedups pay off only for very large problems.</p>
${LAB('race')}
<h2>What is unlikely</h2>
<ul>
<li><strong>NP-complete problems</strong> such as SAT or the decision version of the travelling salesman problem are not believed to be in BQP. Expect at most Grover-style quadratic gains.</li>
<li><strong>Big data.</strong> Loading a large classical data set into quantum amplitudes is expensive, and that cost erases many claimed speedups for data-heavy machine learning.</li>
<li><strong>Big outputs.</strong> Each run returns only ${m('n')} bits, so the answer has to be compact, such as a factor, an energy or a yes/no.</li>
</ul>
<h2>Where the evidence points</h2>
<p>The strongest candidates for useful quantum advantage are simulating molecules and materials, which was Richard Feynman’s motivation in 1982; cryptanalysis with Shor’s algorithm; and some structured problems in algebra and optimization. Several groups have run sampling experiments designed to be hard for classical computers. Some of those claims have since been challenged as classical simulation methods improved. That back and forth is part of how the field locates the real boundary between classical and quantum computing.</p>
${NOTE('A closing thought', `<p>A quantum computer is not a faster classical computer. It is a different kind of machine that manipulates amplitudes with interference. The lessons in this guide, from a single qubit to the surface code, are the pieces you need to judge any new claim about it for yourself.</p>`)}

/* Schmidt coefficients (squared) across the cut after the first k qubits */
function schmidt(st, k) {
  const n = st.n, left = k <= n - k, D = 1 << (left ? k : n - k), O = 1 << (left ? n - k : k), M = new Float64Array(4 * D * D);
  const idx = (a, b) => left ? a * O + b : b * D + a;
  for (let a = 0; a < D; a++) for (let b = a; b < D; b++) {
    let re = 0, im = 0;
    for (let o = 0; o < O; o++) { const i = idx(a, o), j = idx(b, o); re += st.re[i] * st.re[j] + st.im[i] * st.im[j]; im += st.im[i] * st.re[j] - st.re[i] * st.im[j]; }
    const N2 = 2 * D;
    M[a * N2 + b] = re; M[b * N2 + a] = re; M[(a + D) * N2 + b + D] = re; M[(b + D) * N2 + a + D] = re;
    M[(a + D) * N2 + b] = im; M[(b + D) * N2 + a] = -im; M[a * N2 + b + D] = -im; M[b * N2 + a + D] = im;
  }
  const ev = eigSym(M, 2 * D), out = []; for (let i = 0; i < ev.length; i += 2) out.push(Math.max(0, (ev[i] + ev[i + 1]) / 2)); return out;
}

  id: 'stabilizers', n: 21, stage: G, minutes: 16, title: 'The stabilizer formalism',
  lede: 'Most of quantum error correction is written in one language: describe a state, or a code, by the Pauli operators that leave it unchanged. It turns exponentially large vectors into short lists of strings.',
  html: `
<h2>Describing a state by what leaves it alone</h2>
<p>An operator ${m('P')} <strong>stabilizes</strong> a state when ${m('P|ψ⟩ = |ψ⟩')}. Z stabilizes ${m('|0⟩')}, X stabilizes ${m('|+⟩')}, and the Bell state ${m('|Φ⁺⟩')} is stabilized by both ${m('X⊗X')} and ${m('Z⊗Z')}. In fact ${m('|Φ⁺⟩')} is the only two-qubit state stabilized by both, so the pair ${m('{XX, ZZ}')} is a complete description of it.</p>
<p>In general, an ${m('n')}-qubit <strong>stabilizer state</strong> is pinned down by ${m('n')} independent, commuting Pauli strings, called generators. That is ${m('n')} strings of length ${m('n')}, about ${m('2n²')} bits, instead of ${m('2ⁿ')} complex amplitudes. Every product of generators is also a stabilizer, so the generators define a group of ${m('2ⁿ')} elements.</p>
<h2>Commuting and anticommuting</h2>
<p>Two Pauli strings either commute or anticommute. Count the positions where both strings have a non-identity letter and the letters differ. An even count means they commute; an odd count means they anticommute. Writing each string as a pair of bit vectors ${m('(x | z)')}, with X = (1|0), Z = (0|1) and Y = (1|1), turns this into a one-line formula, the <strong>symplectic product</strong>:</p>
${EQ('⟨P, P′⟩ = x·z′ + z·x′ &nbsp;(mod 2)')}
${LAB('pauli')}
<h2>Clifford gates move generators around</h2>
<p>The gates H, S and CNOT, and everything built from them, form the <strong>Clifford group</strong>. They map Pauli strings to Pauli strings under conjugation: ${m('HXH = Z')}, ${m('SXS<sup>†</sup> = Y')}, and a CNOT copies an X on its control onto its target while copying a Z on its target back onto its control. So to follow a Clifford circuit you never need the amplitudes. You just rewrite the generators gate by gate.</p>
${LAB('tableau')}
<h2>Stabilizer codes</h2>
<p>A <strong>stabilizer code</strong> uses ${m('n − k')} commuting generators on ${m('n')} physical qubits. The states stabilized by all of them form a ${m('2<sup>k</sup>')}-dimensional <strong>codespace</strong>: room for ${m('k')} logical qubits. The bit-flip code from Lesson 18 is the simplest example, with generators ${m('Z₀Z₁')} and ${m('Z₁Z₂')}.</p>
<ul>
<li>An error that anticommutes with a generator flips that generator’s measured value from +1 to −1. The list of flipped generators is the <strong>syndrome</strong>.</li>
<li><strong>Logical operators</strong> commute with every generator but are not products of generators. They move the encoded state around inside the codespace, and no syndrome can see them.</li>
<li>The <strong>distance</strong> ${m('d')} is the weight of the lightest logical operator. A code written ${m('[[n, k, d]]')} corrects any error on up to ${m('⌊(d − 1)/2⌋')} qubits.</li>
</ul>
<p>Two classical facts carry over with a twist. Errors that differ by a stabilizer act identically on the code, so the decoder only has to find the right <em>class</em> of errors, not the exact one. This is called <strong>degeneracy</strong>, and it has no classical counterpart. And the quantum Singleton bound limits every code: ${m('n − k ≥ 2(d − 1)')}.</p>
<h2>CSS codes and the Steane code</h2>
<p>Calderbank, Shor and Steane showed how to build quantum codes from two classical ones: one supplies Z-type generators that catch X errors, the other X-type generators that catch Z errors. The Steane code ${m('[[7, 1, 3]]')} uses the classical Hamming code for both. Its three Z-type generators are the rows of the Hamming parity-check matrix, and so are its three X-type generators. A single X error lights up the Z checks in a pattern that spells out, in binary, which qubit flipped.</p>
${LAB('steane')}
${NOTE('Knill–Laflamme conditions', `<p>A code can correct a set of errors ${m('{E<sub>a</sub>}')} exactly when ${m('⟨i|E<sub>a</sub><sup>†</sup>E<sub>b</sub>|j⟩ = C<sub>ab</sub> δ<sub>ij</sub>')} for all codewords ${m('|i⟩, |j⟩')}. In words: errors may move codewords around, but they must not reveal which codeword is present, and they must not make two codewords look alike.</p>`)}

LESSONS.push({
  id: 'stabsim', n: 22, stage: G, minutes: 12, title: 'Simulating stabilizer circuits',
  lede: 'Clifford circuits can be simulated efficiently on an ordinary computer, even with thousands of qubits. That one fact is why most error-correction research happens on laptops.',
  html: `
<h2>The Gottesman–Knill theorem</h2>
<p>A circuit made only of state preparation in ${m('|0⟩')}, Clifford gates (H, S, CNOT) and Pauli measurements can be simulated classically in polynomial time. The state may be massively entangled, so this is not about entanglement being easy. It is about the stabilizer description staying small: ${m('n')} generators of length ${m('n')} at every step.</p>
<p>Aaronson and Gottesman’s 2004 <strong>tableau</strong> algorithm stores ${m('2n')} Pauli strings, the ${m('n')} stabilizer generators plus ${m('n')} “destabilizers” that make measurements fast, each as two bit vectors and a sign. A gate updates one or two columns of bits, costing ${m('O(n)')}. A measurement whose outcome is random costs ${m('O(n²)')}, and one whose outcome is already determined is found by multiplying generators together.</p>
${LAB('ghz')}
<h2>Why error-correction research depends on it</h2>
<p>Syndrome extraction circuits are Clifford circuits. Common noise models, such as depolarizing noise, are random Pauli errors, which keep everything inside the stabilizer world. So you can simulate a distance-25 surface code with more than a thousand qubits, through dozens of noisy rounds, millions of times, and measure its logical error rate directly.</p>
<p>The current standard tool is <strong>Stim</strong>, Craig Gidney’s stabilizer simulator. It simulates the noiseless circuit once to get a reference, then samples shots by pushing random Pauli errors through the circuit as bit masks, called <strong>Pauli frames</strong>, many shots in parallel using wide machine words. Combined with a decoder such as PyMatching, a short Python script estimates a surface code’s logical error rate:</p>
${CODE('python · stim + pymatching', `
import numpy as np, stim, pymatching

circuit = stim.Circuit.generated(
    "surface_code:rotated_memory_z",
    distance=5, rounds=5,
    after_clifford_depolarization=0.001)

sampler = circuit.compile_detector_sampler()
dets, obs = sampler.sample(100_000, separate_observables=True)

dem = circuit.detector_error_model(decompose_errors=True)
matcher = pymatching.Matching.from_detector_error_model(dem)
pred = matcher.decode_batch(dets)
print("logical error rate:", np.mean(np.any(pred != obs, axis=1)))
`)}
<h2>Where it stops</h2>
<p>Add T gates and the stabilizer description no longer fits. Extended methods write the state as a sum of stabilizer states; their cost grows exponentially in the number of T gates (roughly ${m('2<sup>0.23t</sup>')} for ${m('t')} T gates in the best known stabilizer-rank methods), not in the number of qubits. This gives a precise sense in which T gates, or “magic”, are the resource that makes quantum computing hard to simulate, and it is why Lesson 26 treats them as the expensive part of fault-tolerant computing.</p>
`,

const ckPos = (s, d) => s.kind === 'bulk' ? [s.j + .5, s.i + .5] : s.kind === 'left' ? [-.38, s.i + .5] : s.kind === 'right' ? [d - 1 + .38, s.i + .5] : s.kind === 'top' ? [s.j + .5, -.38] : [s.j + .5, d - 1 + .38];
function drawSC(code, err, res, o = {}) {
  const d = code.d, S = o.s || (d <= 3 ? 64 : d <= 5 ? 50 : 40), pad = S * .8, W = pad * 2 + (d - 1) * S, H = W;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: 'sc', role: 'img', 'aria-label': `Distance ${d} surface code` });
  const P = qi => [pad + (qi % d) * S, pad + Math.floor(qi / d) * S], C = s => { const [x, y] = ckPos(s, d); return [pad + x * S, pad + y * S]; };
  const shape = (s, cls) => {
    const qs = s.qs.map(P);
    if (s.kind === 'bulk') return sv('rect', { x: qs[0][0], y: qs[0][1], width: S, height: S, class: cls });
    const [a, b] = qs, R = S / 2;
    const dd = s.kind === 'top' || s.kind === 'right' ? `M${a[0]} ${a[1]} A${R} ${R} 0 0 1 ${b[0]} ${b[1]} Z` : `M${b[0]} ${b[1]} A${R} ${R} 0 0 1 ${a[0]} ${a[1]} Z`;
    return sv('path', { d: dd, class: cls });
  };
  code.Xs.forEach(s => svg.append(shape(s, 'sc-x')));
  code.Zs.forEach((s, i) => svg.append(shape(s, 'sc-z' + (res && res.lit[i] ? ' lit' : ''))));
  if (res) for (const [i, j] of res.pairs) {
    const a = C(code.Zs[res.def[i]]);
    if (j >= 0) { const b = C(code.Zs[res.def[j]]); svg.append(sv('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: 'sc-match' })); }
    else { const path = code.path(res.def[i], code.B), last = P(path[path.length - 1]), y2 = Math.floor(path[path.length - 1] / d) === 0 ? 4 : H - 4; svg.append(sv('line', { x1: a[0], y1: a[1], x2: last[0], y2: y2, class: 'sc-match' })); }
  }

    const [x, y] = P(qi), on = err[qi], cr = res && res.corr[qi];
    const g = sv('g', { class: 'sc-q', tabindex: o.click ? 0 : null, role: o.click ? 'button' : null, 'aria-label': o.click ? `Qubit ${qi}${on ? ', X error' : ''}` : null });
    g.append(sv('circle', { cx: x, cy: y, r: S * .2, class: 'sc-dq' + (on ? ' on' : '') }));
    if (on) g.append(sv('text', { x, y, class: 'sc-ql', style: `font-size:${S * .22}px` }, 'X'));
    if (cr) g.append(sv('circle', { cx: x, cy: y, r: S * .3, class: 'sc-corr' }));

LESSONS.push({
  id: 'decoders', n: 23, stage: G, minutes: 15, title: 'Decoders',
  lede: 'A syndrome says something went wrong; a decoder has to guess what. Decoders are classical algorithms, and they have to be both accurate and fast enough to keep up with the hardware.',
  html: `
<h2>The decoding problem</h2>
<p>Given the syndrome, choose a correction that returns the system to the codespace without applying a logical error. Thanks to degeneracy (Lesson 21), the decoder does not need the exact error, only an error in the same equivalence class. The best possible decoder picks the most likely class. For general stabilizer codes that maximum-likelihood problem is computationally hard, so practical decoders use structure and approximations.</p>
<h2>Errors as chains, syndromes as endpoints</h2>
<p>In the surface code, each data qubit touches at most two Z checks. An X error on one qubit lights the checks on either side of it, and a string of neighbouring X errors lights only the two checks at its ends: the middle ones are flipped twice. So the syndrome is a set of lit checks, called <strong>defects</strong>, and the job is to pair them up with short chains, or join a defect to the edge of the code. If independent errors are rare, the shortest total pairing is the most likely explanation. This is <strong>minimum-weight perfect matching</strong> (MWPM), proposed for the surface code by Dennis, Kitaev, Landahl and Preskill in 2002, and solved efficiently by Edmonds’ blossom algorithm.</p>
${LAB('match')}
<h2>When the decoder gets it wrong</h2>
<p>A correction that, together with the actual errors, forms a chain from one boundary to the opposite one is a logical operator. Every check is satisfied and the logical qubit has silently flipped. That needs at least ${m('(d + 1)/2')} errors arranged the right way, which is why larger distances help so much when errors are rare.</p>
<h2>The decoder landscape</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Decoder</th><th>Idea</th><th>Where it is used</th></tr></thead><tbody>
<tr><td>Matching</td><td>Pair defects with minimum total weight (blossom algorithm). PyMatching’s sparse blossom handles large codes quickly.</td><td>Surface codes and repetition codes; the standard baseline</td></tr>
<tr><td>Union-find</td><td>Grow clusters around defects until each cluster can be neutralized, then peel a correction. Almost linear time.</td><td>Surface codes when speed matters most</td></tr>
<tr><td>Belief propagation + OSD</td><td>Pass probability messages on the code’s check graph, then fix the remaining ambiguity with ordered-statistics decoding.</td><td>qLDPC codes, where matching does not apply</td></tr>
<tr><td>Relay-BP</td><td>A belief-propagation variant designed by IBM to run on FPGAs or ASICs.</td><td>Bivariate bicycle codes</td></tr>
<tr><td>Tensor networks</td><td>Contract a network that sums the probability of each error class: close to maximum likelihood.</td><td>Benchmarks; too slow for real time</td></tr>
<tr><td>Neural networks</td><td>Learn the mapping from syndromes to corrections from data. Google DeepMind’s AlphaQubit (2024) beat matching on Sycamore data.</td><td>Research; speed is the open problem</td></tr>
</tbody></table></div>
<h2>Real time</h2>
<p>A superconducting surface code produces a new round of syndromes about every microsecond. If the decoder is slower than that on average, unprocessed syndromes pile up without limit, the <strong>backlog problem</strong>, and the computation stalls whenever a decision depends on a decoded result. Fast decoders are therefore a hardware problem as much as an algorithms problem, with dedicated FPGA and ASIC decoders now part of most roadmaps.</p>
`,

LESSONS.push({
  id: 'thresholds', n: 24, stage: G, minutes: 16, title: 'Noise models and thresholds',
  lede: 'A threshold is not a single number. It depends on what is allowed to go wrong, and measuring it is a large-scale simulation experiment.',
  html: `
<h2>Three noise models</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Model</th><th>What can fail</th><th>Surface code threshold with matching</th></tr></thead><tbody>
<tr><td>Code capacity</td><td>Data qubits only; syndromes are read perfectly</td><td>about 10% (independent X and Z errors)</td></tr>
<tr><td>Phenomenological</td><td>Data qubits plus syndrome measurement errors</td><td>about 3%</td></tr>
<tr><td>Circuit level</td><td>Every gate, idle step, preparation and measurement in the syndrome circuit</td><td>about 0.5–1%</td></tr>
</tbody></table></div>
<p>Each step closer to real hardware lowers the threshold, because there are more places for faults and some faults spread (Lesson 25). Circuit-level numbers are the ones hardware is judged against.</p>
<h2>Measurement errors and detection events</h2>
<p>If a syndrome bit can be wrong, a single readout cannot be trusted. The fix is to measure the checks repeatedly, usually for about ${m('d')} rounds, and look at <strong>detection events</strong>: places where a check’s value changes from one round to the next. A data error between rounds creates a pair of detection events side by side in space. A measurement error creates a pair in time: the check reads wrong once and right again in the next round. Decoding then becomes matching in space and time.</p>
${LAB('spacetime')}
<h2>Finding a threshold</h2>
<p>To find a threshold, sample many random errors at each physical error rate ${m('p')}, decode them, and count logical failures for several code distances. Below threshold, bigger codes fail less; above it, bigger codes fail more. The threshold is where the curves cross. The simulation below does exactly this for code-capacity X noise, with the matching decoder from Lesson 23.</p>
${LAB('mc')}
<h2>Below threshold, and how far below</h2>
<p>Close to threshold, increasing the distance barely helps. Far below it, each step ${m('d → d + 2')} divides the logical error rate by a factor usually called ${m('Λ')}, roughly ${m('p<sub>th</sub>/p')}. Google’s 2024 below-threshold experiment measured ${m('Λ ≈ 2')}. Larger ${m('Λ')} means far fewer qubits for the same protection, which is why each improvement in physical error rates is worth so much.</p>
<p>Real devices add problems the standard models leave out: <strong>leakage</strong> out of the qubit subspace, correlated errors from cosmic rays and other bursts that hit many qubits at once, drifting error rates, and crosstalk. Much current research models these effects and designs codes, circuits and decoders that tolerate them. Stim (Lesson 22) lets you write such noise directly into the circuit and measure the result.</p>

  lede: 'The circuits that detect errors are themselves noisy. Fault tolerance is the discipline of designing every gadget so that one fault never grows into an error the code cannot handle.',
  html: `
<h2>Errors spread through gates</h2>
<p>A CNOT copies an X error from its control onto its target, and copies a Z error from its target back onto its control. A single fault early in a circuit can therefore end up on several qubits. If those qubits belong to the same code block, a distance-3 code that could fix any one error may now face two.</p>
${EQ('CNOT: X<sub>c</sub> → X<sub>c</sub>X<sub>t</sub>,&nbsp;&nbsp; Z<sub>t</sub> → Z<sub>c</sub>Z<sub>t</sub>,&nbsp;&nbsp; X<sub>t</sub> → X<sub>t</sub>,&nbsp;&nbsp; Z<sub>c</sub> → Z<sub>c</sub>')}
<p>A gadget is <strong>fault-tolerant</strong> if every single fault anywhere inside it leads to at most one error per code block, or more generally to an error the code can still correct. The lab measures the weight-4 X check ${m('X₀X₁X₂X₃')} with one ancilla qubit, the way surface codes do. Put a fault on the ancilla partway through and watch it spread.</p>
${LAB('hook')}
<h2>Ways to measure a syndrome safely</h2>
<ul>
<li><strong>Hook-aware ordering.</strong> In the surface code a hook error leaves two data errors, but choosing the CNOT order carefully makes that pair lie across the logical operator’s direction rather than along it, so the code distance is preserved.</li>
<li><strong>Flag qubits.</strong> Add an extra ancilla that is triggered when a dangerous fault happens, so the decoder knows to expect a correlated error (Chao and Reichardt, 2018).</li>
<li><strong>Shor, Steane and Knill methods.</strong> Use a verified cat state, an encoded ancilla block, or teleportation through an encoded Bell pair to extract the syndrome without spreading errors.</li>
</ul>
<h2>Transversal gates and their limit</h2>
<p>The simplest fault-tolerant logical gate is <strong>transversal</strong>: apply a physical gate to qubit 1 of each block, then qubit 2, and so on. No gate ever touches two qubits of the same block, so errors cannot spread within a block. The Steane code has transversal H, S (up to a correction) and CNOT, the whole Clifford group.</p>
<p>Unfortunately the Eastin–Knill theorem (2009) says no code that can detect errors has a universal set of transversal gates. Something non-transversal is always needed, and in practice it is the T gate, supplied by the magic states of Lesson 26.</p>
<h2>The threshold theorem</h2>
<p>Several groups proved in 1996–97 (Aharonov and Ben-Or; Kitaev; Knill, Laflamme and Zurek) that if every component fails with probability below a constant threshold, arbitrarily long quantum computations can be made arbitrarily reliable with only polylogarithmic overhead. The original proofs used <strong>concatenation</strong>: encode each physical qubit of a code in another copy of the code, and so on. For a distance-3 code each level roughly squares the error rate in units of the threshold:</p>
${EQ('p<sub>k</sub> = p<sub>th</sub> (p / p<sub>th</sub>)<sup>2<sup>k</sup></sup>')}
${LAB('concat')}
<p>Doubly exponential suppression for exponential qubit cost is a good trade on paper, but concatenated codes have low thresholds and need non-local connections. Today’s hardware plans mostly use topological or qLDPC codes instead, with the same logic: stay below threshold, then grow the code.</p>

/* ---------------- 26 · Logical gates and magic states ---------------- */

  html: `
<h2>Cheap gates on the surface code</h2>
<ul>
<li><strong>Pauli gates</strong> are free: the control software just remembers them (a Pauli frame) and reinterprets later measurements.</li>
<li><strong>CNOT</strong> between surface-code patches is done by <strong>lattice surgery</strong>: temporarily merge two patches by measuring checks along their shared edge, then split them again. The merge measures a joint logical operator such as ${m('Z<sub>L</sub>⊗Z<sub>L</sub>')}, and two such measurements with an ancilla patch implement a CNOT.</li>
<li><strong>H and S</strong> are handled with patch deformations and a few extra surgery steps.</li>
</ul>
<p>All of these are Clifford operations, and Clifford operations alone can be simulated classically (Lesson 22). A non-Clifford gate is needed for any quantum advantage, and the standard choice is ${m('T = diag(1, e<sup>iπ/4</sup>)')}.</p>
<h2>Gate teleportation with a magic state</h2>
<p>Instead of applying T directly, prepare the <strong>magic state</strong> ${m('|T⟩ = T|+⟩ = (|0⟩ + e<sup>iπ/4</sup>|1⟩)/√2')} separately, then consume it with Clifford operations and a measurement:</p>
<div class="wide" data-tgadget></div>
<p>If the measurement reads 0, the data qubit now holds ${m('T|ψ⟩')}. If it reads 1, it holds ${m('T<sup>†</sup>|ψ⟩')}, and an S gate fixes it, since ${m('ST<sup>†</sup> = T')}. The difficult part has moved from applying a gate to preparing a state, which can be checked and purified before use.</p>
<h2>Distillation</h2>
<p>Magic states made directly on hardware are only as good as the physical qubits. Bravyi and Kitaev’s 2005 <strong>15-to-1 distillation</strong> protocol takes 15 noisy copies and, using only Clifford operations, outputs one copy with error about ${m('35p³')}, discarding the batch if a check fails. Repeat in rounds until the error is low enough for the whole algorithm. The machinery is called a <strong>magic state factory</strong>, and in early resource estimates factories took up most of the machine.</p>
${LAB('distill')}

<p>Algorithms are compiled to Clifford+T. An arbitrary single-qubit rotation must be approximated by a sequence of H and T gates; optimal synthesis (Ross and Selinger) needs about ${m('3 log₂(1/ε)')} T gates for precision ${m('ε')}. So the <strong>T count</strong>, and the number of rotations behind it, is the main cost figure that resource estimates track, alongside the number of logical qubits.</p>

  lede: 'The surface code is robust and needs only neighbouring connections, but it spends hundreds of physical qubits on every logical qubit. Newer code families trade connectivity for efficiency.',
  html: `
<h2>The cost of the surface code</h2>
<p>A distance-${m('d')} rotated surface code uses ${m('d²')} data qubits and ${m('d² − 1')} measurement qubits, about ${m('2d²')} in total, to protect a single logical qubit. At distance 25 that is about 1,250 physical qubits per logical qubit. Its encoding rate ${m('k/n')} goes to zero as the code grows. Information theory allows far better: there are codes where ${m('k')} and ${m('d')} both grow in proportion to ${m('n')}.</p>
<h2>Quantum LDPC codes</h2>
<p><strong>Low-density parity-check</strong> (LDPC) codes keep each check small and each qubit in few checks, like the surface code, but allow checks between distant qubits. Constructions include hypergraph product codes (Tillich and Zémor, 2009) and, since 2021, “good” qLDPC codes with constant rate and linear distance (Panteleev and Kalachev). For near-term hardware the leading family is the <strong>bivariate bicycle</strong> codes published by IBM researchers in 2024. Their best-known member, the gross code ${m('[[144, 12, 12]]')}, protects 12 logical qubits with 288 physical qubits, roughly ten times fewer than surface codes of similar strength. The price is connectivity: each qubit talks to six others, some of them far away on the chip.</p>
${LAB('overhead')}
<p>IBM’s roadmap is built on these codes. Its Loon test processor (announced in 2025) was designed to try the long-range couplers they require, and its planned Starling system targets 200 logical qubits running 100 million gates by 2029, decoded with a fast belief-propagation variant called Relay-BP.</p>
<h2>A tour of code families</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Parameters</th><th>Strengths</th><th>Costs</th></tr></thead><tbody>
<tr><td>Repetition</td><td>[[d, 1, d]] against one error type</td><td>Simplest possible; enough when noise is strongly biased</td><td>Protects against bit flips or phase flips, not both</td></tr>
<tr><td>Five-qubit code</td><td>[[5, 1, 3]]</td><td>Smallest code that corrects any single-qubit error</td><td>Not CSS; awkward gates</td></tr>
<tr><td>Steane</td><td>[[7, 1, 3]]</td><td>Transversal Clifford gates</td><td>Weight-4 checks between non-neighbours</td></tr>
<tr><td>Surface code</td><td>[[d², 1, d]]</td><td>About 1% threshold, nearest-neighbour checks, fast decoders</td><td>About 2d² qubits per logical qubit</td></tr>
<tr><td>2D colour code</td><td>[[(3d² + 1)/4, 1, d]]</td><td>Transversal Clifford gates in 2D</td><td>Weight-6 checks; harder decoding; lower threshold</td></tr>
<tr><td>Bivariate bicycle</td><td>[[144, 12, 12]] and others</td><td>About 10× fewer qubits than surface codes</td><td>Long-range couplers; logical gates are more complex</td></tr>
<tr><td>Floquet (honeycomb)</td><td>dynamic</td><td>Only two-qubit measurements needed</td><td>Logical information moves every round</td></tr>
<tr><td>Bosonic cat and GKP codes</td><td>one oscillator per qubit</td><td>Cat qubits make bit flips exponentially rare; GKP packs a qubit into an oscillator’s phase space</td><td>Need an outer code; demanding microwave control</td></tr>
</tbody></table></div>
<h2>Using the hardware’s strengths</h2>
<ul>
<li><strong>Biased noise.</strong> Cat qubits (pursued by Alice &amp; Bob and by AWS with its Ocelot chip) suppress bit flips exponentially in the oscillator’s photon number, leaving mostly phase flips. A simple repetition code against phase flips may then be enough, and tailored surface codes such as the XZZX code also exploit bias.</li>
<li><strong>Moving qubits.</strong> Neutral atoms and trapped ions can be shuttled, so any qubit can meet any other. That makes transversal gates between code blocks natural and qLDPC codes easier; Harvard and QuEra ran circuits on 48 logical qubits this way in 2023.</li>
<li><strong>Erasure qubits.</strong> If the hardware can flag where an error happened, as some atom and superconducting designs can, the decoder knows the location and the effective threshold rises substantially.</li>
</ul>
`,

LESSONS.push({

  html: `
<h2>The recipe</h2>
<ol>
<li><strong>Count the logical work.</strong> Compile the algorithm and count logical qubits, T gates (or rotations) and logical depth.</li>
<li><strong>Set an error budget.</strong> Decide the acceptable chance that the whole run fails, say 1%, and split it between memory errors, T states and rotation synthesis.</li>
<li><strong>Choose the code distance.</strong> Find the smallest ${m('d')} for which the logical error rate per qubit per step, multiplied by the number of qubit-steps, fits the budget.</li>
<li><strong>Lay out the chip.</strong> Add routing space for lattice surgery and magic state factories or cultivation regions.</li>
<li><strong>Estimate time.</strong> Each logical step takes about ${m('d')} syndrome rounds; multiply by the cycle time (about a microsecond for superconducting qubits, much longer for atoms and ions) and by the number of sequential steps.</li>
</ol>
<p>Tools such as Microsoft’s Azure Quantum Resource Estimator and Google’s Qualtran automate these steps with detailed models. The lab below uses a deliberately simple version so you can see how the pieces push on each other.</p>
${LAB('estimator')}
<h2>What the numbers say</h2>
<p>The physical error rate enters through ${m('(p/p<sub>th</sub>)<sup>(d+1)/2</sup>')}, so the required distance, and with it the qubit count, falls quickly as hardware improves. Halving ${m('p')} can cut the machine size by a large fraction. Time, on the other hand, is dominated by the number of sequential T gates and the cycle time, which is why platforms with slow cycles must compensate with parallelism. Gidney’s 2025 estimate for RSA-2048 (under a million qubits, under a week) assumed 0.1% physical error rates, a 1 µs cycle and a 10 µs reaction time for classical feedback, and each assumption matters.</p>
${NOTE('Reading published estimates', `<p>When comparing estimates, check the assumed physical error rate and noise model, cycle time, decoder reaction time, connectivity, whether magic states use distillation or cultivation, and which algorithmic optimizations were applied. Two estimates that differ by 100× often differ mostly in these assumptions.</p>`)}
`,

      cap: 'Model: logical error per qubit per step ε(d) = 0.1·(p/1%)^((d+1)/2); total failure = Q × N_T × ε(d) ≤ 1%. Footprint = (2Q + 25F) patches × 2d² qubits (half the logical area for routing; each factory modeled as 25 patches). Each factory delivers one T state per 6d cycles; time = N_T × d cycles × max(1, 6/F).',

          const pts = []; for (let i = 0; i <= 120; i++) { const p = Math.pow(10, -4 + 2 * i / 120 * .995), e = est(p); if (e) pts.push([A.X(p), A.Y(clamp(e.qubits, 1e3, 1e9))]); }

LESSONS.push({
  id: 'query', n: 29, stage: ALG, minutes: 15, title: 'Query complexity and hidden structure',
  lede: 'Proving that quantum computers are faster is hard in general, but in the query model, where you count calls to a black box, speedups and lower bounds can be proved outright.',
  html: `
<h2>The query model</h2>
<p>In the query model an algorithm learns about an input only by calling an oracle, and its cost is the number of calls. Everything else is free. This sounds artificial, but it is where almost every known quantum speedup was first found, and it is one of the few settings where theorists can prove that no algorithm does better. Grover’s ${m('√N')} is optimal there, as Lesson 13 noted.</p>
<h2>Bernstein–Vazirani: n bits in one query</h2>
<p>Suppose ${m('f(x) = a·x mod 2')} for a hidden ${m('n')}-bit string ${m('a')}. Classically each query reveals one bit of information, so you need ${m('n')} queries. The Deutsch–Jozsa circuit, H on every qubit, one phase-oracle query, H again, puts all the amplitude on ${m('|a⟩')}. One query reveals the whole string, because the Hadamard transform turns the pattern of signs ${m('(−1)<sup>a·x</sup>')} into a single basis state.</p>
${LAB('bv')}
<h2>Simon’s problem: an exponential separation</h2>
<p>Now let ${m('f')} be two-to-one with a hidden period: ${m('f(x) = f(y)')} exactly when ${m('y = x ⊕ s')}. A classical algorithm, even a randomized one, has to find a collision, which takes about ${m('2<sup>n/2</sup>')} queries by the birthday bound. Simon’s 1994 algorithm runs the H–oracle–H circuit; each run returns a random ${m('y')} with ${m('y·s = 0')}. After about ${m('n')} runs, the equations pin down ${m('s')} by Gaussian elimination over GF(2). That is ${m('O(n)')} quantum queries against ${m('2<sup>n/2</sup>')} classical: an exponential gap, proved relative to the oracle. Shor read Simon’s paper and generalized the idea to the period of ${m('a<sup>x</sup> mod N')}.</p>
${LAB('simon')}
<h2>The hidden subgroup problem</h2>
<p>Simon’s and Shor’s algorithms are both instances of the <strong>hidden subgroup problem</strong>: a function on a group is constant on the cosets of an unknown subgroup; find the subgroup. For abelian groups, the quantum Fourier transform solves it efficiently. For some non-abelian groups it would be a breakthrough: the symmetric group would give graph isomorphism, and the dihedral group is connected to lattice problems behind post-quantum cryptography. Both remain open.</p>
<h2>Lower bounds</h2>
<ul>
<li><strong>The polynomial method</strong> (Beals, Buhrman, Cleve, Mosca and de Wolf, 1998): the acceptance probability after ${m('T')} queries is a polynomial of degree at most ${m('2T')} in the input bits. Functions that need high-degree polynomials need many queries. For example, computing the parity of ${m('N')} bits needs at least ${m('N/2')} queries, so quantum computers give almost no help there.</li>
<li><strong>The adversary method</strong> (Ambainis, 2000) bounds how fast queries can distinguish inputs with different answers. Its general form characterizes quantum query complexity exactly, up to a constant.</li>
</ul>
<p>Grover’s technique generalizes to <strong>amplitude amplification</strong> and <strong>amplitude estimation</strong>, which give a quadratic speedup for estimating averages, the core of Monte Carlo methods in finance and physics. Like Grover search, those speedups are provably the best possible in the query model.</p>

/* ---------------- 30 · Phase estimation and Hamiltonian simulation ---------------- */
const cm = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const ca = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mm = (A, B) => [[ca(cm(A[0][0], B[0][0]), cm(A[0][1], B[1][0])), ca(cm(A[0][0], B[0][1]), cm(A[0][1], B[1][1]))], [ca(cm(A[1][0], B[0][0]), cm(A[1][1], B[1][0])), ca(cm(A[1][0], B[0][1]), cm(A[1][1], B[1][1]))]];
const eX = t => [[[Math.cos(t), 0], [0, -Math.sin(t)]], [[0, -Math.sin(t)], [Math.cos(t), 0]]];
const eZ = t => [[[Math.cos(t), -Math.sin(t)], [0, 0]], [[0, 0], [Math.cos(t), Math.sin(t)]]];
const mpow = (A, r) => { let R = [[[1, 0], [0, 0]], [[0, 0], [1, 0]]]; for (let i = 0; i < r; i++) R = mm(R, A); return R; };
const norm2 = D => { const a = D[0][0][0] ** 2 + D[0][0][1] ** 2 + D[1][0][0] ** 2 + D[1][0][1] ** 2, c2 = D[0][1][0] ** 2 + D[0][1][1] ** 2 + D[1][1][0] ** 2 + D[1][1][1] ** 2;
  const br = D[0][0][0] * D[0][1][0] + D[0][0][1] * D[0][1][1] + D[1][0][0] * D[1][1][0] + D[1][0][1] * D[1][1][1], bi = D[0][0][0] * D[0][1][1] - D[0][0][1] * D[0][1][0] + D[1][0][0] * D[1][1][1] - D[1][0][1] * D[1][1][0];
  return Math.sqrt((a + c2) / 2 + Math.sqrt(((a - c2) / 2) ** 2 + br * br + bi * bi)); };
LESSONS.push({

  html: `
<h2>Quantum phase estimation</h2>
<p>Suppose ${m('U|u⟩ = e<sup>2πiφ</sup>|u⟩')} and you can prepare ${m('|u⟩')}. QPE uses ${m('t')} ancilla qubits in superposition. Ancilla ${m('j')} controls ${m('U<sup>2<sup>j</sup></sup>')}, which by phase kickback writes the phase ${m('2πφ·2<sup>j</sup>')} onto it. The ancillas then hold exactly the Fourier clocks of Lesson 14, and an inverse QFT turns them into the binary digits of ${m('φ')}.</p>
<p>If ${m('φ')} has an exact ${m('t')}-bit expansion, QPE returns it with certainty. Otherwise the outcome is the nearest ${m('t')}-bit value with probability at least ${m('4/π² ≈ 41%')}, and within one step of it with probability at least 81%.</p>
${LAB('qpe')}
<h2>Heisenberg scaling</h2>
<p>Estimating a phase by repeating a single-shot experiment and averaging needs about ${m('1/ε²')} runs for precision ${m('ε')}. QPE uses about ${m('1/ε')} applications of ${m('U')} in total, because the controlled powers ${m('U<sup>2<sup>j</sup></sup>')} amplify small phase differences coherently. Shor’s algorithm is QPE applied to modular multiplication; chemistry applications apply it to ${m('U = e<sup>−iHt</sup>')} to read off energies.</p>
<h2>Hamiltonian simulation</h2>
<p>To run QPE on ${m('e<sup>−iHt</sup>')}, you first have to build that operator from gates. Most physical Hamiltonians are sums of simple terms, ${m('H = Σ<sub>j</sub> H<sub>j</sub>')}, each easy to exponentiate on its own. If the terms commuted you could apply them one after another. They usually don’t, but the <strong>Lie–Trotter product formula</strong> says that alternating many short steps works:</p>
${EQ('e<sup>−i(A+B)t</sup> ≈ (e<sup>−iAt/r</sup> e<sup>−iBt/r</sup>)<sup>r</sup>,&nbsp;&nbsp; error O(t²/r)')}
<p>The symmetric second-order formula ${m('e<sup>−iAτ/2</sup>e<sup>−iBτ</sup>e<sup>−iAτ/2</sup>')} has error ${m('O(t³/r²)')}. Seth Lloyd showed in 1996 that this makes local Hamiltonians efficiently simulable, confirming Feynman’s intuition. Newer techniques, linear combinations of unitaries and <strong>qubitization</strong> (Low and Chuang), reach the optimal cost of about ${m('t + log(1/ε)')} queries.</p>

<h2>Density matrices</h2>
<p>A noisy qubit is not in one definite pure state but in a statistical mixture. Its <strong>density matrix</strong> ${m('ρ = Σ<sub>i</sub> p<sub>i</sub> |ψ<sub>i</sub>⟩⟨ψ<sub>i</sub>|')} captures every measurable property. For one qubit it is exactly the Bloch vector inside the ball:</p>
${EQ('ρ = ½ (I + xX + yY + zZ),&nbsp;&nbsp; |r| ≤ 1')}
<p>Pure states have ${m('|r| = 1')}; the center is the completely mixed state ${m('I/2')}. For ${m('n')} qubits the density matrix is ${m('2ⁿ × 2ⁿ')}, so it needs ${m('4ⁿ')} numbers: simulating noise exactly costs the square of simulating a pure state.</p>
<h2>Channels and Kraus operators</h2>
<p>Any physically allowed noise process is a completely positive, trace-preserving map, a <strong>quantum channel</strong>. Every channel can be written with Kraus operators:</p>
${EQ('ε(ρ) = Σ<sub>k</sub> K<sub>k</sub> ρ K<sub>k</sub><sup>†</sup>,&nbsp;&nbsp; Σ<sub>k</sub> K<sub>k</sub><sup>†</sup>K<sub>k</sub> = I')}

${LAB('channels')}
<h2>Continuous-time noise</h2>
<p>For noise acting continuously, the <strong>Lindblad master equation</strong> generalizes the Schrödinger equation:</p>
${EQ('dρ/dt = −i[H, ρ] + Σ<sub>k</sub> ( L<sub>k</sub> ρ L<sub>k</sub><sup>†</sup> − ½{L<sub>k</sub><sup>†</sup>L<sub>k</sub>, ρ} )')}

<h2>Strategies and their costs</h2>
<ul>
<li><strong>Density-matrix simulation</strong>: exact, ${m('4ⁿ')} memory, practical to about 15 qubits on a laptop.</li>
<li><strong>Quantum trajectories</strong> (Monte Carlo wavefunctions): simulate pure states with random jumps and average many runs. Memory ${m('2ⁿ')}, at the cost of statistical error.</li>

LESSONS.push({
  id: 'tensornet', n: 33, stage: SIM, minutes: 14, title: 'Tensor networks and entanglement',
  lede: 'Exact simulation stalls around 30 to 45 qubits, yet many large quantum systems are simulated routinely. The trick is to store only as much entanglement as the state really has.',
  html: `
<h2>Matrix product states</h2>
<p>A matrix product state (MPS) writes each amplitude of an ${m('n')}-qubit chain as a product of matrices, one per qubit, chosen by that qubit’s bit value:</p>
${EQ('ψ(b₁b₂…bₙ) = A₁<sup>b₁</sup> A₂<sup>b₂</sup> ⋯ Aₙ<sup>bₙ</sup>')}
<p>The matrices are at most ${m('χ × χ')}, where ${m('χ')} is the <strong>bond dimension</strong>. Storage is about ${m('2nχ²')} numbers instead of ${m('2ⁿ')}. Any state can be written this way with ${m('χ = 2<sup>n/2</sup>')}, so nothing is gained in the worst case. The gain comes from states with little entanglement.</p>
<h2>Entanglement sets the cost</h2>
<p>Cut the chain in two. The <strong>Schmidt decomposition</strong> writes the state as ${m('Σ<sub>i</sub> √λ<sub>i</sub> |L<sub>i</sub>⟩|R<sub>i</sub>⟩')}, and the number of nonzero ${m('λ<sub>i</sub>')} is exactly the bond dimension needed at that cut. The entanglement entropy ${m('S = −Σ λ<sub>i</sub> log₂ λ<sub>i</sub>')} is at most ${m('log₂ χ')}. Ground states of gapped one-dimensional systems obey an <strong>area law</strong>: their entropy stays bounded as the chain grows, which is why DMRG and other MPS methods work so well for them.</p>
${LAB('ent')}
<h2>Circuits and how classical simulation keeps up</h2>
<p>In a random circuit the entanglement across a cut grows by roughly one bit per layer until it saturates at about ${m('n/2')}. The bond dimension therefore grows exponentially with depth, and exact MPS simulation of deep random circuits is no cheaper than a state vector. Truncating to the largest ${m('χ')} Schmidt values gives an approximate simulation whose fidelity you can measure, which is also how some claims of quantum advantage have been challenged.</p>
<ul>
<li><strong>State vector</strong> (qsim, Qiskit Aer, NVIDIA cuQuantum): exact, about 30 qubits on a laptop and around 45–50 on the largest supercomputers.</li>
<li><strong>Tensor network contraction</strong> (quimb, cuTensorNet): computes individual amplitudes of very large shallow circuits by contracting a network in a clever order.</li>
<li><strong>MPS and PEPS</strong> (ITensor, quimb, TeNPy): states with limited entanglement in 1D and 2D.</li>
<li><strong>Feynman path sums</strong>: tiny memory, exponential time in the number of gates; Schrödinger–Feynman hybrids balance the two.</li>
<li><strong>Stabilizer and near-Clifford</strong> (Stim, Lesson 22): huge Clifford circuits; cost grows with T count.</li>
</ul>
${NOTE('A practical rule', `<p>Pick the simulator by the property that keeps the problem small: few qubits (state vector), little entanglement (MPS), shallow depth (contraction), few non-Clifford gates (stabilizer methods). Most published research simulations combine more than one.</p>`)}
`,

<p>On noisy hardware the main costs are two-qubit gates, which are roughly ten times noisier than single-qubit ones, and circuit depth, which sets how long qubits sit idle and decohere. On fault-tolerant machines the cost shifts to T count and T depth (Lesson 26), while Clifford gates become comparatively cheap. A compiler’s objective changes with the target.</p>

  html: `

    for (let q = 0; q < n; q++) { const b = (i >> (n - 1 - q)) & 1, ch = p[q]; if (ch === 'X') j ^= 1 << (n - 1 - q); else if (ch === 'Y') { j ^= 1 << (n - 1 - q); const nr = -pi * (b ? -1 : 1), ni = pr * (b ? -1 : 1); pr = nr; pi = ni; } else if (ch === 'Z' && b) { pr = -pr; pi = -pi; } }
    Hm[j * N + i] += cf * pr;
  }
  return Hm;
}

<h2>The electronic structure problem</h2>
<p>Most chemistry comes down to the lowest energy of a molecule’s electrons for fixed nuclei. In second quantization, with creation and annihilation operators ${m('a<sub>p</sub><sup>†</sup>, a<sub>p</sub>')} for a set of spin orbitals,</p>

<p>The coefficients come from integrals that classical software computes routinely. The hard part is the ground state, whose size grows exponentially with the number of orbitals. Chemists aim for <strong>chemical accuracy</strong>, about 1.6 millihartree (1 kcal/mol), the precision needed to predict reaction rates.</p>
<h2>From fermions to qubits</h2>
<p>Each spin orbital is either occupied or empty, so it maps naturally to one qubit. The subtlety is that fermion operators anticommute. The <strong>Jordan–Wigner</strong> transformation keeps track of this with strings of Z operators:</p>
${EQ('a<sub>j</sub><sup>†</sup> = Z₀ ⋯ Z<sub>j−1</sub> · ½(X<sub>j</sub> − iY<sub>j</sub>)')}
<p>The Bravyi–Kitaev and parity mappings shorten those strings, and symmetries such as particle number and spin let you remove qubits. After mapping, the Hamiltonian is a weighted sum of Pauli strings, which a quantum computer measures term by term (VQE) or exponentiates for phase estimation (Lesson 30).</p>
<h2>A model you can solve exactly</h2>
<p>The two-site Hubbard model, two electrons hopping between two sites with hopping strength ${m('t')} and an energy cost ${m('U')} for doubly occupying a site, is the smallest model of a chemical bond. It has four spin orbitals, so four qubits. Jordan–Wigner gives</p>

<p>Its exact ground energy is ${m('E₀ = (U − √(U² + 16t²))/2')}, while the mean-field Hartree–Fock approximation gives ${m('−2t + U/2')}. The gap between them is the <strong>correlation energy</strong>, and it grows as ${m('U/t')} grows, the regime of stretched bonds and strongly correlated materials where classical approximations struggle.</p>
${LAB('hubbard')}

LESSONS.push({
  id: 'qml', n: 37, stage: VQA, minutes: 15, title: 'Quantum machine learning',
  lede: 'Quantum machine learning asks whether parameterized circuits can learn from data better than classical models. Most of it is prototyped in simulation, and its hardest questions are about training and data loading.',
  html: `
<h2>Models from circuits</h2>
<p>A quantum model encodes an input ${m('x')} into a circuit, applies trainable gates, and measures an expectation value as its output. Common encodings are <strong>angle encoding</strong>, where features become rotation angles, and <strong>amplitude encoding</strong>, which packs ${m('2ⁿ')} numbers into ${m('n')} qubits but usually costs many gates to prepare. <strong>Data re-uploading</strong> (Pérez-Salinas and colleagues, 2020) interleaves encoding and trainable layers, so even a single qubit can represent a complicated function of its input.</p>
${LAB('reupload')}
<h2>Kernels</h2>
<p>A feature map ${m('x → |φ(x)⟩')} defines a kernel ${m('k(x, x′) = |⟨φ(x)|φ(x′)⟩|²')} that a classical support vector machine can use. If the kernel is hard to compute classically and matches the structure of the data, it could help. Havlíček and colleagues demonstrated the idea on hardware in 2019; whether natural data sets have that kind of structure is unsettled.</p>
<h2>Barren plateaus</h2>
<p>McClean and colleagues showed in 2018 that for random, deep enough circuits, the gradient of the cost vanishes exponentially in the number of qubits. The landscape is flat almost everywhere, and estimating such tiny gradients would take exponentially many shots. Later work showed the problem also hits shallow circuits when the cost is global, that is, when it depends on all qubits at once.</p>
${LAB('barren')}
<p>There is an uncomfortable twist. Recent work argues that many models <em>provably free</em> of barren plateaus have enough structure to be simulated, or at least approximated, efficiently on a classical computer. Trainability and quantum advantage may pull in opposite directions, and finding models with both is an open research problem.</p>
<h2>Reasons for caution and for optimism</h2>
<ul>
<li><strong>Data loading.</strong> Getting a large classical data set into amplitudes can cost as much as the computation it was meant to speed up.</li>
<li><strong>Dequantization.</strong> Several proposed exponential speedups for linear algebra in machine learning were matched by classical randomized algorithms once both sides assumed the same kind of data access.</li>
<li><strong>Quantum data.</strong> The clearest advantages so far are for learning about quantum systems themselves: experiments that store quantum outputs and process them on a quantum computer can need exponentially fewer runs than measure-then-analyse approaches (Huang and colleagues, 2022).</li>
</ul>

/* ---------------- 38 · Quantum information theory ---------------- */
LESSONS.push({
  id: 'infotheory', n: 38, stage: QIT, minutes: 14, title: 'Quantum information theory',
  lede: 'How much information does a qubit carry, how is entanglement measured, and how much can a noisy channel transmit? These are questions with exact, often surprising, mathematical answers.',
  html: `
<h2>Entropy</h2>
<p>The von Neumann entropy ${m('S(ρ) = −Tr ρ log₂ ρ')} is the quantum version of Shannon entropy: zero for pure states, one bit for a maximally mixed qubit. Schumacher’s theorem says it is the number of qubits per copy needed to compress a quantum source, just as Shannon entropy counts bits for a classical source. For a pure state of two parts, the entropy of either part is the <strong>entanglement entropy</strong>, the measure used in Lesson 33.</p>
<h2>How much a qubit can carry</h2>
<p>A qubit has infinitely many states, but <strong>Holevo’s bound</strong> limits what can be extracted: ${m('n')} qubits sent from one party to another convey at most ${m('n')} classical bits. Entanglement changes the accounting. With a Bell pair shared in advance, one transmitted qubit carries two bits, <strong>superdense coding</strong>. Teleportation is the mirror image: two classical bits plus a Bell pair carry one qubit.</p>
${LAB('dense')}
<h2>Entangled is not the same as nonlocal</h2>
<p>Mix a Bell state with white noise: ${m('ρ = p|Φ⁺⟩⟨Φ⁺| + (1 − p) I/4')}. This <strong>Werner state</strong> is entangled for every ${m('p > 1/3')}, but it violates the CHSH inequality only for ${m('p > 1/√2 ≈ 0.71')}. Werner showed in 1989 that some entangled states can be reproduced by local hidden-variable models for all measurements. Entanglement, Bell nonlocality and usefulness for particular tasks are related but distinct resources.</p>
${LAB('werner')}
<h2>Further results worth knowing</h2>
<ul>
<li><strong>Monogamy.</strong> If two qubits are maximally entangled, neither can be entangled with anything else. This is the deep reason QKD (Lesson 11) can certify that an eavesdropper knows nothing.</li>
<li><strong>Data processing.</strong> No local operation increases the distinguishability of states or the information between two parties.</li>
<li><strong>Channel capacities.</strong> A noisy quantum channel has several capacities: for classical bits, for qubits, and for bits with entanglement assistance. The quantum capacity is given by the coherent information, optimized over many uses of the channel.</li>
<li><strong>Superactivation.</strong> Smith and Yard showed in 2008 that two channels which each have zero quantum capacity can have positive capacity when used together. Nothing like it happens classically.</li>
</ul>
`,
  labs: {

/* ---------------- 39 · Post-quantum cryptography ---------------- */
LESSONS.push({
  id: 'pqc', n: 39, stage: QIT, minutes: 14, title: 'Post-quantum cryptography',
  lede: 'Shor’s algorithm breaks the public-key cryptography the internet runs on. Post-quantum cryptography replaces it with classical algorithms built on problems that quantum computers are not known to solve.',
  html: `
<h2>What breaks and what doesn’t</h2>
<ul>
<li><strong>Broken by Shor’s algorithm:</strong> RSA, finite-field Diffie–Hellman and elliptic-curve cryptography (ECDH, ECDSA, Ed25519). All rest on factoring or discrete logarithms.</li>
<li><strong>Weakened by Grover’s algorithm:</strong> symmetric ciphers and hash functions, by at most a square-root factor. Grover search parallelizes poorly, so the practical impact is smaller still; using 256-bit keys, such as AES-256, keeps a wide margin.</li>
</ul>
<p>The urgency comes from <strong>harvest now, decrypt later</strong>: encrypted traffic recorded today can be decrypted once a large enough quantum computer exists. Data that must stay secret for decades is already exposed.</p>
<h2>The NIST standards</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Standard</th><th>Use</th><th>Based on</th><th>Public key</th><th>Ciphertext or signature</th></tr></thead><tbody>
<tr><td>ML-KEM-768 (FIPS 203)</td><td>Key exchange</td><td>Module lattices (Kyber)</td><td>1,184 bytes</td><td>1,088 bytes</td></tr>
<tr><td>ML-DSA-65 (FIPS 204)</td><td>Signatures</td><td>Module lattices (Dilithium)</td><td>1,952 bytes</td><td>3,309 bytes</td></tr>
<tr><td>SLH-DSA-128s (FIPS 205)</td><td>Signatures</td><td>Hash functions only (SPHINCS+)</td><td>32 bytes</td><td>7,856 bytes</td></tr>
<tr><td>FN-DSA-512 (draft FIPS 206)</td><td>Signatures</td><td>NTRU lattices (Falcon)</td><td>897 bytes</td><td>about 666 bytes</td></tr>
<tr><td>HQC (selected 2025)</td><td>Key exchange, backup</td><td>Error-correcting codes</td><td colspan="2">Chosen so KEMs do not all rely on lattices</td></tr>
<tr><td>X25519 (today)</td><td>Key exchange</td><td>Elliptic curves</td><td>32 bytes</td><td>32 bytes</td></tr>
<tr><td>ECDSA P-256 (today)</td><td>Signatures</td><td>Elliptic curves</td><td>64 bytes</td><td>64 bytes</td></tr>
</tbody></table></div>
<p>NIST published FIPS 203, 204 and 205 in August 2024. Falcon is being standardized as FN-DSA in FIPS 206, and HQC was selected in March 2025 as a code-based alternative to ML-KEM. Post-quantum keys and signatures are larger, which matters for constrained devices and for protocols that send many certificates.</p>
<h2>Learning with errors</h2>
<p>Most of these schemes rest on <strong>learning with errors</strong> (LWE), introduced by Oded Regev in 2005. Given many noisy linear equations ${m('b = As + e (mod q)')}, with small random errors ${m('e')}, find the secret ${m('s')}. Without the errors, Gaussian elimination solves it instantly. With them, the best known classical and quantum algorithms take exponential time, and Regev showed that solving LWE would solve worst-case lattice problems. ML-KEM uses a structured version over polynomial rings (module-LWE), with ${m('q = 3329')}, for efficiency.</p>
${LAB('lwe')}
<h2>Migration</h2>
<p>Large deployments already use <strong>hybrid</strong> key exchange, combining X25519 with ML-KEM so that security holds if either one survives; major browsers and content networks enabled this for TLS in 2024. NIST’s draft transition guidance (IR 8547) proposes deprecating quantum-vulnerable public-key algorithms by 2030 and disallowing them by 2035. Hybrids are a sensible hedge: SIKE, an isogeny-based finalist in NIST’s process, was broken in 2022 by a classical attack that ran in about an hour on a laptop.</p>
${NOTE('Two different answers to one threat', `<p>Post-quantum cryptography (this lesson) runs on ordinary computers and replaces vulnerable mathematics. Quantum key distribution (Lesson 11) uses quantum hardware and physics. They are complementary, and most organizations will rely on post-quantum cryptography because it works over existing networks.</p>`)}
`,
  labs: {
    lwe: {
      title: 'A toy LWE encryption scheme',
      cap: 'Regev-style encryption with n = 6, q = 97 and 12 public samples. To encrypt a bit, add up a random subset of the public samples and add ⌊q/2⌋ for a 1. Decryption subtracts ⟨u, s⟩ and checks whether the result is near 0 (bit 0, blue arc) or near q/2 (bit 1, copper arc). The leftover error is the sum of the chosen e values; when it grows past q/4, decryption fails.',
      build(body, id) {
        const n = 6, q = 97, m2 = 12; let B = 3, s, A, e, b, runs = [], last = null;
        const R = Math.random, mod = x => ((x % q) + q) % q;
        const keys = () => { s = [...Array(n)].map(() => Math.floor(R() * q)); A = [...Array(m2)].map(() => [...Array(n)].map(() => Math.floor(R() * q))); e = [...Array(m2)].map(() => Math.floor(R() * (2 * B + 1)) - B); b = A.map((row, i) => mod(row.reduce((acc, a2, j) => acc + a2 * s[j], 0) + e[i])); runs = []; last = null; };
        const enc = mu => { let S = []; while (!S.length) S = [...Array(m2).keys()].filter(() => R() < .5); const u = [...Array(n)].map((_, j) => mod(S.reduce((acc, i) => acc + A[i][j], 0))), v = mod(S.reduce((acc, i) => acc + b[i], 0) + mu * Math.floor(q / 2)); return { mu, S, u, v }; };
        const dec = c2 => { const d = mod(c2.v - c2.u.reduce((acc, x, j) => acc + x * s[j], 0)); return { d, bit: d > q / 4 && d < 3 * q / 4 ? 1 : 0 }; };
        const cv = canvas('sq', 'max-width:300px;margin:0 auto'), ro = h('div', { class: 'readout', style: 'white-space:normal;font-size:12px' }), stat = h('div', { class: 'status' });
        const pc = painter(cv, ({ ctx, w, h: H }) => {
          const T = Theme.get(), cx = w / 2, cy = H / 2, R0 = Math.min(w, H) * .38, ang = x => -PI / 2 + TAU * x / q;
          ctx.lineWidth = 14; ctx.strokeStyle = rgba(T.cyan, .35); ctx.beginPath(); ctx.arc(cx, cy, R0, ang(-q / 4), ang(q / 4)); ctx.stroke();
          ctx.strokeStyle = rgba(T.copper, .35); ctx.beginPath(); ctx.arc(cx, cy, R0, ang(q / 4), ang(3 * q / 4)); ctx.stroke();
          txt(ctx, '0', cx, cy - R0 - 18, { color: T.ink, font: '700 13px "JetBrains Mono",monospace' }); txt(ctx, '⌊q/2⌋', cx, cy + R0 + 18, { color: T.ink, font: '700 13px "JetBrains Mono",monospace' });
          for (const r of runs.slice(-250)) { const a = ang(r.d), jit = R0 + (r.mu ? -26 : 26) + (r.k % 7) - 3; dot(ctx, cx + jit * Math.cos(a), cy + jit * Math.sin(a), 3, r.mu ? T.copper : T.cyan, r.bit !== r.mu ? T.bad : null); }
          txt(ctx, 'decrypted values', cx, cy, { color: T.muted });
        });
        const upd = () => {
          const bad = runs.filter(r => r.bit !== r.mu).length;
          ro.innerHTML = `<span class="k">secret s </span>(${s.join(', ')})<br><span class="k">errors e </span>(${e.join(', ')})<br><span class="k">public b </span>(${b.join(', ')})` + (last ? `<br><span class="k">last ciphertext </span>u = (${last.u.join(', ')}), v = ${last.v} · encrypted ${last.mu}, decrypted ${dec(last).bit} (value ${dec(last).d})` : '');
          stat.className = 'status' + (runs.length ? (bad ? ' bad' : ' good') : ''); stat.textContent = runs.length ? `${runs.length} encryptions, ${bad} decryption failure${bad === 1 ? '' : 's'} (${pct(bad / runs.length, 1)}). ${bad ? 'The accumulated error sometimes crossed q/4.' : 'Errors stayed well below q/4.'}` : 'Encrypt some bits.';
          pc.inv();
        };
        const go = k => { for (let i = 0; i < k; i++) { const mu = R() < .5 ? 1 : 0, c2 = enc(mu), dd = dec(c2); runs.push({ mu, d: dd.d, bit: dd.bit, k: runs.length }); last = c2; } upd(); };
        body.append(h('div', { class: 'split' }, cv, h('div', { class: 'stack' },
          slider({ id: id('B'), label: 'Error size: each eᵢ between −B and B', min: 0, max: 12, step: 1, value: B, fmt: String, on: v => { B = v; keys(); upd(); } }),
          h('div', { class: 'btns' }, btn('Encrypt 1 bit', () => go(1)), btn('Encrypt 200 bits', () => go(200), 'pri'), btn('New keys', () => { keys(); upd(); })), stat, ro)));
        keys(); go(60);
      }
    }
  },
  take: ['Shor breaks RSA, Diffie–Hellman and elliptic curves; Grover only modestly weakens symmetric crypto.',
    'NIST’s standards: ML-KEM (FIPS 203), ML-DSA (FIPS 204), SLH-DSA (FIPS 205), with FN-DSA and HQC to follow.',
    'Learning with errors is easy without noise and believed hard with it, for classical and quantum computers alike.',
    'Migration is under way with hybrid key exchange; harvest-now-decrypt-later makes it urgent for long-lived secrets.'],
  quiz: [
    { q: 'Which of these does Shor’s algorithm NOT break?', o: ['RSA', 'ECDSA', 'ML-KEM', 'Diffie–Hellman'], a: 2, why: 'ML-KEM rests on module lattices, for which no efficient quantum algorithm is known.' },
    { q: 'Why is LWE easy without the error term?', o: ['Because q is prime', 'Gaussian elimination solves exact linear equations', 'Because s is small', 'Because Grover applies'], a: 1, why: 'Noise-free linear equations mod q are solved directly; the small errors are what make it hard.' }
