<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23a2501a' stroke-width='5'/%3E%3Cline x1='32' y1='32' x2='32' y2='11' stroke='%23a2501a' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='11' r='6' fill='%23a2501a'/%3E%3C/svg%3E">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Into the Cryostat</title>
<meta name="description" content="An interactive guide to quantum computing, from the first qubit to error correction, by Sai Ganesh Chidambaram.">
<meta name="author" content="Sai Ganesh Chidambaram">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Math&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: a cryostat rail on the left lists five stages on a falling temperature scale (300 K to 10 mK);
   lessons read in a 68ch column of journal-style serif; labs break out to the full content width. */
:root{
  --bg:#edf0f4; --surface:#fafbfc; --surface-2:#e1e6ed; --ink:#131a29; --muted:#545f72; --line:#c5ccd7;
  --copper:#a2501a; --copper-hi:#dc9a62; --copper-lo:#7a3a10; --on-copper:#fff7ef; --copper-wash:#f2e2d3;
  --cyan:#0b6d80; --good:#1b774a; --bad:#ad332b; --scrim:rgba(8,12,20,.45);
  --is-dark:0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"STIX Two Text","Noto Sans Math",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:276px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e15; --surface:#111722; --surface-2:#192030; --ink:#e4e8f0; --muted:#8f99ad; --line:#283246;
    --copper:#e39c60; --copper-hi:#f3c592; --copper-lo:#a4602a; --on-copper:#1b1007; --copper-wash:#2d1e11;
    --cyan:#56c3d7; --good:#4fc48c; --bad:#f17d72; --scrim:rgba(0,0,0,.6);
    --is-dark:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e15; --surface:#111722; --surface-2:#192030; --ink:#e4e8f0; --muted:#8f99ad; --line:#283246;
  --copper:#e39c60; --copper-hi:#f3c592; --copper-lo:#a4602a; --on-copper:#1b1007; --copper-wash:#2d1e11;
  --cyan:#56c3d7; --good:#4fc48c; --bad:#f17d72; --scrim:rgba(0,0,0,.6);
  --is-dark:1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
::selection{background:var(--copper-wash)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);column-gap:44px;max-width:1460px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));
  overflow-y:auto;padding-block:30px 48px;padding-right:18px;border-right:1px solid var(--line);scrollbar-width:thin}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
main{min-width:0;flex:1;padding-block:0 72px;outline:none}
main:focus,main:focus-visible{outline:none}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;align-items:center;justify-content:space-between;gap:12px}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;
  font:500 13px/1.5 var(--f-mono);color:var(--muted)}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex}
}

/* ---------- brand + nav ---------- */
.brand{display:grid;gap:3px;text-decoration:none;color:var(--ink)}
.brand-name{font:800 23px/1 var(--f-display);letter-spacing:-.025em}
.brand-by{font:500 11.5px/1.3 var(--f-mono);color:var(--muted)}
.topbar .brand-name{font-size:20px}
.nav{display:grid;gap:22px;margin-top:30px}
.nav-home{display:flex;gap:10px;align-items:center;font:600 14px var(--f-display);color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:6px}
.nav-home:hover{color:var(--ink);background:var(--surface-2)}
.nav-home[aria-current="page"]{color:var(--ink);background:var(--copper-wash)}
.stage{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:10px}
.stage-temp{font:600 12px/1.25 var(--f-mono);color:var(--copper);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-body{border-left:1px solid var(--line);position:relative;padding-left:2px}
.stage-body::before{content:"";position:absolute;left:-9px;top:6px;width:17px;height:4px;border-radius:1px;
  background:linear-gradient(180deg,var(--copper-hi),var(--copper))}
.stage-name{font:700 11.5px/1.3 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);padding:0 0 6px 14px}
.nav-l{display:grid;grid-template-columns:20px minmax(0,1fr) 10px;gap:6px;align-items:baseline;padding:4px 8px 4px 12px;
  text-decoration:none;color:var(--muted);font:500 14.5px/1.35 var(--f-display);border-radius:6px}
.nav-l:hover{color:var(--ink);background:var(--surface-2)}
.nav-l[aria-current="page"]{color:var(--ink);background:var(--copper-wash)}
.nav-n{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums}
.pd{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);align-self:center}
.pd[data-s="seen"]{border-color:var(--copper)}
.pd[data-s="done"]{border-color:var(--copper);background:var(--copper)}
.nav-extra{display:grid;gap:2px;padding-top:6px;border-top:1px solid var(--line)}

/* ---------- drawer (mobile) ---------- */
.drawer{position:fixed;inset:0;z-index:40}
.drawer-scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer-panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--bg);overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- buttons & controls ---------- */
.btn{font:600 14px/1 var(--f-display);padding:10px 14px;min-height:40px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--copper)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.btn.pri:hover{background:var(--copper-lo);border-color:var(--copper-lo)}
.btn.sm{min-height:32px;padding:7px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate{font:600 18px/1 var(--f-body);min-width:46px;height:46px;padding:0 8px;display:inline-grid;place-items:center;border:1.5px solid var(--ink);
  border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.gate:hover{background:var(--copper-wash)}
.gate[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.gate sub,.gate sup{font-size:11px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:9px 12px;font:600 13px/1 var(--f-display);color:var(--muted);cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:grid;gap:3px;min-width:0}
.field-top{display:flex;justify-content:space-between;gap:10px;font:600 13px/1.3 var(--f-display);color:var(--muted)}
.field-top output{font:500 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.field.off{opacity:.45}
input[type=range]{width:100%;accent-color:var(--copper);margin:4px 0;height:24px}
select.sel{font:600 14px var(--f-display);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.ctl-label{font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- lesson page ---------- */
.ph{padding-block:52px 30px;border-bottom:1px solid var(--line);margin-bottom:34px;display:grid;gap:14px}
.ph-eyebrow{font:600 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper);display:flex;flex-wrap:wrap;gap:4px 16px}
.ph h1{font:800 clamp(38px,5.6vw,68px)/1.02 var(--f-display);letter-spacing:-.032em;margin:0;text-wrap:balance}
.ph .lede{font-size:clamp(19px,2.2vw,23px);line-height:1.45;max-width:58ch;margin:0}
.ph-meta{font:500 13px/1.5 var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.ph-meta b{color:var(--ink);font-weight:600}
.prose{counter-reset:eq lab}
.prose>*{max-width:68ch}
.prose>.lab,.prose>.wide{max-width:none}
.prose h2{font:700 clamp(24px,2.6vw,30px)/1.15 var(--f-display);letter-spacing:-.018em;margin:52px 0 12px;text-wrap:balance}
.prose h3{font:700 20px/1.25 var(--f-display);margin:30px 0 8px}
.prose p{margin:0 0 16px}
.prose ul,.prose ol{margin:0 0 18px;padding-left:24px;display:grid;gap:7px}
.prose li::marker{color:var(--copper);font:600 .85em var(--f-mono)}
.prose a{color:var(--copper);text-decoration-thickness:1px;text-underline-offset:3px}
.prose strong{font-weight:700}
.m{white-space:nowrap;font-family:var(--f-body)}
.eq{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:20px 0 24px;padding-inline:clamp(0px,4vw,34px);
  font-size:21px;line-height:1.5;overflow-x:auto;counter-increment:eq}
.eq>span{white-space:nowrap}
.eq::after{content:"(" counter(eq) ")";font:500 13px var(--f-mono);color:var(--muted);flex:none}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.frac>span+span{border-top:1px solid currentColor;padding-top:1px}
.mx{display:inline-grid;vertical-align:middle;padding:3px 10px;position:relative;column-gap:16px;row-gap:2px;text-align:center;line-height:1.35}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:5px;border:1.5px solid currentColor}
.mx::before{left:0;border-right:0}.mx::after{right:0;border-left:0}
.note{margin:26px 0;padding:16px 20px;background:var(--surface-2);border-radius:10px;font-size:17px}
.note-tag{display:block;font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin-bottom:6px}
.note p:last-child{margin-bottom:0}
.tbl-wrap{overflow-x:auto;margin:22px 0 30px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45}
.tbl th{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;
  background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700;white-space:nowrap}

/* ---------- labs ---------- */
.lab{margin:34px 0 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);counter-increment:lab;min-width:0}
.lab-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.lab-tag{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.lab-title{font:700 17px/1.3 var(--f-display);letter-spacing:-.005em}
.lab-body{padding:18px;display:grid;gap:18px;min-width:0}
.lab-cap{padding:12px 18px 14px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.5;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.wide-l{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.split,.split.even,.split.wide-l{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.cv{display:block;width:100%;touch-action:pan-y}
.cv.sq{aspect-ratio:1/1;max-width:100%}
.cv.grab{cursor:grab}.cv.grabbing{cursor:grabbing}
.readout{font:500 13px/1.65 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface-2);border-radius:8px;
  padding:10px 12px;overflow-x:auto;white-space:nowrap}
.readout .k{color:var(--muted)}
.ketline{font:400 21px/1.4 var(--f-body);overflow-x:auto;white-space:nowrap;padding-block:2px}
.status{font:500 15px/1.45 var(--f-body);padding:10px 12px;border-radius:8px;background:var(--copper-wash);color:var(--ink)}
.status.good{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--good)}
.status.bad{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--bad)}
.hint{font:400 14.5px/1.45 var(--f-body);color:var(--muted)}
.chipline{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px/1.5 var(--f-mono);color:var(--muted)}
.chipline b{color:var(--ink);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini{display:grid;gap:2px;text-align:center;font:600 12px var(--f-mono);color:var(--muted)}
.mini canvas{aspect-ratio:1/1;width:100%;max-width:170px;margin:0 auto}

/* bars */
.bars{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;height:170px;min-width:0}
.b-col{display:grid;grid-template-rows:16px minmax(0,1fr) auto;min-width:0;text-align:center}
.b-val{font:500 10.5px/16px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.b-track{position:relative;border-bottom:1.5px solid var(--line)}
.b-bar{position:absolute;left:10%;right:10%;bottom:0;height:0;border-radius:3px 3px 0 0;
  transition:height .5s cubic-bezier(.2,.7,.2,1),background-color .3s}
.b-mark{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.6}
.b-lab{font:400 13px/1.2 var(--f-body);padding-top:5px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.bars.dense .b-lab{font-size:10.5px;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;padding:4px 0 0}
.bars.dense .b-val{font-size:9px}

/* coin strip */
.strip{display:flex;flex-wrap:wrap;gap:3px;min-height:16px}
.strip i{width:12px;height:12px;border-radius:2px;display:block}
.c0{background:var(--cyan)}.c1{background:var(--copper)}

/* circuit svg */
.circ-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.circ{display:block}
.c-wire{stroke:var(--muted);stroke-width:1.2}
.c-box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.c-txt{fill:var(--ink);font:600 16px var(--f-body);text-anchor:middle;dominant-baseline:central}
.c-sub{fill:var(--ink);font:500 10px var(--f-body);text-anchor:start;dominant-baseline:central}
.c-dot{fill:var(--ink)}
.c-tgt{fill:none;stroke:var(--ink);stroke-width:1.5}
.c-line{stroke:var(--ink);stroke-width:1.5}
.c-cl{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3}
.c-lab{fill:var(--muted);font:500 12px var(--f-mono);dominant-baseline:central}
.c-hi{fill:var(--copper-wash)}
.c-at{stroke:var(--copper);stroke-width:2;stroke-dasharray:5 4}
.c-pend{fill:none;stroke:var(--copper);stroke-width:2;stroke-dasharray:4 3}
.c-hit{fill:transparent;cursor:pointer}
.c-hit:hover{fill:var(--copper-wash);fill-opacity:.6}
.c-hit:focus{outline:none}.c-hit:focus-visible{stroke:var(--copper);stroke-width:2}
.c-meter{fill:none;stroke:var(--ink);stroke-width:1.4}

/* tables inside labs */
.mini-tbl{width:100%;border-collapse:collapse;font:500 12.5px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.mini-tbl th{color:var(--muted);font-weight:600;text-align:center;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mini-tbl td{text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.mini-tbl tr.kept td{background:var(--copper-wash)}
.mini-tbl td.err{color:var(--bad);font-weight:700}
.scroll-x{overflow-x:auto;min-width:0}
.tt{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.tt button{display:grid;gap:2px;padding:6px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;
  font:500 11px var(--f-mono)}
.tt button b{font:700 18px/1 var(--f-mono)}
.tt button[data-v="1"] b{color:var(--copper)}
.tt button[data-q="1"]{box-shadow:inset 0 0 0 2px var(--cyan)}
.lamp{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font:700 13px var(--f-mono);
  color:var(--muted);background:var(--bg);transition:background-color .25s,color .25s}
.lamp[data-on="1"]{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.lamp[data-on="0"]{background:var(--surface-2);color:var(--ink)}
.wheel{width:30px;height:30px;border-radius:50%;flex:none}

/* ---------- end of lesson ---------- */
.take{margin-top:52px;padding:22px 24px 8px;border-radius:12px;background:var(--surface-2)}
.take h2{margin-top:0 !important}
.quiz{margin-top:44px}
.q{display:grid;gap:10px;margin:0 0 28px}
.q-q{font-weight:600;margin:0}
.q-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.q-opt{display:flex;gap:10px;align-items:baseline;text-align:left;font:500 16px/1.35 var(--f-body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.q-letter{flex:none;font:600 11px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 5px;transform:translateY(-1px)}
.q-opt[data-r="right"] .q-letter,.q-opt[data-r="shown"] .q-letter{color:var(--good);border-color:var(--good)}
.q-opt[data-r="shown"]{border:1.5px dashed var(--good)}
.q-opt:disabled:not([data-r]){opacity:.55}
.quiz-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.quiz-head h2{margin-bottom:4px !important}
.quiz-meta{font:500 12px var(--f-mono);color:var(--muted)}

.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center;padding-block:54px 50px;border-bottom:1px solid var(--line)}

.byline{font:500 15px/1.4 var(--f-display);color:var(--muted);margin:0}

.hero-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:24px;font:500 13px/1.4 var(--f-mono);color:var(--muted)}

.hero-lab{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:grid;gap:12px}

.sec{padding-block:52px 10px}

.sec>p{max-width:62ch;margin:0 0 14px}
.descent{display:grid;margin-top:30px}
.dz{display:grid;grid-template-columns:118px 136px minmax(0,1fr);column-gap:26px}
.dz-temp{font:600 26px/1 var(--f-mono);color:var(--copper);text-align:right;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dz-temp small{display:block;font:500 10.5px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-top:8px;white-space:normal}
.dz-ch{position:relative}
.dz-ch::before,.dz-ch::after{content:"";position:absolute;top:6px;bottom:0;width:3px;background:var(--line);border-radius:1px}
.dz-ch::before{left:calc(50% - 26px)}.dz-ch::after{left:calc(50% + 23px)}
.dz:last-child .dz-ch::before,.dz:last-child .dz-ch::after{bottom:auto;height:50px}
.dz-coax{position:absolute;top:6px;bottom:0;left:calc(50% - 1px);width:2px;
  background:repeating-linear-gradient(180deg,var(--copper) 0 6px,transparent 6px 14px);background-size:2px 14px;animation:flow 1.2s linear infinite;opacity:.8}
.dz:last-child .dz-coax{bottom:auto;height:50px}
@keyframes flow{from{background-position:0 0}to{background-position:0 14px}}
.dz-plate{position:relative;z-index:1;height:13px;width:var(--w);margin:0 auto;border-radius:2px;
  background:linear-gradient(180deg,var(--copper-hi),var(--copper) 60%,var(--copper-lo))}
.dz-chip{position:absolute;z-index:1;top:50px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:3px;border:2px solid var(--copper);
  background:repeating-linear-gradient(0deg,var(--surface) 0 5px,var(--line) 5px 6px),var(--surface)}
.dz-body{padding-bottom:46px;min-width:0}
.dz:last-child .dz-body{padding-bottom:20px}
.dz-kicker{font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dz-body h3{font:800 25px/1.1 var(--f-display);letter-spacing:-.02em;margin:6px 0 6px}
.dz-body p{margin:0 0 10px;max-width:56ch;color:var(--ink)}
.dz-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:1px;max-width:560px}
.dz-list a{display:grid;grid-template-columns:28px minmax(0,1fr) auto 10px;gap:10px;align-items:baseline;padding:7px 10px;border-radius:7px;text-decoration:none;
  font:600 16px/1.3 var(--f-display);color:var(--ink)}

@media (max-width:640px){

}

.sc{display:block;max-width:100%;height:auto}
.sc-x{fill:var(--copper);fill-opacity:.14;stroke:var(--copper);stroke-opacity:.35;stroke-width:1}
.sc-z{fill:var(--cyan);fill-opacity:.14;stroke:var(--cyan);stroke-opacity:.35;stroke-width:1}

.sc-flag{fill:var(--ink);font:700 13px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.sc-q{cursor:pointer}

.sc-dq{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.sc-q:hover .sc-dq,.sc-q:focus-visible .sc-dq{stroke:var(--copper);stroke-width:3}
.sc-dq.on{fill:var(--copper-wash);stroke:var(--copper);stroke-width:2.4}
.sc-ql{fill:var(--ink);font:700 14px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sc-hid{fill:var(--bad);font:700 12px var(--f-mono);text-anchor:start;pointer-events:none}
.fr{overflow:visible}
.fr-rod{stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:.6}
.fr-coax{stroke:var(--muted);stroke-width:2}
.fr-att{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.fr-amp{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.fr-note{fill:var(--muted);font:500 10.5px var(--f-mono)}
.fr-plate{fill:var(--copper);stroke:var(--copper-lo);stroke-width:1}
.fr-t{fill:var(--copper);font:600 13px var(--f-mono);dominant-baseline:central}
.fr-hit{fill:transparent}
.fr-st{cursor:pointer}
.fr-st:focus{outline:none}
.fr-st.on .fr-plate{fill:var(--copper-hi);stroke:var(--ink);stroke-width:2}
.fr-st.on .fr-t,.fr-st:hover .fr-t,.fr-st:focus-visible .fr-t{fill:var(--ink);font-weight:700}
.fr-st:hover .fr-plate,.fr-st:focus-visible .fr-plate{stroke:var(--ink);stroke-width:2}
.fr-chip{fill:var(--surface);stroke:var(--copper);stroke-width:2}
.fr-pulse{fill:var(--copper)}
.cx-ps{fill:var(--surface-2);stroke:var(--line)}
.cx-np{fill:var(--copper);fill-opacity:.12;stroke:var(--copper);stroke-width:1.5}
.cx-bqp{fill:var(--cyan);fill-opacity:.12;stroke:var(--cyan);stroke-width:1.5}
.cx-npc{fill:var(--copper);fill-opacity:.14;stroke:var(--copper);stroke-dasharray:4 3}
.cx-p{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.cx-l{fill:var(--ink);font:800 18px var(--f-display)}
.cx-s{fill:var(--ink);font:600 12px var(--f-mono)}
.cx-dot{fill:var(--muted)}
.cx-dot.on{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.cx-lab{fill:var(--ink);font:700 12.5px var(--f-display);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
/* ---------- part II ---------- */
.part-label{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0 0 8px;border-top:1px solid var(--line);padding-top:14px}
.part-label:first-of-type{border-top:0;padding-top:0}
.stage.trk .stage-temp{color:var(--cyan)}
.stage.trk .stage-body::before{left:-6px;top:4px;width:11px;height:11px;border-radius:2px;background:var(--cyan)}
.tracks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:26px}
.tracks>.trk-card{grid-column:span 3}
.tracks>.trk-card:nth-child(2),.tracks>.trk-card:nth-child(3),.tracks>.trk-card:nth-child(4){grid-column:span 2}
@media (max-width:1100px){.tracks>.trk-card:nth-child(n){grid-column:span 3}.tracks>.trk-card:nth-child(4){grid-column:span 6}}
@media (max-width:760px){.tracks{grid-template-columns:minmax(0,1fr)}.tracks>.trk-card:nth-child(n){grid-column:1/-1}}
.trk-card{display:grid;align-content:start;gap:6px;padding:20px 20px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.trk-card h3{font:800 22px/1.15 var(--f-display);letter-spacing:-.015em;margin:2px 0 0}
.trk-card p{margin:0;font-size:16px;line-height:1.5}
.tracks>.trk-card.feat{grid-column:1/-1}
.trk-card.feat{grid-column:1/-1;border-color:var(--copper);box-shadow:inset 0 0 0 1px var(--copper)}
.trk-card.feat .dz-list{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;max-width:none}
@media (max-width:760px){.trk-card.feat .dz-list{grid-template-columns:minmax(0,1fr)}}
.trk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trk-code{font:700 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--on-copper);background:var(--copper);padding:6px 8px;border-radius:4px}
.trk-card:not(.feat) .trk-code{background:var(--cyan);color:var(--bg)}
.code{margin:18px 0 22px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;max-width:none !important}
.code-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:500 13px/1.6 var(--f-mono);color:var(--ink);tab-size:4}
.qasm summary{cursor:pointer;font:600 14px var(--f-display);color:var(--copper);padding:4px 0}
.qasm .code{margin:10px 0 0}
.pstr b{font:700 1em var(--f-mono)}
.sc-match{stroke:var(--copper);stroke-width:3;stroke-linecap:round;opacity:.9}
.sc-corr{fill:none;stroke:var(--copper);stroke-width:2.5;stroke-dasharray:3 2}
.sc-def{fill:var(--copper);stroke:var(--surface);stroke-width:2}
.st{display:block}
.st-cell{fill:var(--surface);stroke:var(--line);cursor:pointer}
.st-cell.m{fill:var(--surface-2)}
.st-cell:hover,.st-cell:focus-visible{stroke:var(--copper);stroke-width:2;outline:none}
.st-cell.on.d{fill:var(--copper-wash);stroke:var(--copper)}

.hk-p{fill:var(--copper-wash);stroke:var(--copper);stroke-width:1.5}
.hk-f{fill:var(--copper);stroke:var(--copper-lo);stroke-width:1.5}

.hk-slot{fill:var(--muted);opacity:.35;cursor:pointer}
.hk-slot:hover,.hk-slot:focus-visible{opacity:1;fill:var(--copper);outline:none}
.hk-hit{fill:transparent;cursor:pointer}
.hk-hit:focus{outline:none}.hk-hit:focus-visible{stroke:var(--ink);stroke-width:2}
.zoo-e{stroke:var(--muted);stroke-width:1.5}
.zoo-e.on{stroke:var(--copper);stroke-width:2.5}
.zoo-n{cursor:pointer}
.zoo-n:focus{outline:none}
.zoo-n rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}

.zoo-n text{fill:var(--ink);font:700 12.5px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.zoo-n.on text{fill:var(--on-copper)}
.wband{position:relative;display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);font:600 11px/34px var(--f-mono);text-align:center;color:var(--ink)}
.wband span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wband span:nth-child(1){background:var(--surface-2)}

@media (prefers-reduced-motion:reduce){
  .qdisc{transition:none}
  .b-bar,.lamp{transition:none}
  .dz-coax{animation:none}
}

<script>
'use strict';
/* =====================================================================
   Into the Cryostat · core engine
   Simulation, drawing primitives and UI helpers shared by every lesson.
   ===================================================================== */
const TAU = Math.PI * 2, S2 = Math.SQRT1_2, PI = Math.PI;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => RMQ.matches;
const dur = ms => reduced() ? 0 : ms;
const deg = r => r * 180 / PI, rad = d => d * PI / 180;
const MINUS = '−';
function num(x, d = 3) {
  if (!isFinite(x)) return '—';
  const v = Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x;
  return v.toFixed(d).replace('-', MINUS);
}
const pct = (x, d = 1) => num(x * 100, d) + '%';
const ket = (i, n) => '|' + i.toString(2).padStart(n, '0') + '⟩';

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

  for (const c of kids.flat(3)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));

  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;

/* ---------------- Lesson 1 · Bits and qubits ---------------- */
LESSONS.push({
  id: 'qubits', n: 1, stage: 0, minutes: 9, title: 'Bits and qubits',
  lede: 'A classical bit is either 0 or 1. A qubit has two basis states too, but its state is described by two complex numbers, and that changes what a computer can do.',
  html: `
<h2>The classical bit</h2>
<p>Every digital device stores information in bits. A bit is a physical system with two states that are easy to tell apart: a transistor that is on or off, a patch of magnetic film pointing up or down, a pit or a flat spot on a disc. At any moment the bit has one definite value, and reading it does not change it.</p>
<h2>The quantum bit</h2>
<p>A qubit is also a two-level physical system. It might be the spin of an electron, the polarization of a photon, or two energy levels of an atom or of a superconducting circuit. We label the two levels ${m('|0⟩')} and ${m('|1⟩')}. The angled brackets are Dirac’s <em>ket</em> notation and simply mean “the state called 0”.</p>
<p>The difference is that a qubit can be in any combination of those two states:</p>
${EQ('|ψ⟩ = α|0⟩ + β|1⟩,&nbsp;&nbsp;&nbsp; |α|² + |β|² = 1')}
<p>The numbers ${m('α')} and ${m('β')} are complex numbers called <strong>amplitudes</strong>. When you measure the qubit you get 0 with probability ${m('|α|²')} and 1 with probability ${m('|β|²')}. Afterwards the qubit is left in the state you saw. So a qubit can sit in a continuum of states, but a single measurement only ever returns one bit.</p>
${LAB('switch')}
<h2>Why amplitudes and not just probabilities?</h2>
<p>It is tempting to read ${m('α|0⟩ + β|1⟩')} as “the qubit is secretly 0 or 1, and we just don’t know which”. That picture fails. Amplitudes can be negative or complex, and when two routes lead to the same outcome their amplitudes add before you square them. They can cancel each other out. Probabilities are never negative, so they can never cancel.</p>
<p>This cancellation is called <strong>interference</strong>, and it is the engine of every quantum algorithm. Lesson 6 shows it with a single photon.</p>
${NOTE('Common misconception', `<p>People often say a qubit “is 0 and 1 at the same time”, as if it held two values you could read out. You can’t. You get one bit per measurement. The power of a quantum computer comes from steering amplitudes so that wrong answers cancel and right answers reinforce before you measure.</p>`)}
<h2>The size of the description</h2>
<p>To describe ${m('n')} classical bits you need ${m('n')} numbers, each 0 or 1. To describe the general state of ${m('n')} qubits you need ${m('2ⁿ')} complex amplitudes, one for every string of ${m('n')} bits. The count doubles with every qubit you add.</p>
${LAB('doubling')}
<p>This is why simulating quantum systems on ordinary computers gets hard so quickly, and it is the first hint of why a machine built from qubits might do things classical machines cannot. It is not the whole story, though. You cannot read ${m('2ⁿ')} numbers out of ${m('n')} qubits. Holevo’s theorem caps what you can extract at ${m('n')} classical bits. A useful quantum algorithm has to arrange for the answer to show up in the few bits a measurement returns.</p>

/* ---------------- Lesson 2 · Superposition ---------------- */
LESSONS.push({
  id: 'superposition', n: 2, stage: 0, minutes: 10, title: 'Superposition',
  lede: 'Superposition means a state is a weighted sum of basis states. The weights are amplitudes, and each one has both a size and a phase.',
  html: `
<h2>Amplitudes have a size and a direction</h2>
<p>A complex number can be drawn as an arrow in a plane. Its length is its <strong>magnitude</strong> and its angle is its <strong>phase</strong>. Each amplitude of a qubit is such an arrow. The Born rule only looks at the length: ${m('P(0) = |α|²')} and ${m('P(1) = |β|²')}.</p>
<p>Multiplying the whole state by the same phase changes nothing you could ever measure, so we are free to make ${m('α')} a real, non-negative number. Then any qubit state needs just two angles:</p>
${EQ('|ψ⟩ = cos(θ/2)|0⟩ + e<sup>iφ</sup> sin(θ/2)|1⟩')}
<p>The angle ${m('θ')} sets how the probability is split between 0 and 1. The angle ${m('φ')} is the <strong>relative phase</strong> between the two parts. Changing ${m('φ')} never changes ${m('P(0)')} or ${m('P(1)')}, which makes it easy to dismiss. It starts to matter as soon as a gate mixes ${m('|0⟩')} and ${m('|1⟩')} together. The colour of each arrow below follows the phase wheel used across this guide: blue for positive real amplitudes, orange-red for negative ones.</p>
${LAB('dials')}
<p>Try the presets ${m('|+⟩')} and ${m('|−⟩')}. Measured directly they both give 50/50. Switch to “Apply H, then measure” and they give opposite, certain answers. The relative phase was there all along; the Hadamard gate turned it into something a measurement can see.</p>
<h2>A superposition is not a mixture</h2>
<p>Compare two ways of preparing a qubit. In the first you prepare ${m('|+⟩ = (|0⟩ + |1⟩)/√2')}. In the second you flip a fair coin and prepare ${m('|0⟩')} or ${m('|1⟩')} depending on the result. Measure either one in the 0/1 basis and you get 0 half the time and 1 half the time.</p>
<p>The difference shows up when you apply a Hadamard gate first. The superposition ${m('|+⟩')} turns into ${m('|0⟩')} every time. The coin-flip mixture still gives 0 or 1 at random. The superposition had a definite relative phase between its two parts; the mixture had none.</p>
${LAB('mixture')}
<h2>Four states worth knowing by name</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>State</th><th>Measured in the 0/1 basis</th></tr></thead><tbody>
<tr><td>|+⟩</td><td>(|0⟩ + |1⟩)/√2</td><td>50% / 50%</td></tr>
<tr><td>|−⟩</td><td>(|0⟩ − |1⟩)/√2</td><td>50% / 50%</td></tr>
<tr><td>|+i⟩</td><td>(|0⟩ + i|1⟩)/√2</td><td>50% / 50%</td></tr>
<tr><td>|−i⟩</td><td>(|0⟩ − i|1⟩)/√2</td><td>50% / 50%</td></tr>
</tbody></table></div>
<p>All four give identical statistics in the 0/1 basis, and all four are different states. They differ only in relative phase.</p>
${NOTE('Common misconception', `<p>Superposition does not mean the qubit is flickering between 0 and 1, and it does not mean it is secretly one of them. ${m('|+⟩')} is a perfectly definite state. Ask it the right question, “are you ${m('|+⟩')} or ${m('|−⟩')}?”, and it answers the same way every time.</p>`)}
`,

/* ---------------- Lesson 3 · Measurement ---------------- */
LESSONS.push({
  id: 'measurement', n: 3, stage: 0, minutes: 9, title: 'Measurement',
  lede: 'Measurement is how a quantum computer hands you an answer. It also changes the state it measures, and it only ever answers one question at a time.',
  html: `
<h2>The Born rule and collapse</h2>
<p>Measuring a qubit in the computational basis returns 0 with probability ${m('|α|²')} or 1 with probability ${m('|β|²')}. Immediately afterwards the qubit is in ${m('|0⟩')} or ${m('|1⟩')} to match the result. Measure again in the same basis and you get the same answer every time. The amplitudes that were there before are gone; one copy of a state is never enough to recover them.</p>
<h2>Choosing a basis</h2>
<p>The 0/1 basis is not special. You can measure along any axis. Measuring “in the X basis” asks whether the qubit is ${m('|+⟩')} or ${m('|−⟩')}. Most hardware can only measure in the 0/1 basis directly, so you rotate first: apply H, measure, and read 0 as “+” and 1 as “−”.</p>
<p>Lesson 4 introduces the Bloch sphere properly, but you can already use its geometric rule. Every state is a point on a sphere. The chance of getting the “+” result along an axis is</p>
${EQ('P(+) = (1 + cos γ) / 2')}
<p>where ${m('γ')} is the angle between the state and that axis. After the measurement the state jumps to whichever end of the axis matched.</p>
${LAB('measure')}
<h2>Measurement erases incompatible information</h2>
<p>Measurements along X and along Z are incompatible. Once you measure along X, whatever the qubit held about Z is gone. Try it above: start from ${m('|0⟩')}, measure Z (always 0), then X (random), then Z again. The last result is random, even though the first Z measurement was certain. This is the single-qubit version of Heisenberg’s uncertainty principle.</p>
<h2>Statistics need many runs</h2>
<p>A single run, called a <strong>shot</strong>, returns one bit. To estimate a probability you repeat the whole computation many times and count. The typical error of the estimate shrinks like ${m('1/√N')} for ${m('N')} shots:</p>
${EQ('σ = √( p(1 − p) / N )')}
<p>At ${m('p = 0.5')}, 100 shots give an uncertainty of about ±5 percentage points and 10,000 shots about ±0.5. Halving the error costs four times as many shots, which is why real quantum experiments often run tens of thousands of shots per circuit.</p>
${LAB('shots')}
`,
  labs: {
    measure: {
      title: 'Measure along an axis',
      cap: 'Drag the sphere to change your viewpoint. The highlighted axis is the one you are measuring along. Each measurement snaps the state to one end of that axis.',
      build(body, id) {

        const prob = h('div', { class: 'chipline' }), log = h('ol', { class: 'hint', style: 'margin:0;padding-left:20px;display:grid;gap:2px' });
        const updProb = () => { const p = (1 + V.dot(st, AX[basis])) / 2; prob.innerHTML = `<span>state <b>${ketOfBloch(st)}</b></span><span>P(${LAB_[basis][0]}) <b>${pct(p, 1)}</b></span><span>P(${LAB_[basis][1]}) <b>${pct(1 - p, 1)}</b></span>`; };
        const prepare = k => { prep = k; st = k === 'rand' ? fromAngles(Math.acos(2 * Math.random() - 1), Math.random() * TAU) : CARD[k].slice(); bv.moveTo(st, 500); log.innerHTML = ''; updProb(); };
        const measure = () => {
          const a = AX[basis], p = (1 + V.dot(st, a)) / 2, plus = Math.random() < p;
          st = V.scale(a, plus ? 1 : -1); bv.moveTo(st, 420); updProb();
          log.prepend(h('li', null, `${basis.toUpperCase()} basis → ${LAB_[basis][plus ? 0 : 1]}  (chance was ${pct(plus ? p : 1 - p, 0)})`));
          while (log.children.length > 8) log.lastChild.remove();
        };
        const presets = h('div', { class: 'btns' }, ...['0', '1', '+', '-', '+i', '-i'].map(k => btn(CARD_LABEL[k], () => prepare(k), 'sm')), btn('Random', () => prepare('rand'), 'sm'));
        const bs = seg([{ v: 'z', label: 'Z  (0 / 1)' }, { v: 'x', label: 'X  (+ / −)' }, { v: 'y', label: 'Y  (+i / −i)' }], 'z', v => { basis = v; bv.hi = v; bv.inv(); updProb(); }, 'Measurement basis');
        body.append(h('div', { class: 'split' }, cv, h('div', { class: 'stack' }, field('Prepare a state', presets), field('Measure along', bs),
          h('div', { class: 'btns' }, btn('Measure', measure, 'pri'), btn('Prepare again', () => prepare(prep))), prob, field('Results, newest first', log))));
        bv.set(st); updProb();
      }
    },
    shots: {
      title: 'Shot noise',
      cap: 'Each of the 200 experiments estimates the probability from a fixed number of shots. The shaded band is ±1 standard deviation predicted by σ = √(p(1 − p)/N).',
      build(body, id) {
        let p = .5, lgN = 2, ests = [];
        const cv = canvas('', 'height:240px'), out = h('div', { class: 'chipline' });
        const N = () => Math.round(Math.pow(10, lgN));
        const run = () => { const n = N(); ests = []; for (let k = 0; k < 200; k++) ests.push(binom(n, p) / n); pt.inv(); stats(); };
        const stats = () => {
          const n = N(), sd = Math.sqrt(p * (1 - p) / n);
          let obs = '—'; if (ests.length) { const mu = ests.reduce((a, b) => a + b, 0) / ests.length; obs = pct(Math.sqrt(ests.reduce((a, b) => a + (b - mu) ** 2, 0) / ests.length), 2); }
          out.innerHTML = `<span>shots per experiment <b>${n.toLocaleString('en-US')}</b></span><span>predicted σ <b>${pct(sd, 2)}</b></span><span>observed σ <b>${obs}</b></span>`;
        };
        const pt = painter(cv, ({ ctx, w, h: H }) => {
          const T = Theme.get(), bins = new Array(101).fill(0); ests.forEach(e => bins[Math.round(e * 100)]++);

          const sd = Math.sqrt(p * (1 - p) / N());
          ctx.fillStyle = rgba(T.copper, .14); ctx.fillRect(A.X(Math.max(0, p - sd)), A.T, A.X(Math.min(1, p + sd)) - A.X(Math.max(0, p - sd)), A.B - A.T);

          bins.forEach((c2, i) => { if (!c2) return; ctx.fillStyle = T.cyan; const x = A.X(i / 100) - bw / 2; ctx.fillRect(x, A.Y(c2), bw, A.B - A.Y(c2)); });

        body.append(h('div', { class: 'split wide-l' }, cv, h('div', { class: 'stack' }, sP, sN, btn('Run 200 experiments again', run, 'pri'), out)));

/* ---------------- Lesson 4 · The Bloch sphere ---------------- */

<p>The north pole is ${m('|0⟩')} and the south pole is ${m('|1⟩')}. The equator holds every equal superposition: ${m('|+⟩')} on the x axis, ${m('|+i⟩')} on the y axis, and their opposites on the far side.</p>

/* ---------------- Lesson 6 · Phase and interference ---------------- */
LESSONS.push({
  id: 'interference', n: 6, stage: 1, minutes: 11, title: 'Phase and interference',
  lede: 'Quantum algorithms arrange for amplitudes to cancel on wrong answers and add up on right ones. An interferometer shows the effect with one photon at a time.',
  html: `
<h2>Two paths, one photon</h2>
<p>A Mach–Zehnder interferometer sends light into a beam splitter, along two arms, and into a second beam splitter with a detector on each output. Turn the source down until it emits one photon at a time. Each photon is detected whole, at one detector or the other, never split between them. Yet after the first beam splitter it is in an equal superposition of travelling along the upper arm and the lower arm.</p>
<p>With the two arms exactly balanced, every single photon arrives at detector D0. The two routes to D1 have amplitudes of equal size and opposite sign, and they cancel. Add a phase shift ${m('φ')} to one arm and the odds become</p>
${EQ('P(D0) = cos²(φ/2),&nbsp;&nbsp;&nbsp; P(D1) = sin²(φ/2)')}
${LAB('mzi')}
<h2>Looking destroys the pattern</h2>
<p>Switch on the which-path detector. It records which arm each photon took, and the interference disappears: each detector clicks half the time whatever the phase. The record is a measurement of the path, and as Lesson 3 showed, measurement wipes out the relative phase that interference relies on. The detector does not need to disturb the photon’s motion. It only has to make the path knowable in principle.</p>
<h2>Adding arrows</h2>
<p>Richard Feynman described the rule this way: for each outcome, draw one arrow per path that leads to it, add the arrows head to tail, and square the length of the result. Arrows that point the same way reinforce. Arrows that point in opposite directions cancel.</p>
${LAB('arrows')}
<h2>The same thing as a circuit</h2>
<p>A balanced beam splitter acts on the photon’s path much like a Hadamard gate acts on a qubit (up to phase conventions). The whole interferometer is the circuit H, then a phase, then H. With no phase shift, ${m('H·H = I')} and the photon comes out where it went in. A phase of π is a Z gate, and ${m('HZH = X')} sends every photon to the other detector.</p>
${NOTE('Why this matters for algorithms', `<p>Every quantum algorithm in Stage 4 is an elaborate interferometer. Deutsch–Jozsa, Grover and Shor all spread the state over many computational paths, stamp phases on them that depend on the problem, and then recombine the paths so that the phases cancel on wrong answers.</p>`)}
`,
  labs: {

      build(body, id) {

        const cv = canvas('', 'height:310px'), chart = canvas('', 'height:170px'), stats = h('div', { class: 'chipline' });
        const P = { src: [.07, .76], bs1: [.25, .76], m1: [.25, .28], m2: [.69, .76], bs2: [.69, .28], d0: [.92, .28], d1: [.69, .06], ps: [.47, .76] };
        const up = [P.bs1, P.m1, P.bs2], lo = [P.bs1, P.m2, P.bs2];
        let W = 1, H = 1; const S = p => [p[0] * W, p[1] * H];
        const along = (pts, f) => {
          const seg = []; let L = 0; for (let i = 1; i < pts.length; i++) { const a = S(pts[i - 1]), b = S(pts[i]), l = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push([a, b, l]); L += l; }

${EQ('(a₀|0⟩ + a₁|1⟩) ⊗ (b₀|0⟩ + b₁|1⟩) = a₀b₀|00⟩ + a₀b₁|01⟩ + a₁b₀|10⟩ + a₁b₁|11⟩')}
<p>In this guide the left digit of a ket belongs to qubit 0, which is the top wire in circuit diagrams. Some software, Qiskit for example, writes the digits in the opposite order, so check the convention whenever you compare results across tools.</p>
${LAB('twoq')}
<h2>Two-qubit gates</h2>
<p>The workhorse two-qubit gate is the <strong>controlled-NOT</strong>, or CNOT. It flips the target qubit when the control qubit is 1 and leaves it alone when the control is 0:</p>
<div class="tbl-wrap" style="max-width:420px"><table class="tbl"><thead><tr><th>Input</th><th>Output</th></tr></thead><tbody>
<tr><td>|00⟩</td><td>|00⟩</td></tr><tr><td>|01⟩</td><td>|01⟩</td></tr><tr><td>|10⟩</td><td>|11⟩</td></tr><tr><td>|11⟩</td><td>|10⟩</td></tr></tbody></table></div>
<p>On basis states CNOT behaves exactly like a classical XOR gate. On superpositions it does something no classical gate can: it can turn a product state into an entangled one. Try it in the lab above. Put qubit 0 on the equator, leave qubit 1 at ${m('|0⟩')}, and switch on CNOT. Both small Bloch vectors shrink to nothing, and the entanglement meter jumps to 1.</p>
<p>Two other common gates are <strong>CZ</strong>, which flips the sign of ${m('|11⟩')} and is symmetric between its two qubits, and <strong>SWAP</strong>, which exchanges two qubits’ states.</p>

<p>The four <strong>Bell states</strong> are the simplest maximally entangled states of two qubits:</p>

<p>You make ${m('|Φ⁺⟩')} with two gates: a Hadamard on the first qubit, then a CNOT. Measure either qubit and the result is random, 50/50. Measure both and the results always agree. Start from the other three basis states and the same circuit produces the other three Bell states.</p>
${LAB('bell')}
<h2>Each half alone is completely random</h2>
<p>Look at either qubit of a Bell pair by itself and there is no preferred direction at all. Its Bloch vector has length zero; the qubit sits at the center of the ball, and every measurement axis gives 50/50. All the information is in the correlations between the two qubits. That is what entanglement means in practice: the pair is in a definite state, and neither part is.</p>
<h2>Correlations are not signals</h2>
<p>Alice’s results are 50/50 whatever Bob does to his qubit, including measuring it or not. She only sees the correlation when the two of them compare notes over an ordinary channel. Entanglement cannot be used to send a message faster than light. That is also why the teleportation protocol in Lesson 10 needs two classical bits.</p>
<h2>Stronger than any classical correlation</h2>
<p>Classical shared randomness can also produce perfectly matching results: seal the same card in two envelopes and post one to each person. In 1964 John Bell showed that entangled particles do something envelopes cannot. Let Alice choose between two measurement directions, ${m('a')} and ${m('a′')}, and Bob between ${m('b')} and ${m('b′')}. Write ${m('E')} for the average of the product of their ±1 results. Combine four averages into</p>
${EQ('S = E(a, b) + E(a, b′) + E(a′, b) − E(a′, b′)')}
<p>Any model in which the outcomes are fixed in advance by shared instructions gives ${m('|S| ≤ 2')}. This is the CHSH inequality, named after Clauser, Horne, Shimony and Holt. Quantum mechanics predicts values up to ${m('2√2 ≈ 2.83')}. Experiments agree with quantum mechanics, including the loophole-free tests of 2015, and the 2022 Nobel Prize in Physics went to Alain Aspect, John Clauser and Anton Zeilinger for this line of work.</p>

/* ---------------- Lesson 10 · Teleportation ---------------- */
LESSONS.push({

<h2>Why it is needed: you cannot copy a qubit</h2>
<p>The <strong>no-cloning theorem</strong> says no device can take an unknown state ${m('|ψ⟩')} and a blank qubit and produce two copies of ${m('|ψ⟩')}. Alice cannot simply measure her qubit and send a description either: one measurement reveals one bit and destroys the rest. Teleportation is the way around both problems.</p>
${NOTE('Why cloning fails', `<p>Suppose a gate ${m('U')} copied basis states: ${m('U|0⟩|0⟩ = |0⟩|0⟩')} and ${m('U|1⟩|0⟩ = |1⟩|1⟩')}. Because ${m('U')} is linear, it must send ${m('|+⟩|0⟩')} to ${m('(|00⟩ + |11⟩)/√2')}. A true copy would be ${m('|+⟩|+⟩ = (|00⟩ + |01⟩ + |10⟩ + |11⟩)/2')}. They differ, so no such ${m('U')} exists.</p>`)}
<h2>The protocol</h2>
<ol>
<li>Alice and Bob share a Bell pair ${m('|Φ⁺⟩')}: Alice holds qubit 1, Bob holds qubit 2.</li>
<li>Alice applies a CNOT from her message qubit (qubit 0) to qubit 1, then a Hadamard to qubit 0.</li>
<li>Alice measures qubits 0 and 1 and gets two bits, ${m('m₀')} and ${m('m₁')}.</li>
<li>She sends the two bits to Bob over an ordinary channel: a phone line, an email, a laser pulse.</li>
<li>Bob applies X if ${m('m₁ = 1')}, then Z if ${m('m₀ = 1')}. His qubit is now ${m('|ψ⟩')}.</li>
</ol>
${LAB('teleport')}
<h2>Why it works</h2>
<p>Just before Alice measures, the three-qubit state can be regrouped according to Alice’s two qubits:</p>
${EQ('½ [ |00⟩(α|0⟩ + β|1⟩) + |01⟩(α|1⟩ + β|0⟩) + |10⟩(α|0⟩ − β|1⟩) + |11⟩(α|1⟩ − β|0⟩) ]')}
<p>Each of Alice’s four outcomes has probability 1/4, whatever ${m('|ψ⟩')} is, so her results reveal nothing about the message. Each outcome leaves Bob holding ${m('|ψ⟩')} up to a known correction: nothing, X, Z, or both. The two bits tell him which.</p>
<h2>What teleportation is not</h2>
<p>Alice’s original is destroyed by her measurement, so the no-cloning theorem is respected. Until the two bits arrive, Bob’s qubit is, on average, completely random; in the lab his Bloch vector sits at the center between the CNOT and his correction. The bits travel no faster than light, so neither does the state.</p>
<p>Teleportation is not just a thought experiment. It has been demonstrated with photons, trapped ions and superconducting circuits, and in 2017 the Micius satellite teleported photon states from the ground to orbit over distances of up to about 1,400 km. Inside quantum computers, teleportation-based tricks are used to move qubits and to apply certain gates in error-corrected machines.</p>
`,

LESSONS.push({
  id: 'bb84', n: 11, stage: 2, minutes: 12, title: 'Quantum key distribution',
  lede: 'Quantum key distribution lets two people grow a shared secret key and notice any eavesdropper, using the fact that measuring a quantum state disturbs it.',
  html: `
<h2>The BB84 protocol</h2>
<p>Charles Bennett and Gilles Brassard proposed the first quantum key distribution scheme in 1984. It needs no entanglement, just single photons and two measurement bases.</p>
<ol>
<li>For each photon, Alice picks a random bit and a random basis. In the rectilinear basis (+), 0 is horizontal ↔ and 1 is vertical ↕. In the diagonal basis (×), 0 is 45° ⤢ and 1 is 135° ⤡. She sends the photon.</li>
<li>Bob picks a random basis for each photon and measures. If his basis matches Alice’s he gets her bit. If not, his result is a coin toss.</li>
<li>Over a public channel they announce their bases, never their bits, and keep only the positions where the bases matched. This <strong>sifted key</strong> is about half the photons.</li>
<li>They publish a random sample of the sifted bits to estimate the error rate, then throw that sample away.</li>
<li>If the error rate is low enough, they run error correction and <strong>privacy amplification</strong>, which squeezes the key down to a shorter one that an eavesdropper knows essentially nothing about.</li>
</ol>
${LAB('bb84')}
<h2>Catching Eve</h2>
<p>An eavesdropper, traditionally called Eve, cannot copy the photons (no-cloning, Lesson 10) and does not know which basis each one used. Suppose she measures every photon in a random basis and sends on a fresh photon matching her result. Half the time she picks the wrong basis, and each of those photons then gives Bob the wrong bit half the time, even when Bob’s basis matches Alice’s. The result is an error rate of 25% in the sifted key, which Alice and Bob will spot.</p>
<p>Real channels have some noise too, so Alice and Bob cannot demand zero errors. Security proofs for BB84 with one-way error correction tolerate error rates up to about 11%. Above that threshold they abort and try again.</p>
<h2>In practice</h2>
<p>QKD has been run over fibre networks and satellite links. Its security rests on physics rather than on a problem being hard to compute, which makes it immune to Shor’s algorithm. Real devices have imperfections, such as pulses that occasionally hold two photons and detectors that can be blinded, and modern protocols such as decoy-state and measurement-device-independent QKD close many of these gaps. QKD also needs an authenticated classical channel, so in practice it works alongside classical cryptography.</p>

/* ---------------- Lesson 12 · Deutsch–Jozsa ---------------- */
LESSONS.push({
  id: 'deutsch', n: 12, stage: 3, minutes: 12, title: 'Deutsch–Jozsa and phase kickback',
  lede: 'The first algorithm to show a quantum computer answering a question with fewer queries than any deterministic classical method. Its central trick, phase kickback, appears in almost every algorithm that follows.',
  html: `
<h2>The problem</h2>
<p>You are handed a black box, called an <strong>oracle</strong>, that computes a function ${m('f')} from ${m('n')}-bit strings to a single bit. You are promised that ${m('f')} is either <strong>constant</strong>, giving the same output for every input, or <strong>balanced</strong>, giving 0 on exactly half the inputs and 1 on the other half. Which is it?</p>
<p>A deterministic classical algorithm has to be careful. In the worst case it sees the same output on the first half of the inputs and still cannot tell, so it needs ${m('2<sup>n−1</sup> + 1')} queries to be certain. The quantum algorithm needs one.</p>
<h2>The oracle as a phase</h2>
<p>A quantum oracle has to be reversible, so it keeps its input and adds the answer into a spare output qubit: ${m('U<sub>f</sub>|x⟩|y⟩ = |x⟩|y ⊕ f(x)⟩')}. Now prepare the output qubit in ${m('|−⟩')}. Adding 1 to ${m('|−⟩')} just multiplies it by −1, so</p>
${EQ('U<sub>f</sub> |x⟩|−⟩ = (−1)<sup>f(x)</sup> |x⟩|−⟩')}
<p>The output qubit is unchanged and the function value has moved into the phase of the input register. This is <strong>phase kickback</strong>. Because the input register can be in a superposition of every ${m('x')} at once, one query stamps a sign on all ${m('2ⁿ')} terms.</p>
<h2>The algorithm</h2>
<ol>
<li>Start the input register in ${m('|0…0⟩')} and apply H to every qubit, giving an equal superposition of all ${m('2ⁿ')} inputs.</li>
<li>Query the oracle once. Each term picks up the sign ${m('(−1)<sup>f(x)</sup>')}.</li>
<li>Apply H to every qubit again and measure.</li>
</ol>
<p>The final amplitude of ${m('|0…0⟩')} is the average of the signs:</p>
${EQ('⟨0…0| H<sup>⊗n</sup> U<sub>f</sub> H<sup>⊗n</sup> |0…0⟩ = (1/2ⁿ) Σ<sub>x</sub> (−1)<sup>f(x)</sup>')}
<p>For a constant function the signs all agree, the average is ±1, and you measure all zeros with certainty. For a balanced function the signs cancel exactly and you never measure all zeros. One query, no error.</p>
${LAB('dj')}
${NOTE('A fair comparison', `<p>A randomized classical algorithm that queries a handful of random inputs is right with high probability, so the advantage here is only over deterministic algorithms. Deutsch–Jozsa matters for its technique. Bernstein–Vazirani and Simon’s algorithm use the same structure to get stronger separations, and Simon’s algorithm directly inspired Shor’s.</p>`)}

        const render = () => {

/* ---------------- Lesson 13 · Grover's search ---------------- */
LESSONS.push({

<h2>Unstructured search</h2>
<p>Suppose you have ${m('N')} candidates and an oracle that recognizes the right one, but nothing else to go on: no sorting, no structure. Classically you must check about ${m('N/2')} candidates on average. Lov Grover showed in 1996 that a quantum computer needs only about ${m('(π/4)√N')} oracle calls. For a million candidates that is roughly 785 calls instead of 500,000.</p>
<h2>Two reflections</h2>
<p>Start with every candidate in equal superposition. Then repeat two steps:</p>
<ol>
<li><strong>Oracle.</strong> Flip the sign of the marked item’s amplitude (phase kickback again).</li>
<li><strong>Diffusion.</strong> Reflect every amplitude about the average amplitude: ${m('a → 2⟨a⟩ − a')}.</li>
</ol>
<p>The oracle pushes the marked amplitude below zero, which drags the average down slightly. Reflecting about the average then lifts the marked amplitude well above all the others, which shrink a little. Each round transfers more amplitude onto the answer.</p>
${LAB('grover')}
<h2>The geometric picture</h2>
<p>The state never leaves a two-dimensional plane: the one spanned by the marked state ${m('|w⟩')} and the equal superposition of all unmarked states, ${m('|s′⟩')}. Both steps are reflections in that plane, and two reflections make a rotation. Each iteration turns the state by ${m('2θ')} toward ${m('|w⟩')}, where ${m('sin θ = 1/√N')}. After ${m('k')} iterations</p>

<h2>What a quadratic speedup buys</h2>
<p>Grover’s speedup is provably the best possible for unstructured search: Bennett, Bernstein, Brassard and Vazirani showed in 1997 that any quantum algorithm needs on the order of ${m('√N')} queries. A quadratic speedup is real but modest. Each oracle call on a fault-tolerant machine is slow compared with a classical check, so the advantage only pays off for very large search spaces. Its most quoted consequence is for symmetric cryptography: Grover search would roughly halve the effective key length of a cipher such as AES, which is why 256-bit keys are recommended for long-term security.</p>

/* ---------------- Lesson 14 · Quantum Fourier transform ---------------- */

  html: `
<h2>Definition</h2>
<p>On ${m('n')} qubits, with ${m('N = 2ⁿ')}, the QFT maps each basis state to a superposition of all basis states with steadily turning phases:</p>
${EQ('QFT |x⟩ = (1/√N) Σ<sub>k=0</sub><sup>N−1</sup> e<sup>2πi·xk/N</sup> |k⟩')}
<p>It is the same discrete Fourier transform used in signal processing and image compression, applied to the list of ${m('N')} amplitudes.</p>
<h2>Binary clocks</h2>
<p>The output of the QFT on a basis state is a product state: every qubit lands on the equator of its Bloch sphere, with a phase that turns at its own rate as ${m('x')} increases. Writing qubit 1 as the leftmost,</p>
${EQ('QFT |x⟩ = ⊗<sub>j=1</sub><sup>n</sup> (|0⟩ + e<sup>2πi·x/2<sup>j</sup></sup> |1⟩)/√2')}
<p>The leftmost qubit turns half a revolution for every step of ${m('x')}, the next a quarter, the next an eighth, and so on. It is a set of clock hands counting in binary: the fast hand records the last bit of ${m('x')} and the slow hand the whole number.</p>
${LAB('clocks')}
<h2>Finding a period</h2>
<p>The property that makes the QFT useful is what it does to periodic inputs. If the amplitudes repeat every ${m('r')} steps, the output concentrates on multiples of ${m('N/r')}. Measuring then gives a number close to a multiple of ${m('N/r')}, and from it you can work out ${m('r')}. Shor’s algorithm in the next lesson does exactly this.</p>
${LAB('periodic')}
<h2>The circuit and its cost</h2>
<p>The QFT circuit uses one Hadamard per qubit, controlled phase rotations ${m('R<sub>k</sub>')} between pairs of qubits, where ${m('R<sub>k</sub>')} applies a phase of ${m('2π/2<sup>k</sup>')}, and swaps to reverse the qubit order at the end.</p>
<div class="wide" data-qft-circuit></div>
<p>That is ${m('n(n − 1)/2')} controlled rotations, so the gate count grows like ${m('n²')}. The classical fast Fourier transform of ${m('2ⁿ')} numbers takes about ${m('n·2ⁿ')} operations. The catch is that the QFT’s output lives in amplitudes, which cannot be read out directly. The QFT only helps inside algorithms that make the output collapse onto something useful.</p>

/* ---------------- Lesson 15 · Shor's algorithm ---------------- */
LESSONS.push({
  id: 'shor', n: 15, stage: 3, minutes: 15, title: 'Shor’s algorithm',
  lede: 'Shor’s algorithm factors whole numbers in polynomial time on a large enough fault-tolerant quantum computer. The quantum part finds a period; the rest is number theory you can do with a pencil.',
  html: `
<h2>Factoring as period finding</h2>
<p>Peter Shor’s 1994 insight was that factoring a number ${m('N')} reduces to finding the period of a simple function. The recipe:</p>
<ol>
<li>Pick a random ${m('a')} with ${m('1 < a < N')}. If ${m('gcd(a, N) > 1')} you have stumbled on a factor already.</li>
<li>Find the <strong>period</strong> ${m('r')} of ${m('f(x) = a<sup>x</sup> mod N')}: the smallest ${m('r > 0')} with ${m('a<sup>r</sup> ≡ 1 (mod N)')}. This is the hard step, and the quantum computer does it.</li>
<li>If ${m('r')} is even and ${m('a<sup>r/2</sup> ≢ −1 (mod N)')}, then ${m('gcd(a<sup>r/2</sup> − 1, N)')} and ${m('gcd(a<sup>r/2</sup> + 1, N)')} are factors of ${m('N')}.</li>
<li>Otherwise pick another ${m('a')}. For an odd ${m('N')} with at least two different prime factors, each random ${m('a')} succeeds with probability at least one half.</li>
</ol>
<p>Step 3 works because ${m('a<sup>r</sup> − 1 = (a<sup>r/2</sup> − 1)(a<sup>r/2</sup> + 1)')} is a multiple of ${m('N')}, while neither bracket is. So each bracket must share part of ${m('N')}’s factorization.</p>
${LAB('shor')}
<h2>The quantum part</h2>
<p>Use two registers. Put the first, with ${m('q')} qubits where ${m('Q = 2<sup>q</sup> ≥ N²')}, into an equal superposition of every ${m('x')}. Compute ${m('a<sup>x</sup> mod N')} into the second register; this modular exponentiation is the expensive part of the whole algorithm. Measuring the second register, or simply ignoring it, leaves the first in a superposition of ${m('x')} values spaced ${m('r')} apart: a periodic state, like the one in Lesson 14. Apply the QFT and measure. The result ${m('y')} lands near a multiple of ${m('Q/r')}, so ${m('y/Q ≈ j/r')} for some unknown ${m('j')}.</p>
<p>The <strong>continued fraction</strong> expansion of ${m('y/Q')} finds the best fraction with a small denominator, which reveals ${m('r')} or a divisor of it. A few repetitions are enough with high probability.</p>
<h2>How big a machine?</h2>
<p>Breaking a 2048-bit RSA key needs an error-corrected machine far beyond anything built so far. Published resource estimates have come down sharply: from about 20 million noisy physical qubits running for 8 hours (Gidney and Ekerå, 2019) to under a million noisy qubits running for less than a week (Gidney, 2025). Both assume physical error rates around 0.1% and the surface code of Lesson 18. The numbers factored on real hardware with Shor-style circuits so far are tiny, such as 15 and 21, and several reported demonstrations used shortcuts that depend on already knowing the answer.</p>
<h2>Why it matters anyway</h2>
<p>RSA and elliptic-curve cryptography both fall to variants of Shor’s algorithm, and encrypted data recorded today could be decrypted once a large machine exists. That risk is why NIST published its first post-quantum cryptography standards (FIPS 203, 204 and 205) in August 2024, built on mathematical problems with no known efficient quantum attack.</p>

<h2>The hybrid loop</h2>
<ol>
<li>Prepare a short <strong>parameterized circuit</strong>, called an ansatz, ${m('|ψ(θ)⟩ = U(θ)|0⟩')}.</li>
<li>Measure the average value of a cost, usually an energy ${m('E(θ) = ⟨ψ(θ)|H|ψ(θ)⟩')} for some Hamiltonian ${m('H')}.</li>
<li>A classical optimizer proposes better parameters.</li>
<li>Repeat until the cost stops improving.</li>
</ol>
<p>The <strong>variational principle</strong> guarantees that ${m('E(θ)')} can never be lower than the true ground-state energy, so pushing it down pushes the state toward the ground state. This is the variational quantum eigensolver, VQE, aimed at chemistry and materials. QAOA, the quantum approximate optimization algorithm, uses the same loop for combinatorial problems, with a circuit structure taken from the problem.</p>
<h2>Gradients from the circuit itself</h2>
<p>For gates of the form ${m('e<sup>−iθP/2</sup>')}, where ${m('P')} is a Pauli operator, the exact derivative can be measured on the same hardware by running the circuit twice with shifted parameters. This is the <strong>parameter-shift rule</strong>:</p>
${EQ('∂E/∂θ = [ E(θ + π/2) − E(θ − π/2) ] / 2')}
<p>In the lab the Hamiltonian is ${m('H = a·Z + b·X + c·Y')} on one qubit, and the ansatz is ${m('R<sub>z</sub>(φ)R<sub>y</sub>(θ)|0⟩')}. The map shows the energy for every pair of parameters. Gradient descent, using parameter-shift gradients estimated from a finite number of shots, walks downhill toward the ground state.</p>
${LAB('vqe')}
<h2>The hard parts</h2>
<ul>
<li><strong>Shot noise.</strong> Every energy is a statistical estimate, so every gradient is noisy. Lower the shot count in the lab and watch the path wander.</li>
<li><strong>Barren plateaus.</strong> For many deep or random-looking circuits, gradients shrink exponentially with the number of qubits. The landscape becomes flat almost everywhere and the optimizer has nothing to follow.</li>
<li><strong>Hardware noise</strong> biases the measured energies and can hide the minimum.</li>
<li><strong>Classical competition.</strong> For many molecules and optimization problems, good classical methods already exist. Whether variational algorithms will give a practical advantage is still an open question.</li>
</ul>

/* ---------------- Lesson 17 · Noise and decoherence ---------------- */
LESSONS.push({
  id: 'decoherence', n: 17, stage: 4, minutes: 11, title: 'Noise and decoherence',
  lede: 'A qubit is never perfectly isolated. Its surroundings slowly learn about it, and the quantum information leaks away. Two time constants, T₁ and T₂, describe how fast.',
  html: `
<h2>Energy relaxation: T₁</h2>
<p>A qubit in its excited state ${m('|1⟩')} eventually hands its energy to the environment and drops to ${m('|0⟩')}. The excited population decays as ${m('e<sup>−t/T₁</sup>')}. On the Bloch sphere the vector is pulled toward the north pole. ${m('T₁')} is called the relaxation time.</p>
<h2>Dephasing: T₂</h2>
<p>Small random wobbles in the qubit’s frequency, from fluctuating fields or nearby defects, scramble the relative phase between ${m('|0⟩')} and ${m('|1⟩')}. Averaged over many runs, the horizontal part of the Bloch vector shrinks as ${m('e<sup>−t/T₂</sup>')}. Relaxation destroys phase as well, which is why ${m('T₂ ≤ 2T₁')} always holds.</p>
<p>Both processes shorten the Bloch vector. A shortened vector is no longer a pure state but a <strong>mixed state</strong>: a qubit that is partly random. In the lab, a small detuning makes the vector precess around the z axis while it decays, tracing the spiral seen in a Ramsey experiment.</p>
${EQ('x(t) = e<sup>−t/T₂</sup>[x₀ cos ωt − y₀ sin ωt],&nbsp;&nbsp; z(t) = 1 − (1 − z₀) e<sup>−t/T₁</sup>')}
${LAB('decay')}
<h2>Gate errors add up</h2>
<p>Every gate also has some chance of going wrong. If each gate succeeds with probability ${m('F')}, a circuit of ${m('G')} gates runs without a single error with probability about ${m('F<sup>G</sup>')}. At 99.9% per gate, 1,000 gates succeed only 37% of the time, and 10,000 gates almost never do.</p>
${LAB('budget')}

  html: `
<h2>Three obstacles</h2>
<p>Classical error correction copies each bit and takes a majority vote. Quantum information seems to rule that out three times over. You cannot copy an unknown state. Errors are continuous: a qubit can be rotated by a tiny angle, not just flipped. And measuring a qubit to check it destroys its superposition. Each obstacle turns out to have a way around it.</p>
<h2>The three-qubit bit-flip code</h2>
<p>Encode ${m('α|0⟩ + β|1⟩')} as ${m('α|000⟩ + β|111⟩')} with two CNOTs. This is not three copies of the state; it is a single entangled state of three qubits, so no-cloning is respected. If one qubit flips, measure two parities: does qubit 0 agree with qubit 1, and does qubit 1 agree with qubit 2? These checks are written ${m('Z₀Z₁')} and ${m('Z₁Z₂')}, and their results are the <strong>syndrome</strong>. The syndrome says which qubit flipped and nothing at all about ${m('α')} or ${m('β')}, so the superposition survives the check.</p>
<p>The parities are measured with two extra <strong>ancilla</strong> qubits. CNOTs copy each parity onto an ancilla, and only the ancillas are measured:</p>
<div class="wide" data-qec-circuit></div>
${LAB('bitflip')}
<h2>Continuous errors become discrete</h2>
<p>Suppose the error is a small rotation instead of a full flip. The state becomes a superposition of “no error” and “one qubit flipped”. Measuring the syndrome forces it to pick one: either no error at all, or one specific flip that the code then fixes. Here measurement is the hero. It turns an infinite family of small errors into a short list of correctable ones.</p>
<h2>Phase flips and the surface code</h2>
<p>The bit-flip code does nothing against phase flips, the Z errors. Peter Shor’s nine-qubit code of 1995 handles both by nesting a phase-flip code inside a bit-flip code. Most hardware efforts today use the <strong>surface code</strong>: data qubits on a square grid, with X-type and Z-type parity checks on neighbouring groups measured over and over. It needs only nearest-neighbour connections and tolerates physical error rates up to roughly 1%. A distance-${m('d')} surface code uses ${m('d²')} data qubits, and it takes at least ${m('d')} errors lined up across the grid to fool it.</p>
${LAB('surface')}
<h2>The threshold</h2>
<p>If physical errors are rare enough, below the code’s <strong>threshold</strong>, making the code bigger suppresses logical errors exponentially, roughly as ${m('(p/p<sub>th</sub>)<sup>(d+1)/2</sup>')}. Above the threshold, bigger codes make things worse, because there are more places for errors to occur. In 2024 Google reported a surface-code memory running below threshold, with the logical error rate falling by roughly half each time the code distance grew from 3 to 5 to 7.</p>
${LAB('threshold')}
${NOTE('The overhead', `<p>A useful logical qubit may need hundreds to a thousand physical qubits, plus fast classical decoding of the syndromes in real time. Some gates, such as T, cannot be done directly on surface-code qubits and need extra machinery called magic-state distillation. Much current research aims to cut this overhead with better codes and decoders.</p>`)}

LESSONS.push({
  id: 'hardware', n: 19, stage: 4, minutes: 13, title: 'Building a qubit',
  lede: 'A qubit can be made from almost any quantum two-level system. The hard part is making thousands of them that are controllable, connected and quiet.',
  html: `
<h2>What a good qubit needs</h2>
<p>In 2000 David DiVincenzo listed what any quantum computer needs, and the list still frames the field: a scalable system of well-defined qubits; a way to initialize them; coherence times much longer than gate times; a universal set of gates; and the ability to measure individual qubits. Quantum networks add two more: converting stationary qubits into flying ones, usually photons, and sending those faithfully.</p>
<h2>The dilution refrigerator</h2>
<p>Superconducting qubits, and many spin qubits, operate inside a dilution refrigerator that reaches about 10 mK, a hundredth of a degree above absolute zero. It cools in stages. A pulse-tube cooler takes the upper plates to about 50 K and 4 K, then a circulating mixture of helium-3 and helium-4 takes the bottom plate the rest of the way. The gold-plated copper plates hang one below the other, which is why these fridges are nicknamed chandeliers. This guide is organized around the same stages.</p>
${LAB('fridge')}
<h2>Why so cold?</h2>
<p>A superconducting qubit’s two levels are separated by the energy of one microwave photon, around 5 GHz. That energy, ${m('hf')}, corresponds to a temperature ${m('hf/k<sub>B</sub>')} of about 0.24 K. Unless the qubit is much colder than that, heat randomly kicks it into ${m('|1⟩')}. The thermal population of the excited state is</p>
${EQ('P(1) = 1 / (1 + e<sup>hf/k<sub>B</sub>T</sup>)')}
${LAB('thermal')}
<p>Superconductivity is the other reason: the aluminium circuits only superconduct below about 1 K, and losses fall further as the temperature drops.</p>
<h2>The main platforms</h2>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Platform</th><th>The qubit</th><th>How gates work</th><th>Strengths</th><th>Challenges</th></tr></thead><tbody>
<tr><td>Superconducting circuits</td><td>Two energy levels of a circuit built around Josephson junctions (the transmon is the most common)</td><td>Microwave pulses; gates take tens of nanoseconds</td><td>Fast gates; made with chip fabrication</td><td>Millikelvin cooling, dense wiring, mostly nearest-neighbour connections, device-to-device variation</td></tr>
<tr><td>Trapped ions</td><td>Two internal levels of single ions such as ytterbium, calcium or barium, held by electric fields in vacuum</td><td>Lasers or microwaves; shared motion of the ions couples them; gates take microseconds or longer</td><td>Very high fidelities, long coherence, any ion can talk to any other in a chain</td><td>Slower gates; scaling past one trap means shuttling ions or linking traps with photons</td></tr>
<tr><td>Neutral atoms</td><td>Atoms such as rubidium, cesium or strontium held in optical tweezers</td><td>Excitation to high-energy Rydberg states makes neighbouring atoms interact</td><td>Large, reconfigurable arrays of hundreds to thousands of atoms</td><td>Atom loss, slower cycles, demanding laser control</td></tr>
<tr><td>Photonic</td><td>Properties of single photons: path, polarization or arrival time</td><td>Linear optics plus measurement; often measurement-based computing</td><td>Photons barely decohere; natural fit for networking</td><td>Photon loss; photons do not interact easily; single-photon detectors are often cryogenic</td></tr>
<tr><td>Spin qubits</td><td>Spin of an electron or nucleus in a silicon quantum dot or donor atom</td><td>Microwave or electrical pulses; exchange interaction between neighbours</td><td>Tiny; compatible with semiconductor manufacturing; some run near 1 K</td><td>Device variability, wiring density</td></tr>
<tr><td>Topological</td><td>Non-local states of exotic quasiparticles such as Majorana zero modes</td><td>Measurements and braiding of quasiparticles</td><td>Built-in protection from local noise, in principle</td><td>Still experimental; the basic qubit is not yet established</td></tr>
</tbody></table></div>
<h2>Comparing machines</h2>
<p>Qubit count alone says little. What matters is two-qubit gate fidelity, measurement fidelity, connectivity, speed and crosstalk, and how these hold up as the system grows. Composite benchmarks such as quantum volume try to fold several of these into one number. For fault-tolerant computing the question that counts is how many good logical qubits a machine can run, and at what logical error rate.</p>
`,
