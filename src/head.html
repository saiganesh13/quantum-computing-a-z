<title>Into the Cryostat</title>
<meta name="description" content="An interactive guide to quantum computing, from the first qubit to error correction, by Sai Ganesh Chidambaram.">
<meta name="author" content="Sai Ganesh Chidambaram">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Math&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: a cryostat rail on the left lists five stages on a falling temperature scale (300 K to 10 mK);
   lessons read in a 68ch column of journal-style serif; labs break out to the full content width. */
:root{
  --bg:#edf0f4; --surface:#fafbfc; --surface-2:#e1e6ed; --ink:#131a29; --muted:#545f72; --line:#c5ccd7;
  --copper:#a2501a; --copper-hi:#dc9a62; --copper-lo:#7a3a10; --on-copper:#fff7ef; --copper-wash:#f2e2d3;
  --cyan:#0b6d80; --good:#1b774a; --bad:#ad332b; --scrim:rgba(8,12,20,.45);
  --is-dark:0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"STIX Two Text","Noto Sans Math",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:276px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e15; --surface:#111722; --surface-2:#192030; --ink:#e4e8f0; --muted:#8f99ad; --line:#283246;
    --copper:#e39c60; --copper-hi:#f3c592; --copper-lo:#a4602a; --on-copper:#1b1007; --copper-wash:#2d1e11;
    --cyan:#56c3d7; --good:#4fc48c; --bad:#f17d72; --scrim:rgba(0,0,0,.6);
    --is-dark:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e15; --surface:#111722; --surface-2:#192030; --ink:#e4e8f0; --muted:#8f99ad; --line:#283246;
  --copper:#e39c60; --copper-hi:#f3c592; --copper-lo:#a4602a; --on-copper:#1b1007; --copper-wash:#2d1e11;
  --cyan:#56c3d7; --good:#4fc48c; --bad:#f17d72; --scrim:rgba(0,0,0,.6);
  --is-dark:1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
::selection{background:var(--copper-wash)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);column-gap:44px;max-width:1460px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));
  overflow-y:auto;padding-block:30px 48px;padding-right:18px;border-right:1px solid var(--line);scrollbar-width:thin}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
main{min-width:0;flex:1;padding-block:0 72px;outline:none}
main:focus,main:focus-visible{outline:none}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;align-items:center;justify-content:space-between;gap:12px}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;
  font:500 13px/1.5 var(--f-mono);color:var(--muted)}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex}
}

/* ---------- brand + nav ---------- */
.brand{display:grid;gap:3px;text-decoration:none;color:var(--ink)}
.brand-name{font:800 23px/1 var(--f-display);letter-spacing:-.025em}
.brand-by{font:500 11.5px/1.3 var(--f-mono);color:var(--muted)}
.topbar .brand-name{font-size:20px}
.nav{display:grid;gap:22px;margin-top:30px}
.nav-home{display:flex;gap:10px;align-items:center;font:600 14px var(--f-display);color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:6px}
.nav-home:hover{color:var(--ink);background:var(--surface-2)}
.nav-home[aria-current="page"]{color:var(--ink);background:var(--copper-wash)}
.stage{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:10px}
.stage-temp{font:600 12px/1.25 var(--f-mono);color:var(--copper);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-body{border-left:1px solid var(--line);position:relative;padding-left:2px}
.stage-body::before{content:"";position:absolute;left:-9px;top:6px;width:17px;height:4px;border-radius:1px;
  background:linear-gradient(180deg,var(--copper-hi),var(--copper))}
.stage-name{font:700 11.5px/1.3 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);padding:0 0 6px 14px}
.nav-l{display:grid;grid-template-columns:20px minmax(0,1fr) 10px;gap:6px;align-items:baseline;padding:4px 8px 4px 12px;
  text-decoration:none;color:var(--muted);font:500 14.5px/1.35 var(--f-display);border-radius:6px}
.nav-l:hover{color:var(--ink);background:var(--surface-2)}
.nav-l[aria-current="page"]{color:var(--ink);background:var(--copper-wash)}
.nav-n{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums}
.pd{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);align-self:center}
.pd[data-s="seen"]{border-color:var(--copper)}
.pd[data-s="done"]{border-color:var(--copper);background:var(--copper)}
.nav-extra{display:grid;gap:2px;padding-top:6px;border-top:1px solid var(--line)}

/* ---------- drawer (mobile) ---------- */
.drawer{position:fixed;inset:0;z-index:40}
.drawer-scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer-panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--bg);overflow-y:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- buttons & controls ---------- */
.btn{font:600 14px/1 var(--f-display);padding:10px 14px;min-height:40px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--copper)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.btn.pri{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.btn.pri:hover{background:var(--copper-lo);border-color:var(--copper-lo)}
.btn.sm{min-height:32px;padding:7px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate{font:600 18px/1 var(--f-body);min-width:46px;height:46px;padding:0 8px;display:inline-grid;place-items:center;border:1.5px solid var(--ink);
  border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.gate:hover{background:var(--copper-wash)}
.gate[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.gate sub,.gate sup{font-size:11px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:9px 12px;font:600 13px/1 var(--f-display);color:var(--muted);cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:grid;gap:3px;min-width:0}
.field-top{display:flex;justify-content:space-between;gap:10px;font:600 13px/1.3 var(--f-display);color:var(--muted)}
.field-top output{font:500 13px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.field.off{opacity:.45}
input[type=range]{width:100%;accent-color:var(--copper);margin:4px 0;height:24px}
select.sel{font:600 14px var(--f-display);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.ctl-label{font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- lesson page ---------- */
.ph{padding-block:52px 30px;border-bottom:1px solid var(--line);margin-bottom:34px;display:grid;gap:14px}
.ph-eyebrow{font:600 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper);display:flex;flex-wrap:wrap;gap:4px 16px}
.ph h1{font:800 clamp(38px,5.6vw,68px)/1.02 var(--f-display);letter-spacing:-.032em;margin:0;text-wrap:balance}
.ph .lede{font-size:clamp(19px,2.2vw,23px);line-height:1.45;max-width:58ch;margin:0}
.ph-meta{font:500 13px/1.5 var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.ph-meta b{color:var(--ink);font-weight:600}
.prose{counter-reset:eq lab}
.prose>*{max-width:68ch}
.prose>.lab,.prose>.wide{max-width:none}
.prose h2{font:700 clamp(24px,2.6vw,30px)/1.15 var(--f-display);letter-spacing:-.018em;margin:52px 0 12px;text-wrap:balance}
.prose h3{font:700 20px/1.25 var(--f-display);margin:30px 0 8px}
.prose p{margin:0 0 16px}
.prose ul,.prose ol{margin:0 0 18px;padding-left:24px;display:grid;gap:7px}
.prose li::marker{color:var(--copper);font:600 .85em var(--f-mono)}
.prose a{color:var(--copper);text-decoration-thickness:1px;text-underline-offset:3px}
.prose strong{font-weight:700}
.m{white-space:nowrap;font-family:var(--f-body)}
.eq{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:20px 0 24px;padding-inline:clamp(0px,4vw,34px);
  font-size:21px;line-height:1.5;overflow-x:auto;counter-increment:eq}
.eq>span{white-space:nowrap}
.eq::after{content:"(" counter(eq) ")";font:500 13px var(--f-mono);color:var(--muted);flex:none}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.frac>span+span{border-top:1px solid currentColor;padding-top:1px}
.mx{display:inline-grid;vertical-align:middle;padding:3px 10px;position:relative;column-gap:16px;row-gap:2px;text-align:center;line-height:1.35}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:5px;border:1.5px solid currentColor}
.mx::before{left:0;border-right:0}.mx::after{right:0;border-left:0}
.note{margin:26px 0;padding:16px 20px;background:var(--surface-2);border-radius:10px;font-size:17px}
.note-tag{display:block;font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin-bottom:6px}
.note p:last-child{margin-bottom:0}
.tbl-wrap{overflow-x:auto;margin:22px 0 30px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.45}
.tbl th{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;
  background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700;white-space:nowrap}

/* ---------- labs ---------- */
.lab{margin:34px 0 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);counter-increment:lab;min-width:0}
.lab-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.lab-tag{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.lab-title{font:700 17px/1.3 var(--f-display);letter-spacing:-.005em}
.lab-body{padding:18px;display:grid;gap:18px;min-width:0}
.lab-cap{padding:12px 18px 14px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.5;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.wide-l{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.split,.split.even,.split.wide-l{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.cv{display:block;width:100%;touch-action:pan-y}
.cv.sq{aspect-ratio:1/1;max-width:100%}
.cv.grab{cursor:grab}.cv.grabbing{cursor:grabbing}
.readout{font:500 13px/1.65 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface-2);border-radius:8px;
  padding:10px 12px;overflow-x:auto;white-space:nowrap}
.readout .k{color:var(--muted)}
.ketline{font:400 21px/1.4 var(--f-body);overflow-x:auto;white-space:nowrap;padding-block:2px}
.status{font:500 15px/1.45 var(--f-body);padding:10px 12px;border-radius:8px;background:var(--copper-wash);color:var(--ink)}
.status.good{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--good)}
.status.bad{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--bad)}
.hint{font:400 14.5px/1.45 var(--f-body);color:var(--muted)}
.chipline{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px/1.5 var(--f-mono);color:var(--muted)}
.chipline b{color:var(--ink);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini{display:grid;gap:2px;text-align:center;font:600 12px var(--f-mono);color:var(--muted)}
.mini canvas{aspect-ratio:1/1;width:100%;max-width:170px;margin:0 auto}

/* bars */
.bars{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;height:170px;min-width:0}
.b-col{display:grid;grid-template-rows:16px minmax(0,1fr) auto;min-width:0;text-align:center}
.b-val{font:500 10.5px/16px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.b-track{position:relative;border-bottom:1.5px solid var(--line)}
.b-bar{position:absolute;left:10%;right:10%;bottom:0;height:0;border-radius:3px 3px 0 0;
  transition:height .5s cubic-bezier(.2,.7,.2,1),background-color .3s}
.b-mark{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.6}
.b-lab{font:400 13px/1.2 var(--f-body);padding-top:5px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.bars.dense .b-lab{font-size:10.5px;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;padding:4px 0 0}
.bars.dense .b-val{font-size:9px}

/* coin strip */
.strip{display:flex;flex-wrap:wrap;gap:3px;min-height:16px}
.strip i{width:12px;height:12px;border-radius:2px;display:block}
.c0{background:var(--cyan)}.c1{background:var(--copper)}

/* circuit svg */
.circ-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.circ{display:block}
.c-wire{stroke:var(--muted);stroke-width:1.2}
.c-box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.c-txt{fill:var(--ink);font:600 16px var(--f-body);text-anchor:middle;dominant-baseline:central}
.c-sub{fill:var(--ink);font:500 10px var(--f-body);text-anchor:start;dominant-baseline:central}
.c-dot{fill:var(--ink)}
.c-tgt{fill:none;stroke:var(--ink);stroke-width:1.5}
.c-line{stroke:var(--ink);stroke-width:1.5}
.c-cl{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3}
.c-lab{fill:var(--muted);font:500 12px var(--f-mono);dominant-baseline:central}
.c-hi{fill:var(--copper-wash)}
.c-at{stroke:var(--copper);stroke-width:2;stroke-dasharray:5 4}
.c-pend{fill:none;stroke:var(--copper);stroke-width:2;stroke-dasharray:4 3}
.c-hit{fill:transparent;cursor:pointer}
.c-hit:hover{fill:var(--copper-wash);fill-opacity:.6}
.c-hit:focus{outline:none}.c-hit:focus-visible{stroke:var(--copper);stroke-width:2}
.c-meter{fill:none;stroke:var(--ink);stroke-width:1.4}

/* tables inside labs */
.mini-tbl{width:100%;border-collapse:collapse;font:500 12.5px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.mini-tbl th{color:var(--muted);font-weight:600;text-align:center;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mini-tbl td{text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.mini-tbl tr.kept td{background:var(--copper-wash)}
.mini-tbl td.err{color:var(--bad);font-weight:700}
.scroll-x{overflow-x:auto;min-width:0}
.tt{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.tt button{display:grid;gap:2px;padding:6px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;
  font:500 11px var(--f-mono)}
.tt button b{font:700 18px/1 var(--f-mono)}
.tt button[data-v="1"] b{color:var(--copper)}
.tt button[data-q="1"]{box-shadow:inset 0 0 0 2px var(--cyan)}
.lamp{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font:700 13px var(--f-mono);
  color:var(--muted);background:var(--bg);transition:background-color .25s,color .25s}
.lamp[data-on="1"]{background:var(--copper);border-color:var(--copper);color:var(--on-copper)}
.lamp[data-on="0"]{background:var(--surface-2);color:var(--ink)}
.wheel{width:30px;height:30px;border-radius:50%;flex:none}

/* ---------- end of lesson ---------- */
.take{margin-top:52px;padding:22px 24px 8px;border-radius:12px;background:var(--surface-2)}
.take h2{margin-top:0 !important}
.quiz{margin-top:44px}
.q{display:grid;gap:10px;margin:0 0 28px}
.q-q{font-weight:600;margin:0}
.q-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.q-opt{display:flex;gap:10px;align-items:baseline;text-align:left;font:500 16px/1.35 var(--f-body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.q-letter{flex:none;font:600 11px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 5px;transform:translateY(-1px)}
.q-opt[data-r="right"] .q-letter,.q-opt[data-r="shown"] .q-letter{color:var(--good);border-color:var(--good)}
.q-opt[data-r="shown"]{border:1.5px dashed var(--good)}
.q-opt:disabled:not([data-r]){opacity:.55}
.quiz-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.quiz-head h2{margin-bottom:4px !important}
.quiz-meta{font:500 12px var(--f-mono);color:var(--muted)}
.quiz-score{display:flex;flex-wrap:wrap;gap:4px 18px;font:500 13px var(--f-mono);color:var(--muted);margin:0 0 22px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.quiz-score b{color:var(--ink)}
.quiz-sum{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--copper);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.q-why{line-height:1.5}
.q-opt:hover{border-color:var(--copper)}
.q-opt[data-r="right"]{border-color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.q-opt[data-r="wrong"]{border-color:var(--bad);color:var(--muted)}
.q-why{font-size:16px;margin:0;color:var(--muted)}
.q-why b{color:var(--ink)}
.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:56px;max-width:none !important}
